<script>
/* =========================================================
   PHẦN MỀM GIÁ THÀNH – nhiều năm, chuyển số dư đầu kỳ
   ========================================================= */
'use strict';

/* =====================================================================
   SƠ ĐỒ MÃ NGUỒN (để tùy biến cho công ty khác)
   PHẦN DÙNG CHUNG (giữ nguyên):
     Tiện ích · Lưu trữ (store/toDocs/fromDocs) · Giao diện (NAV, head, render)
     Lưới nhập liệu (GRID/vGrid) · Nhập Excel (importDialog/importAOA/TEMPLATE)
     Bảng kiểu Excel (enhanceTables) · Khóa kỳ · Thiết lập · Hướng dẫn
   PHẦN RIÊNG THEO CÔNG TY (sửa ở đây):
     [A] Định nghĩa dữ liệu: F (thứ tự cột), GRID (cột, công thức phụ), TEMPLATE/SAMPLES (mẫu Excel), NAV (menu)
     [B] Tính toán: calc() – giá vốn, trải định mức, 621/622/627/154, NXT, chuyển kỳ
     [C] Đề xuất: buildProposal / buildAdjProposal / applyProposalCore / proposalParams
     [D] Chuỗi tự chạy: runCalcFor / showCalcResult
     [E] Báo cáo: vTongQuan, vNXT, vGiaThanh, vNam, vCanhBao
     [F] Xuất kế toán: XK_HDR/NK_HDR, buildXK/buildNK, ktSettings
     [G] Dữ liệu mẫu: <script id="seed"> (để {} nếu không có)
   ===================================================================== */
// ---------- Tiện ích ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (v, d=0) => (v==null || v==='' || isNaN(v)) ? '' : Number(v).toLocaleString('vi-VN', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtQ = v => (v==null || isNaN(v)) ? '' : Number(v).toLocaleString('vi-VN', {maximumFractionDigits:3});
const fmtP = v => (v==null || isNaN(v)) ? '' : (v*100).toLocaleString('vi-VN', {maximumFractionDigits:1}) + '%';
const fmtD = s => { if(!s) return ''; const [y,m,d]=String(s).split('-'); return d && m && y ? `${d}/${m}/${y}` : s; };
const fmtKy = ky => { if(!ky) return ''; if(ky.startsWith('R:')) { const [,a,b]=ky.split(':'); return `${fmtD(a)} – ${fmtD(b)}`; } if(ky.length===4) return `cả năm ${ky}`; const [y,m]=ky.split('-'); return `${m}/${y}`; };
const kyOf = s => (s||'').slice(0,7);
const num = v => { if (v==null || v==='') return 0; if (typeof v==='number') return v; const t=String(v).trim().replace(/\s/g,''); let x; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) x=parseFloat(t.replace(/\./g,'').replace(',','.')); else x=parseFloat(t.replace(/,/g,'')); return isNaN(x)?0:x; };
const daysInMonth = ky => { const [y,m]=ky.split('-').map(Number); return new Date(y,m,0).getDate(); };
const nextKy = ky => { let [y,m]=ky.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
const todayKy = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const round = (v,d) => { const p=Math.pow(10,d); return Math.round(v*p)/p; };
const sum = (a, f) => a.reduce((s,x)=>s+(f?f(x):x),0);
function toISODate(v){
  if (v==null || v==='') return '';
  if (v instanceof Date) { if (isNaN(v)) return ''; return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; }
  if (typeof v==='number') { if (v<20000 || v>80000) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s=String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2})$/); if (m) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function toKy(v){
  if (v==null || v==='') return '';
  if (v instanceof Date || typeof v==='number') return kyOf(toISODate(v));
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/](\d{4})$/); if(m) return `${m[2]}-${m[1].padStart(2,'0')}`;
  const d=toISODate(s); return d?kyOf(d):'';
}
function markMiss(root, id, keys){ root.querySelectorAll('td.miss').forEach(td=>td.classList.remove('miss')); let first=null; keys.forEach(k=>{ const td=root.querySelector(`td.ed[data-id="${id}"][data-k="${k}"]`); if (td) { td.classList.add('miss'); if(!first) first=td; const clr=()=>td.classList.remove('miss'); td.addEventListener('input',clr,{once:true}); td.addEventListener('change',clr,{once:true}); } }); if (first) { const f=first.querySelector('input,select')||first; try{ f.focus(); }catch(e){} } }
const normS = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
function matchSearch(q, parts){ const n=normS(q).trim(); if (!n) return true; const hay=normS(parts.filter(x=>x!=null&&x!=='').join(' ')); return n.split(/\s+/).every(w=>hay.includes(w)); }
const dTxt = d => d ? `${d} ${fmtD(d)}` : '';
let _stm=null;
function bindSearch(){ const q=$('#q'); if(!q) return;
  const run=()=>{ const el=$('#q'); const pos=el?el.selectionStart:null; render(); const v=$('#q'); if (v) { v.focus(); const L=v.value.length; try{ v.setSelectionRange(pos==null?L:Math.min(pos,L), pos==null?L:Math.min(pos,L)); }catch(e){} } };
  q.oninput=e=>{ search=e.target.value; if (e.isComposing) return; clearTimeout(_stm); _stm=setTimeout(run, 220); };
  q.addEventListener('compositionend', e=>{ search=e.target.value; clearTimeout(_stm); _stm=setTimeout(run, 120); });
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

// ---------- Định nghĩa dữ liệu ----------
const NHOM = ['Thành phẩm','NVLC','PG','GV','BB','Khác'];
const F = {
  items:    ['ma','ten','nhom','dvt','kho'],
  bom:      ['loai','maTP','maNVL','slTP','slNVL','lanNgay','haoHut','maThayThe','tuNgay','denNgay','tyLe','ghiChu'],
  purchases:['ngayNhap','ngayMua','hoaDon','ncc','ma','sl','donGia','tt','kho','ghiChu'],
  orders:   ['maLenh','ngayXuatNVL','ngaySX','maTP','loaiDM','soMeKH','dieuChinhMe','ghiChu','dcPM'],
  adjustments:['maLenh','maVT','dieuChinh','lyDo'],
  issues:   ['maPhieu','ngay','maVT','sl','lyDo','loai'],
  sales:    ['ngay','ma','sl','donGia','doanhSo','ghiChu'],
  plan:     ['ngaySX','maTP','soMe','ghiChu'],
  subs:     ['maTP','maNVL','maThayThe','tuNgay','denNgay','tyLe','ghiChu'],

const store = {

  async init(){

function dbBackend(db){
  const col = db.collection('gt');
  return {
    async loadAll(){ const snap = await col.get(); const o={}; snap.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); return o; },
    async put(k,v){ await col.doc(k).set(v); },
    async del(k){ await col.doc(k).delete(); },
  };
}
function idbBackend(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('giathanh_kh', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('docs');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const idb = req.result;
      const tx = (mode, fn) => new Promise((r, j)=>{ const t=idb.transaction('docs', mode); const s=t.store||t.objectStore('docs'); const q=fn(s); t.oncomplete=()=>r(q && q.result); t.onerror=()=>j(t.error); });
      res({
        async loadAll(){ const o={}; await new Promise((r,j)=>{ const t=idb.transaction('docs'); const c=t.objectStore('docs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=r; t.onerror=()=>j(t.error); }); return o; },
        put(k,v){ return tx('readwrite', s=>s.put(v,k)); },
        del(k){ return tx('readwrite', s=>s.delete(k)); },
      });
    };
  });
}

  state.purchases=[]; state.sales=[]; state.issues=[]; state.orders=[]; state.adjustments=[]; state.costs={}; state.plan=[]; state.cal=[];

function ctCols(p){
  const IM=itemMap(); const om={}; p.orders.forEach(o=>om[o.maLenh]=o);
  const O=x=>om[x.maLenh]||{}; const raw=x=>O(x).o||{};
  return [
    {t:'Lệnh SX', f:x=>x.maLenh},
    {t:'Ngày SX', d:1, f:x=>x.ngaySX},
    {t:'Ngày xuất NVL', d:1, f:x=>x.ngayXuatNVL},
    {t:'Công đoạn', f:x=>'Sản xuất'},
    {t:'Mã thành phẩm', f:x=>x.maTP},
    {t:'Tên thành phẩm', f:x=>(IM[x.maTP]||{}).ten||''},
    {t:'ĐVT TP', f:x=>(IM[x.maTP]||{}).dvt||''},
    {t:'SL lệnh', n:1, d:2, f:x=>num(raw(x).soMeKH)*num(O(x).slTP)},
    {t:'Điều chỉnh TP', n:1, d:2, f:x=>num(raw(x).dieuChinhMe)*num(O(x).slTP)},
    {t:'SL thực hiện', n:1, d:2, f:x=>x.slTH},
    {t:'Số mẻ', n:1, d:2, f:x=>x.soMe},
    {t:'Mã NVL / VT', f:x=>x.maVT},
    {t:'Tên NVL / VT', f:x=>(IM[x.maVT]||{}).ten||''},
    {t:'Nhóm', f:x=>(IM[x.maVT]||{}).nhom||''},
    {t:'ĐVT', f:x=>(IM[x.maVT]||{}).dvt||''},
    {t:'Loại', f:x=>(x.loaiDM||'DM')+(x.thayThe?' – thay thế':'')},
    {t:'Định mức', n:1, d:4, f:x=>x.dm},
    {t:'Mẻ / SL', n:1, d:2, f:x=>O(x).slTP},
    {t:'SL theo ĐM', n:1, d:2, f:x=>x.slDM},
    {t:'Cân đối', n:1, d:2, f:x=>x.tong-x.slDM},
    {t:'Tổng SL xuất', n:1, d:2, f:x=>x.tong},
    {t:'Đơn giá', n:1, d:0, f:x=>x.dg},
    {t:'621 Thành tiền', n:1, f:x=>x.tt, sum:1},
    {t:'Tỷ trọng 621 trong lệnh', n:1, pct:1, f:x=>O(x).c621?x.tt/O(x).c621:0},
    {t:'622 phân bổ', n:1, f:x=>x.c622, sum:1},
    {t:'627 phân bổ', n:1, f:x=>x.c627, sum:1},
    {t:'154 Giá thành', n:1, f:x=>x.c154, sum:1},
    {t:'Giá thành/đv lệnh', n:1, f:x=>O(x).slTH?O(x).c154/O(x).slTH:0},
  ];
}
function ctExport(p){
  if (typeof XLSX==='undefined') return null; const cols=ctCols(p);
  const rows=p.lines.filter(x=>matchSearch(search,[x.maLenh,x.maVT,x.maTP,(itemMap()[x.maVT]||{}).ten,(itemMap()[x.maTP]||{}).ten,dTxt(x.ngaySX),dTxt(x.ngayXuatNVL)]));
  const aoa=[cols.map(c=>c.t), ...rows.map(x=>cols.map(c=>{ const v=c.f(x); return (c.n && typeof v==='number') ? round(v,6) : (v==null?'':v); }))];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=cols.map(c=>({wch:Math.max(11,Math.min(30,c.t.length+3))})); return ws;
}

      else data = state[v.ent].slice().sort((a,b)=>String(a[KYFIELD[v.ent]||'maLenh']).localeCompare(String(b[KYFIELD[v.ent]||'maLenh']))).map(r=>v.cols.map(c=>r[c[0]]));
    }
    const ws = withData ? XLSX.utils.aoa_to_sheet([hdr, ...data]) : sampleSheet(s, hdr);
    ws['!cols'] = v.cols.map(c=>({wch: Math.max(12, Math.min(34, c[1].length+2))}));
    XLSX.utils.book_append_sheet(wb, ws, s);
  });

}

let downloadsCap = null;
async function saveFile(name, blob){
  try { if (window.claude && typeof claude.use==='function') { if (downloadsCap===null) downloadsCap = (await claude.use('downloads')) || false; if (downloadsCap) { await downloadsCap.save({filename:name, data:blob}); toast('Đã lưu '+name); return; } } } catch(e){ if (e && e.code==='declined') return; console.warn(e); }
  try { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000); } catch(e){ toast('Trình duyệt không cho phép tải file ở đây. Hãy mở phần mềm trong tab riêng.'); }
}
const XL_FONT = {name:'Aptos Narrow', size:11};
async function saveWb(wb, name){
  const mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if (typeof ExcelJS==='undefined') { const out = XLSX.write(wb, {bookType:'xlsx', type:'array'}); return saveFile(name, new Blob([out], {type:mime})); }
  try {
    const ewb = new ExcelJS.Workbook();
    wb.SheetNames.forEach(sn=>{
      const ws = wb.Sheets[sn]; const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      const es = ewb.addWorksheet(sn); const hdrRow = (sn==='XK NVL'||sn==='NK TP') ? 8 : 1; const widths=[];
      aoa.forEach((row,ri)=>{ const er = es.getRow(ri+1); row.forEach((v,ci)=>{ if (v==null || v==='') return; const c = er.getCell(ci+1); let w;
        if (v instanceof Date) { c.value=v; c.numFmt='dd/mm/yyyy'; w=10; }
        else if (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) { c.value=new Date(v+'T00:00:00'); c.numFmt='dd/mm/yyyy'; w=10; }
        else if (typeof v==='string' && /^\d{4}-\d{2}$/.test(v)) { c.value=new Date(v+'-01T00:00:00'); c.numFmt='mm/yyyy'; w=8; }
        else if (typeof v==='number') { c.value=v; c.numFmt = Number.isInteger(v) ? '#,##0' : '#,##0.####'; w=String(Math.round(v)).length+4; }
        else { c.value=v; w=Math.min(40, String(v).length+2); }
        c.font = ri+1===hdrRow ? {...XL_FONT, bold:true} : XL_FONT; widths[ci]=Math.max(widths[ci]||0, w); }); });
      const pctCols=new Set(); if (aoa[hdrRow-1]) aoa[hdrRow-1].forEach((h,ci)=>{ if (typeof h==='string' && /^Tỷ (trọng|lệ)/.test(h)) pctCols.add(ci); });
      aoa.forEach((row,ri)=>{ if (ri+1<=hdrRow) return; row.forEach((v,ci)=>{ if (pctCols.has(ci) && typeof v==='number' && Math.abs(v)<=5) { const c=es.getRow(ri+1).getCell(ci+1); c.numFmt='0.0%'; } }); });
      const cols = ws['!cols']||[]; for (let i=0;i<widths.length;i++) { es.getColumn(i+1).width = (cols[i]&&cols[i].wch) || Math.max(8, widths[i]||8); }
      if (aoa.length>=hdrRow) { const hr=es.getRow(hdrRow); hr.alignment={wrapText:true, vertical:'middle'}; hr.eachCell(c=>{ c.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FFFFF2CC'}}; c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}; }); es.views=[{state:'frozen', ySplit:hdrRow}]; }
    });
    const buf = await ewb.xlsx.writeBuffer(); saveFile(name, new Blob([buf], {type:mime}));
  } catch(e) { console.error(e); const out = XLSX.write(wb, {bookType:'xlsx', type:'array'}); saveFile(name, new Blob([out], {type:mime})); }
}
function exportSheet(name, sheet, json){ const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(json), sheet); saveWb(wb, name); }

  &nbsp;&nbsp;Cuối tháng: Chi phí 622 / 627 (nhập tay) → phân bổ vào từng lệnh theo tỷ lệ 621 → 154 = 621 + 622 + 627 → giá thành đơn vị và giá vốn TP. Kiểm tra & cảnh báo: mã thiếu, lệnh thiếu định mức, NVL chưa có giá vốn, tồn âm.<br>

  &nbsp;&nbsp;Bấm <b>▶ Tính giá thành</b> (chọn tháng) → phần mềm tự chạy 3 bước: (1) giá thành theo lệnh kế hoạch → (2) <b>Đề xuất sản xuất</b> tăng/giảm mẻ theo tồn NVLC & năng lực, <b>tự áp dụng</b> vào <b>Lệnh sản xuất thực tế</b> rồi tính lại → (3) nếu NXT còn âm: lập <b>Đề xuất điều chỉnh NVL</b>. Bảng thông báo cuối cùng cho bấm <i>Áp dụng điều chỉnh NVL & tính lại</i> hoặc mở Lệnh SX thực tế để sửa tay (cột Điều chỉnh mẻ, thêm lệnh tay) rồi Tính giá thành lại → xem <b>Giá thành</b>.<br>
  <b>4 · Báo cáo</b> (theo tháng hoặc cả năm)<br>
  &nbsp;&nbsp;NXT – Tổng hợp năm – <b>File tải dữ liệu Misa</b> (phiếu xuất NVL / nhập TP theo mẫu nhập vào phần mềm kế toán). <b>Tổng quan</b> và <b>Cảnh báo & kiểm tra</b> đặt ở đầu menu để xem nhanh mỗi ngày.<br>
  <b>Chuyển kỳ</b>: tồn cuối tháng → tồn đầu tháng sau, tháng 12 → tháng 1 năm sau, tự động; không khóa sổ thủ công. Sao lưu .json cuối mỗi tháng tại Thiết lập.</div></div>
  <div class="box"><h3>Công thức áp dụng (giống file Excel gốc)</h3><ul class="tight">
  <li>Giá vốn kỳ = (Tồn đầu TT + Nhập TT) ÷ (Tồn đầu SL + Nhập SL). Thành phẩm: Nhập = sản lượng và giá thành 154 của các lệnh trong kỳ.</li>
  <li>SL NVL theo định mức = Định mức/mẻ × Số mẻ (làm tròn 2). Tổng xuất = SL theo ĐM + Điều chỉnh. 621 = Tổng xuất × Giá vốn.</li>
  <li><b>Điều chỉnh NVL theo lệnh</b> có 2 chiều: <b>giảm (−)</b> do phần mềm đề xuất khi NVL âm kho (tại đúng lệnh làm tồn âm, đưa tồn về 0) hoặc bạn nhập; <b>tăng (+)</b> chỉ do bạn nhập tay (xuất thêm NVL cho lệnh so với định mức, ví dụ hao hụt thực tế, làm lại mẻ). Cả hai cộng dồn vào Tổng SL xuất của lệnh – mã VT đó; nhập tại Điều chỉnh NVL (+ Thêm dòng / Nhập Excel) hoặc bấm vào lệnh ở Giá thành.</li>
  <li>NVL thay thế: ngày SX trong [Từ – Đến ngày] → thay toàn bộ, hoặc tách gốc (1 − tỷ lệ) + thay thế (tỷ lệ).</li>
  <li>622 và 627 của lệnh được phân bổ <b>theo sản lượng (kg)</b> (mặc định): 622 lệnh = Tổng 622 tháng × (SL sản xuất lệnh ÷ Tổng SL sản xuất tháng); 627 tương tự (627 gồm chi phí nhập + giá trị xuất NVL dùng chung). Có thể đổi sang phân bổ theo giá trị NVL (621) ở Hệ thống → Thiết lập & sao lưu → tab Phân bổ 622 / 627 (chọn riêng cho 622 và 627). 154 = 621 + 622 + 627.</li>
  <li><b>Mua hàng – cột "Mua hàng chưa HĐ"</b>: <b>x</b> = ngày nhập kho khác ngày hóa đơn; <b>số hóa đơn</b> (VD 00005482) = hóa đơn đã bị tách và đây là dòng nhập kho đúng ngày hóa đơn; <b>x - số hóa đơn</b> = dòng tách của hóa đơn đó, hàng về ngày khác. <b>Tách dòng</b> khi một hóa đơn hàng về nhiều đợt: bấm <b>✂ Tách</b> ở dòng gốc → dòng mới hiện ngay bên dưới (đã điền hóa đơn, ngày hóa đơn, nhà cung cấp, mã hàng, đơn giá) → gõ Ngày nhập kho và Số lượng (thành tiền tự nhảy; hóa đơn ghi số tiền khác thì gõ lại Thành tiền, đơn giá tự tính theo). Dòng gốc tự trừ và tô xanh để xem trước, tô đỏ nếu tách quá số lượng. Bấm Lưu để ghi (tổng số lượng và thành tiền hóa đơn không đổi); bấm Xóa ở dòng mới thì dòng gốc giữ nguyên.</li>
  <li><b>Xuất vật tư dùng chung</b> có 2 loại (cột Loại xuất): <b>Thử nghiệm (641)</b> – xuất NVL để thử nghiệm sản phẩm, chỉ trừ tồn kho, giá trị (SL × giá vốn kỳ) tính vào chi phí 641, <b>không</b> vào giá thành; <b>Dùng chung SX (627)</b> – xuất NVL dùng chung cho sản xuất, giá trị (SL × giá vốn kỳ) <b>cộng vào chi phí 627 của tháng</b> rồi phân bổ vào các lệnh theo tỷ lệ 621. Hai khoản này hiện ở màn hình Chi phí 622/627 (cột "627 từ xuất NVL dùng chung", "641 xuất NVL thử nghiệm").</li>
  <li>Tồn cuối SL = Tồn đầu + Nhập − Xuất; Tồn cuối TT = Tồn đầu TT + Nhập TT − Xuất SL × Giá vốn (bằng 0 khi SL = 0).</li>
  <li>Lãi gộp = SL bán × (Giá bán − Giá vốn kỳ); Giá bán = Doanh số ÷ SL.</li></ul></div>
  <div class="box"><h3>Phát hiện sai – muốn làm lại từ đầu thì làm thế nào?</h3><div class="small" style="line-height:1.7">
  Nguyên tắc chung: <b>sửa dữ liệu gốc ở nhóm 1–2, rồi bấm ▶ Tính giá thành lại</b>. Phần mềm luôn tính lại tuần tự từ kỳ bắt đầu đến tháng chọn, nên sửa tháng nào cũng kéo theo các tháng sau. Cụ thể theo từng bước:</div>
  <table style="margin-top:8px"><thead><tr><th>Đang ở bước / phát hiện</th><th>Cách làm lại</th></tr></thead><tbody>
  <tr><td>Sai <b>Danh mục / Số dư đầu kỳ / Định mức</b></td><td>Sửa trực tiếp (Sửa dòng, Nhập Excel chế độ thay thế). Định mức đổi NVL vĩnh viễn: đặt <i>Hiệu lực đến</i> dòng cũ + thêm dòng mới có <i>Hiệu lực từ</i>; đổi tạm thời: bảng NVL thay thế. Rồi Tính giá thành lại (tick <i>Đề xuất lại từ đầu</i> nếu muốn PM xếp lại mẻ).</td></tr>
  <tr><td>Thiếu / sai <b>Mua hàng, Bán hàng, Xuất dùng chung</b></td><td>Bổ sung hoặc sửa dòng ở nhóm 2 (Nhập Excel cùng tháng chọn <i>Thay thế các kỳ có trong tệp</i> để không trùng). Sau đó Tính giá thành lại. Bán hàng không đổi giá thành, chỉ đổi tồn TP, lãi và số liệu đề xuất.</td></tr>
  <tr><td>Sai <b>Lệnh sản xuất kế hoạch</b></td><td>Sửa ở <i>Lệnh sản xuất (kế hoạch)</i>. Vì lệnh thực tế = kế hoạch + điều chỉnh mẻ, nên nếu kỳ đã có mẻ PM xếp, hãy Tính giá thành với <i>Đề xuất lại từ đầu</i> để PM xếp lại trên lệnh kế hoạch đúng.</td></tr>
  <tr><td>Đã chạy <b>Tính giá thành</b> (PM đã xếp mẻ tăng/giảm) nhưng muốn <b>đề xuất lại</b></td><td>Bấm <b>⟲ Về lại lệnh SX kế hoạch</b> (ở Đề xuất sản xuất hoặc Lệnh SX thực tế) <i>hoặc</i> tick <b>Đề xuất lại từ đầu</b> trong hộp Tính giá thành. PM xóa toàn bộ của tháng đó: mẻ tăng/giảm (kể cả sửa tay), lệnh do PM/bạn thêm ở Lệnh SX thực tế, mọi dòng Điều chỉnh NVL → về đúng lệnh kế hoạch rồi chạy lại 3 bước.</td></tr>
  <tr><td>Đã chốt lệnh thực tế, chỉ muốn <b>chỉnh vài lệnh</b></td><td>Sửa cột <i>Điều chỉnh mẻ</i> hoặc thêm lệnh tay ở Lệnh SX thực tế → Tính giá thành lại (không tick Đề xuất lại). PM giữ nguyên lệnh thực tế, chỉ tính lại và lập lại đề xuất NVL.</td></tr>
  <tr><td>Sai <b>Điều chỉnh NVL</b> (đã áp dụng)</td><td>Vào Điều chỉnh NVL: Sửa / Xóa từng dòng (lọc cột Lý do = "Đề xuất PM" để thấy các dòng PM ghi) → Tính giá thành lại; PM lập đề xuất NVL mới ở bước 3 cho phần còn âm. Muốn xóa sạch điều chỉnh của kỳ: nút ⟲ Về lại lệnh SX kế hoạch (lưu ý xóa cả mẻ PM đã xếp).</td></tr>
  <tr><td>Sai <b>Chi phí 622/627</b></td><td>Sửa số tháng đó → Tính giá thành lại. Chỉ ảnh hưởng 622/627/154, không ảnh hưởng mẻ hay NVL.</td></tr>
  <tr><td>Tháng đã <b>Khóa kỳ</b></td><td>Bấm 🔒 Khóa kỳ → bỏ chọn tháng để mở khóa → sửa → tính lại → khóa lại. Khóa kỳ chỉ chặn sửa, không chặn tính lại.</td></tr>
  <tr><td>Muốn <b>làm lại hoàn toàn</b> một tháng</td><td>Nhập Excel chế độ <i>Thay thế các kỳ có trong tệp</i> cho Mua/Bán/Lệnh SX/Xuất chung của tháng đó (tệp mới thay toàn bộ dữ liệu tháng), tick Đề xuất lại từ đầu, Tính giá thành.</td></tr>
  <tr><td>Muốn <b>làm lại toàn bộ phần mềm</b></td><td>Thiết lập & sao lưu → Sao lưu .json trước → Xóa toàn bộ dữ liệu → nhập lại từ nhóm 1. Có thể khôi phục từ tệp .json bất cứ lúc nào.</td></tr>
  </tbody></table></div>
  <div class="box"><h3>Trạng thái rủi ro và Phân loại trong báo cáo Nhập – Xuất – Tồn</h3><div class="small" style="line-height:1.7">
  Mỗi mã hàng trong NXT được phần mềm gắn <b>Trạng thái rủi ro</b> (chữ mô tả, có thể có nhiều trạng thái cùng lúc) và <b>Phân loại</b> (<span class="pill bad">Rủi ro cao</span> / <span class="pill warn">Cảnh báo</span> / <span class="pill ok">OK</span>). Phân loại lấy theo trạng thái nặng nhất; mã không có trạng thái nào là OK. Lọc cột Phân loại bằng nút ▼ để xem nhanh các mã cần xử lý.<br>
  <b>Các đại lượng dùng để xét:</b> <i>BQ/ngày</i> = số lượng phát sinh trong tháng ÷ số ngày đến lệnh sản xuất cuối cùng của tháng (thành phẩm tính theo số bán ra; NVL tính theo xuất cho sản xuất + xuất dùng chung). <i>Số ngày còn dùng</i> = Tồn cuối SL ÷ BQ/ngày. <i>Cần lấy 5 ngày</i> = BQ/ngày × 5 − tồn cuối (phần NVL cần mua thêm để đủ dùng 5 ngày).</div>

  <tr><td>Tồn thấp - cần mua</td><td>NVL, phụ gia, gia vị, bao bì</td><td>Tồn cuối chưa đủ dùng 5 ngày (Cần lấy 5 ngày &gt; 0)</td><td><span class="pill bad">Rủi ro cao</span></td><td>Mua bổ sung theo số "Cần lấy 5 ngày".</td></tr>
  <tr><td>Tồn trên 3 tháng - không mua thêm (NVL quá dư)</td><td>NVL chính (NVLC)</td><td>Số ngày còn dùng &gt; 90</td><td><span class="pill bad">Rủi ro cao</span></td><td>Ngừng mua; PM đề xuất tăng sản xuất thành phẩm dùng NVLC này.</td></tr>
  <tr><td>Tồn trên 1 năm - không mua thêm (NVL quá dư)</td><td>Phụ gia, gia vị, bao bì</td><td>Số ngày còn dùng &gt; 365</td><td><span class="pill bad">Rủi ro cao</span></td><td>Ngừng mua, xem xét xử lý tồn.</td></tr>
  <tr><td>Chưa xây dựng định mức</td><td>NVL và vật tư (có nhóm hàng)</td><td>Mã không xuất hiện ở bảng <b>Định mức</b> (cột Mã NVL hoặc cột NVL thay thế của định mức) <b>và</b> không xuất hiện ở bảng <b>NVL thay thế</b> (cột NVL gốc hoặc NVL thay thế). Có mặt ở một trong các nơi này là coi như đã có định mức.</td><td><span class="pill warn">Cảnh báo</span></td><td>Bổ sung định mức hoặc bỏ mã nếu không còn dùng.</td></tr>
  <tr><td>TP có SX - chưa bán ra</td><td>Thành phẩm</td><td>Có tồn đầu hoặc nhập trong kỳ nhưng chưa bán lần nào</td><td><span class="pill warn">Cảnh báo</span></td><td>Kiểm tra bán hàng chưa nhập hoặc sản phẩm chưa có đầu ra.</td></tr>

  <div class="box"><h3>Cách phần mềm đề xuất sản xuất (tăng / giảm mẻ)</h3><div class="small" style="line-height:1.75">
  <b>Khi nào chạy:</b> mỗi lần bấm <b>▶ Tính giá thành</b> một tháng (bước 2/3). Sau khi tính giá thành theo lệnh kế hoạch, phần mềm lập đề xuất rồi <b>tự áp dụng</b> vào <i>Lệnh sản xuất thực tế</i> và tính lại. Kỳ đã áp dụng hoặc đã sửa tay thì giữ nguyên, muốn đề xuất lại phải tick <i>Đề xuất lại từ đầu</i> (hoặc ⟲ Về lại lệnh SX kế hoạch). Xem chi tiết ở Menu 3 → Đề xuất sản xuất → tab 1.<br>
  <b>Đối tượng xét:</b> từng <b>NVL chính (nhóm NVLC)</b> và các <b>thành phẩm</b> dùng NVLC đó trong định mức (loại DM). Số liệu lấy từ tồn cuối tháng, bình quân xuất/ngày (BQ/ngày) và <i>Số ngày còn dùng</i> = tồn cuối ÷ BQ/ngày.<br>
  <b>Ba trường hợp, xét theo từng NVLC:</b>
  <ol style="margin:4px 0 4px 18px">
  <li><b>NVLC âm kho → GIẢM sản xuất.</b> Chọn thành phẩm còn tồn nhiều ngày nhất trong số TP dùng NVLC đó. Số mẻ giảm = phần âm ÷ NVLC dùng/mẻ (làm tròn lên), nhưng không vượt quá <b>số mẻ đã sản xuất</b> trong kỳ và <b>số mẻ tương ứng tồn TP</b> hiện có. Nếu giảm hết mức vẫn chưa bù đủ thì ghi rõ phần còn thiếu để bạn xử lý bằng điều chỉnh NVL. Mẻ giảm được trừ vào các lệnh gần nhất của TP đó.</li>
  <li><b>NVLC còn dùng quá <i>Mốc tồn lâu</i> (mặc định 75 ngày) → TĂNG sản xuất để tiêu thụ.</b> Phần dư = tồn cuối − BQ/ngày × mốc tồn lâu. Dư này được chia lần lượt cho các TP dùng NVLC đó theo <b>thứ tự ưu tiên</b>: (1) TP còn tồn ít ngày bán nhất, (2) lãi gộp/đv cao hơn, (3) dùng nhiều NVLC/mẻ hơn. Mỗi TP được tăng tối đa số mẻ mà phần dư cho phép, rồi phần dư còn lại chuyển cho TP kế tiếp.</li>
  <li><b>Thành phẩm âm kho → TĂNG để bù.</b> Số mẻ = tồn âm ÷ SL/mẻ (làm tròn lên), xét giới hạn như dưới đây.</li>
  </ol>
  <b>Giới hạn khi tăng mẻ</b> (mẻ tăng chỉ được lấy mức thấp nhất của các giới hạn sau, để không tạo ra tồn âm mới):
  <ul style="margin:4px 0 4px 18px">
  <li><b>Các NVL khác</b> trong định mức của TP (chỉ xét NVL có tỷ trọng giá trị &gt; <i>ngưỡng bỏ qua</i>, mặc định 10%; bao bì, gia vị nhỏ bị bỏ qua): lượng NVL còn lại = tồn cuối − BQ/ngày × <i>Dự phòng</i> (mặc định 5 ngày) − lượng đã giữ chỗ cho các đề xuất trước đó trong cùng lần chạy.</li>
  <li><b>Năng lực sản xuất</b>: mỗi ngày tối đa <i>Lần/ngày</i> trong Định mức; chỉ tính các ngày còn trống trong khoảng được phép xếp (dưới đây).</li>
  <li>Nếu hết năng lực hoặc thiếu NVL chính, dòng đề xuất ghi "Không tăng" kèm lý do.</li>
  </ul>
  <b>Xếp mẻ vào ngày nào:</b> chỉ trong <b>tháng đang tính</b>, từ đầu tháng đến <b>ngày có lệnh sản xuất cuối cùng</b> (ngày bạn đã nhập dữ liệu tới), ưu tiên các ngày gần nhất còn trống năng lực, lùi dần về đầu tháng. Không xếp vào ngày tương lai và <b>không xếp vào ngày nghỉ</b> (mặc định nghỉ Chủ nhật; ngày lễ / nghỉ chờ việc khai ở Hệ thống → Thiết lập & sao lưu → tab Lịch nghỉ / tăng ca; ngày khai <i>Tăng ca</i> được coi là ngày làm việc). Lệnh đã có sẵn ở ngày nghỉ vẫn giữ nguyên. Nếu ngày đó đã có lệnh của TP thì cộng thêm vào cột <i>Điều chỉnh mẻ</i>, chưa có thì tạo lệnh mới (mẻ kế hoạch = 0, ghi chú "Đề xuất SX").<br>
  <b>Kế hoạch chốt theo thành phẩm:</b> gộp các đề xuất cùng một TP (không trùng mã): tổng mẻ tăng, mẻ giảm, mẻ đã sản xuất, tổng mẻ sau điều chỉnh. Bảng bên cạnh liệt kê NVL còn thiếu nếu muốn thực hiện đủ mẻ tăng (cần mua thêm).<br>
  <b>Sau đề xuất mẻ:</b> phần mềm tính lại giá thành và NXT, rồi lập tiếp <b>đề xuất điều chỉnh NVL</b> cho các mã còn âm (chỉ giảm, xem mục Công thức). Bạn kiểm tra ở Lệnh sản xuất thực tế và Điều chỉnh NVL, sửa tay nếu cần rồi tính lại.</div></div>
  <div class="box"><h3>Thiết lập cho đề xuất – ở đâu, nghĩa là gì, đổi giữa chừng thì sao?</h3>
  <table style="margin-top:4px"><thead><tr><th>Thiết lập</th><th>Vào đâu để đổi</th><th>Ý nghĩa / cách PM dùng</th></tr></thead><tbody>

  <tr><td><b>Khoảng ngày xếp mẻ</b></td><td>Tự động</td><td>Mẻ tăng/giảm chỉ xếp <b>trong tháng đang tính</b>, từ đầu tháng đến ngày có lệnh SX cuối cùng (ngày bạn đã nhập dữ liệu tới), ưu tiên các ngày gần nhất còn trống năng lực; không xếp vào ngày tương lai. Mẻ giảm trừ vào lệnh gần nhất của thành phẩm đó.</td></tr>

  <div class="small" style="line-height:1.7;margin-top:8px"><b>Đổi thiết lập giữa chừng</b>: các tham số lưu chung cho mọi tháng và chỉ có tác dụng ở <b>lần Tính giá thành kế tiếp</b>, không tự sửa những gì đã xếp. Vì vậy:<br>

  • Tháng <b>đã chạy</b> (PM đã xếp mẻ) và muốn đề xuất theo tham số mới: Tính giá thành với tick <b>Đề xuất lại từ đầu</b> (hoặc ⟲ Về lại lệnh SX kế hoạch rồi tính). Không tick → PM giữ nguyên lệnh thực tế hiện có.<br>

// ---------- Kế hoạch & đề xuất sản xuất ----------
function capRule(maTP, date){ if(!date) return null; const c=state.caps.filter(x=>x.maTP===maTP && x.tuNgay && date>=x.tuNgay && date<=(x.denNgay||'9999-12-31')).sort((a,b)=>b.tuNgay.localeCompare(a.tuNgay)); return c[0]||null; }
function bomInfo(maTP, loai='DM', date){ const rows=bomFor(maTP, loai, date); const r=date?capRule(maTP,date):null; return {slTP: rows.length?num(rows[0].slTP):0, lanNgay: r? num(r.lanNgay) : (rows.length?num(rows[0].lanNgay):0), meThang: r? num(r.meThang):0, capSrc: r?'thời kỳ':'định mức', rows}; }
function ordersOn(ngay, maTP){ return state.orders.filter(o=>o.ngaySX===ngay && o.maTP===maTP); }
function planStatus(r){
  const os = ordersOn(r.ngaySX, r.maTP); const me = num(r.soMe);
  if (!os.length) return me>0 ? {code:'new', text:'Chưa có lệnh → tạo mới'} : {code:'none', text:'Không SX'};
  const cur = sum(os, o=>num(o.soMeKH)+num(o.dieuChinhMe));
  if (Math.abs(cur-me)<1e-9) return {code:'ok', text:`Đã khớp (${os.map(o=>o.maLenh).join(', ')})`};
  return {code:'upd', text:`Lệnh ${os[0].maLenh}: ${fmtQ(cur)} → ${fmtQ(me)} mẻ`};
}
function applyPlanRow(r){
  const os = ordersOn(r.ngaySX, r.maTP); const me=num(r.soMe);
  if (!os.length) { if (me>0) state.orders.push({_id:uid(), maLenh:genMaLenh(r.ngaySX), ngayXuatNVL:r.ngaySX, ngaySX:r.ngaySX, maTP:r.maTP, loaiDM:'DM', soMeKH:me, dieuChinhMe:0, ghiChu:'Từ kế hoạch SX'}); return; }
  const o=os[0]; o.dieuChinhMe = round(me - num(o.soMeKH), 6);
}
function proposalParams(){ const s=state.settings; return {tonLau: num(s.tonLau)||75, duPhong: num(s.duPhong)||5, boQua: s.boQua!=null && s.boQua!=='' ? num(s.boQua) : 0.1}; }
function buildProposal(p){
  const prm = proposalParams(); const items=itemMap(); const nx={}; p.nxt.forEach(x=>nx[x.ma]=x);
  const meTH = {}; p.orders.forEach(o=>meTH[o.maTP]=(meTH[o.maTP]||0)+o.soMe);
  const tps = state.items.filter(i=>i.nhom==='Thành phẩm').map(i=>i.ma).filter(ma=>bomFor(ma,'DM').length);
  // tỷ trọng giá trị từng NVL trong TP
  const share = {}; tps.forEach(tp=>{ const rows=bomFor(tp,'DM'); const tot=sum(rows,b=>num(b.slNVL)*(p.giaVon[b.maNVL]||0)); share[tp]={}; rows.forEach(b=>share[tp][b.maNVL]= tot? num(b.slNVL)*(p.giaVon[b.maNVL]||0)/tot : 0); });
  const tpDays = ma => { const x=nx[ma]; return x && x.bq>0 ? x.closeSL/x.bq : (x && x.closeSL>0 ? Infinity : 0); };
  const endDay = p.isRange ? rangeOf(p.ky).to : (p.isYear ? `${p.ky}-12-31` : `${p.ky}-${String(daysInMonth(p.ky)).padStart(2,'0')}`);
  const lastDay = p.orders.length ? p.orders.map(o=>o.ngaySX).sort().pop() : endDay;
  const remDays = Math.max(0, Math.round((new Date(endDay+'T00:00:00') - new Date(lastDay+'T00:00:00'))/86400000));
  const monthDays = (()=>{ const out=[]; if (p.isRange) { const r=rangeOf(p.ky); const d=new Date(r.from+'T00:00:00'); const end=new Date(r.to+'T00:00:00'); while (d<=end) { out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); } return out; } if (p.isYear) { for (let mth=1; mth<=12; mth++){ const k=`${p.ky}-${String(mth).padStart(2,'0')}`; for (let d=1; d<=daysInMonth(k); d++) out.push(`${k}-${String(d).padStart(2,'0')}`); } } else for (let d=1; d<=daysInMonth(p.ky); d++) out.push(`${p.ky}-${String(d).padStart(2,'0')}`); return out; })();
  const dayLoad = {}; state.orders.forEach(o=>{ dayLoad[o.ngaySX+'|'+o.maTP]=(dayLoad[o.ngaySX+'|'+o.maTP]||0)+num(o.soMeKH)+num(o.dieuChinhMe); });
  const roomDays = tp => { const any = monthDays.some(d=>bomInfo(tp,'DM',d).lanNgay>0); if (!any) return null; return monthDays.filter(isWorkDay).map(d=>{ const ln=bomInfo(tp,'DM',d).lanNgay; return {d, room: ln ? Math.max(0, ln-(dayLoad[d+'|'+tp]||0)) : 0}; }).filter(x=>x.room>0); };
  const capLeft = tp => { const r=roomDays(tp); if (r===null) return Infinity; let cap=sum(r, x=>x.room); const mt = monthDays.map(d=>bomInfo(tp,'DM',d).meThang).find(v=>v>0); if (mt) { const sched = sum(monthDays, d=>dayLoad[d+'|'+tp]||0); cap=Math.min(cap, Math.max(0, mt-sched)); } return cap; };
  const reserved = {}; const resCap = {}; // NVL và năng lực đã giữ chỗ cho các đề xuất trước
  const ts0 = {}; tpSummary(p).forEach(x=>ts0[x.ma]=x);
  const laiKg = tp => { const s=ts0[tp]; return s && s.gb ? (s.gb - s.gv) : 0; };
  const limitByNVL = (tp, me, skipMa) => { // giới hạn mẻ tăng bởi NVL khác có tỷ trọng > boQua, rồi bởi năng lực còn lại trong kỳ
    let lim = me, by=''; const cap=Math.max(0, capLeft(tp)-(resCap[tp]||0)); if (cap<lim) { lim=cap; const bi=bomInfo(tp,'DM',monthDays[monthDays.length-1]); by=`năng lực còn trống trong tháng (${fmtQ(bi.lanNgay)} mẻ/ngày${bi.meThang?`, tối đa ${fmtQ(bi.meThang)} mẻ/tháng`:''} – theo ${bi.capSrc})`; }
    bomFor(tp,'DM').forEach(b=>{ if (b.maNVL===skipMa) return; const sh=share[tp][b.maNVL]||0; if (sh<=prm.boQua) return; const x=nx[b.maNVL]; const avail = x ? Math.max(0, x.closeSL - x.bq*prm.duPhong - (reserved[b.maNVL]||0)) : 0; const mx = num(b.slNVL)>0 ? Math.floor(avail/num(b.slNVL)) : me; if (mx<lim){ lim=mx; by=b.maNVL; } }); return {lim:Math.max(0,lim), by};
  };
  const reserve = (tp, me) => { bomFor(tp,'DM').forEach(b=>{ reserved[b.maNVL]=(reserved[b.maNVL]||0)+num(b.slNVL)*me; }); resCap[tp]=(resCap[tp]||0)+me; };
  const rankTPs = (list, nvlMa) => list.map(tp=>{ const q = nvlMa ? num((bomFor(tp,'DM').find(b=>b.maNVL===nvlMa)||{}).slNVL) : 0; return {tp, d:tpDays(tp), lai:laiKg(tp), q}; }).sort((a,b)=> (a.d-b.d) || (b.lai-a.lai) || (b.q-a.q));
  const rows=[];
  state.items.filter(i=>i.nhom==='NVLC').forEach(nvl=>{
    const x=nx[nvl.ma]; if(!x) return; const users = tps.filter(tp=>bomFor(tp,'DM').some(b=>b.maNVL===nvl.ma));
    if (!users.length) { if (x.closeSL!==0) rows.push({ma:nvl.ma, ten:nvl.ten, days:x.days, tp:'', tenTP:'', note:'NVLC không có thành phẩm phù hợp', st:'Chưa thể đề xuất', me:0}); return; }
    if (x.closeSL < 0) {
      const tp = users.sort((a,b)=>tpDays(b)-tpDays(a))[0]; const q=num(bomFor(tp,'DM').find(b=>b.maNVL===nvl.ma).slNVL); const can = q>0 ? Math.ceil(-x.closeSL/q) : 0; const slTPme=bomInfo(tp).slTP; const tonTP=(nx[tp]||{}).closeSL||0; const maxTP = slTPme>0 ? Math.max(0, Math.floor(tonTP/slTPme)) : 0; const me = Math.min(can, meTH[tp]||0, maxTP); const sau = x.closeSL + me*q;
      rows.push({ma:nvl.ma, ten:nvl.ten, days:x.days, tp, tenTP:(items[tp]||{}).ten, tpDays:tpDays(tp), bq:(nx[tp]||{}).bq||0, slTP:bomInfo(tp).slTP, q, meLT:-can, meTH:meTH[tp]||0, me:-me, note: me<can ? `Giảm ${me}/${can} mẻ (giới hạn: tồn TP ${fmtQ(tonTP)} = ${maxTP} mẻ, đã SX ${meTH[tp]||0} mẻ); vẫn thiếu ${fmtQ(-sau)} ${nvl.dvt}` : `Giảm ${me} mẻ đủ bù tồn âm`, st:'Giảm sản xuất'});
    } else if (x.days!=null && x.days > prm.tonLau) {

    bar.innerHTML = `<span class="small mut" data-xn style="display:none"></span><button class="btn s" data-xc style="display:none">✕ Xóa lọc / sắp xếp</button>`;
    tw.parentElement.insertBefore(bar, tw);
    // thanh cuộn ngang phía trên
    const hs = document.createElement('div'); hs.className='hscroll'; hs.innerHTML='<div></div>'; tw.parentElement.insertBefore(hs, tw);
    const sync=()=>{ hs.firstChild.style.width = tbl.scrollWidth+'px'; hs.style.display = tbl.scrollWidth > tw.clientWidth+2 ? '' : 'none'; };
    sync(); setTimeout(sync, 50); hs.onscroll=()=>{ tw.scrollLeft=hs.scrollLeft; }; tw.addEventListener('scroll', ()=>{ hs.scrollLeft=tw.scrollLeft; });
    // nút lọc từng cột
    st.widths = st.widths || {};
    const setW=(ci,w)=>{ const th=ths[ci]; if(!th) return; th.style.width=w+'px'; th.style.minWidth=w+'px'; th.style.maxWidth=w+'px'; tbl.querySelectorAll('tbody tr').forEach(r=>{ const td=r.children[ci]; if(td){ td.style.width=w+'px'; td.style.minWidth=w+'px'; td.style.maxWidth=w+'px'; } }); };
    ths.forEach((th,ci)=>{ const b=document.createElement('button'); b.className='xfb'; b.innerHTML='▼'; b.title='Lọc / sắp xếp cột'; b.onclick=e=>{ e.stopPropagation(); openFilter(tbl, key, ci, b); }; th.appendChild(b);
      const h=document.createElement('div'); h.className='xrs'; h.title='Kéo để đổi độ rộng cột'; th.appendChild(h);
      h.onmousedown=e=>{ e.preventDefault(); e.stopPropagation(); const x0=e.clientX, w0=th.getBoundingClientRect().width; tbl.classList.add('xresizing'); h.classList.add('on'); const mv=ev=>{ const w=Math.max(40, w0+(ev.clientX-x0)); setW(ci,w); st.widths[ci]=w; }; const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); tbl.classList.remove('xresizing'); h.classList.remove('on'); sync(); }; document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); };
      h.ondblclick=e=>{ e.stopPropagation(); delete st.widths[ci]; th.style.width=th.style.minWidth=th.style.maxWidth=''; tbl.querySelectorAll('tbody tr').forEach(r=>{ const td=r.children[ci]; if(td){ td.style.width=td.style.minWidth=td.style.maxWidth=''; } }); sync(); };
      if (st.widths[ci]) setW(ci, st.widths[ci]); });
    bar.querySelector('[data-xc]').onclick=()=>{ st.filters={}; st.sort=null; applyTable(tbl, key); };
    applyTable(tbl, key);
    { const ac=tbl.querySelector('td.act'); if (ac) { const h=ths[ac.cellIndex]; if (h) h.classList.add('actth'); } }
    if (tbl.dataset.freeze) { freezeCols(tbl); if (typeof ResizeObserver!=='undefined') { const ro=new ResizeObserver(()=>freezeCols(tbl)); ths.slice(0,+tbl.dataset.freeze).forEach(h=>ro.observe(h)); } }
  });
}
function applyTable(tbl, key){
  const st=tblState[key]; const tbody=tbl.querySelector('tbody'); if(!tbody) return; const rows=[...tbody.querySelectorAll('tr')]; const data=rows.filter(r=>!r.classList.contains('tot')); const tot=rows.filter(r=>r.classList.contains('tot'));
  const ths=[...tbl.querySelectorAll('thead th')];
  // sắp xếp
  if (st.sort) { const {col,dir}=st.sort; data.sort((a,b)=>{ const va=cellVal(a.children[col]||{}), vb=cellVal(b.children[col]||{}); const na=cellNum(va), nb=cellNum(vb); if (va==='' && vb==='') return 0; if (va==='') return 1; if (vb==='') return -1; let c; if (na!=null && nb!=null) c=na-nb; else c=va.localeCompare(vb,'vi'); return dir==='desc'?-c:c; }); data.forEach(r=>tbody.appendChild(r)); tot.forEach(r=>tbody.appendChild(r)); }
  // lọc
  let shown=0; data.forEach(r=>{ let ok=true; for (const c in st.filters){ const f=st.filters[c]; if(!f) continue; const v=cellVal(r.children[+c]||{}); if (f.vals && !f.vals.has(v)) ok=false; if (f.text && !v.toLowerCase().includes(f.text.toLowerCase())) ok=false; if(!ok) break; } r.style.display = ok?'':'none'; if(ok) shown++; });
  ths.forEach((th,ci)=>{ th.classList.toggle('xf-act', !!(st.filters[ci] && (st.filters[ci].vals||st.filters[ci].text)) || !!(st.sort && st.sort.col===ci)); });
  const n = tbl.parentElement.previousElementSibling && tbl.parentElement.previousElementSibling.previousElementSibling; const lab = n && n.querySelector && n.querySelector('[data-xn]'); const active = Object.values(st.filters).some(f=>f) || !!st.sort; if (lab) { lab.textContent = shown<data.length ? `Đang lọc: hiện ${shown}/${data.length} dòng` : ''; lab.style.display = shown<data.length ? '' : 'none'; lab.parentElement.classList.toggle('on', shown<data.length || active); } const xc = n && n.querySelector && n.querySelector('[data-xc]'); if (xc) xc.style.display = active ? '' : 'none';
}
function openFilter(tbl, key, ci, anchor){
  closeFilter(); const st=tblState[key]; const tbody=tbl.querySelector('tbody'); const vals=[...new Set([...tbody.querySelectorAll('tr:not(.tot)')].map(r=>cellVal(r.children[ci]||{})))]; const numeric = vals.length && vals.every(v=>v===''||cellNum(v)!=null); vals.sort((a,b)=> numeric ? (cellNum(a)||0)-(cellNum(b)||0) : a.localeCompare(b,'vi'));
  const cur = st.filters[ci] || {}; const sel = cur.vals ? new Set(cur.vals) : new Set(vals);
  const pop=document.createElement('div'); pop.className='xfpop'; pop.id='xfpop';
  pop.innerHTML = `<div class="xfrow"><button class="btn s" data-s="asc">↑ Sắp xếp A→Z / nhỏ→lớn</button><button class="btn s" data-s="desc">↓ Z→A / lớn→nhỏ</button></div>
  <input type="text" class="xfs" placeholder="Tìm giá trị…" value="${esc(cur.text||'')}">
  <div class="xfrow small"><a href="#" data-all>Chọn tất cả</a> · <a href="#" data-none>Bỏ chọn</a> <span class="mut">(${vals.length} giá trị)</span></div>
  <div class="xflist">${vals.slice(0,500).map(v=>`<label><input type="checkbox" value="${esc(v)}" ${sel.has(v)?'checked':''}> ${v===''?'<i class="mut">(trống)</i>':esc(v)}</label>`).join('')}${vals.length>500?'<div class="mut small">… chỉ hiện 500 giá trị đầu, dùng ô tìm để thu hẹp</div>':''}</div>
  <div class="xfrow" style="justify-content:flex-end"><button class="btn s" data-clear>Xóa lọc cột</button><button class="btn s p" data-ok>OK</button></div>`;
  document.body.appendChild(pop); const r=anchor.getBoundingClientRect(); pop.style.top=(r.bottom+window.scrollY+4)+'px'; pop.style.left=Math.min(r.left+window.scrollX, window.innerWidth-300)+'px';
  const refresh=()=>{ const q=pop.querySelector('.xfs').value; pop.querySelectorAll('.xflist label').forEach(l=>{ l.style.display = matchSearch(q,[l.textContent])?'':'none'; }); };
  pop.querySelector('.xfs').oninput=refresh; refresh();
  pop.querySelector('[data-all]').onclick=e=>{e.preventDefault(); pop.querySelectorAll('.xflist label').forEach(l=>{ if(l.style.display!=='none') l.querySelector('input').checked=true; });};
  pop.querySelector('[data-none]').onclick=e=>{e.preventDefault(); pop.querySelectorAll('.xflist label').forEach(l=>{ if(l.style.display!=='none') l.querySelector('input').checked=false; });};
  pop.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ st.sort={col:ci, dir:b.dataset.s}; applyTable(tbl,key); closeFilter(); });
  pop.querySelector('[data-clear]').onclick=()=>{ delete st.filters[ci]; if (st.sort && st.sort.col===ci) st.sort=null; applyTable(tbl,key); closeFilter(); };
  pop.querySelector('[data-ok]').onclick=()=>{ const checked=new Set([...pop.querySelectorAll('.xflist input:checked')].map(i=>i.value)); const text=pop.querySelector('.xfs').value.trim(); const all = checked.size===vals.length; st.filters[ci] = (all && !text) ? null : {vals: all?null:checked, text: text && !all ? '' : text}; if (st.filters[ci] && !st.filters[ci].vals && !st.filters[ci].text) st.filters[ci]=null; applyTable(tbl,key); closeFilter(); };
  pop.onclick=e=>e.stopPropagation(); setTimeout(()=>document.addEventListener('click', closeFilter, {once:true}),0);
}
function closeFilter(){ const p=$('#xfpop'); if(p) p.remove(); }

// ---------- Xuất phiếu kho cho phần mềm kế toán (mẫu ASP) ----------
const XK_HDR = [['FILE MẪU PHIẾU XUẤT KHO ĐỂ NHẬP VÀO PHẦN MỀM ASP KẾ TOÁN'],['Hướng dẫn:'],['- Điền dữ liệu vào các cột tương ứng trên file này'],['- Các cột có dấu (*) là những cột bắt buộc'],['- Nếu muốn nhập nhiều thông tin hơn người dùng có thể tải mẫu đầy đủ/hoặc tự thêm cột trên mẫu cơ bản'],['- Các dòng dữ liệu phía dưới chỉ là ví dụ minh họa'],['','','','','','','','Chi tiết hàng tiền'],
  ['Loại xuất kho','Ngày hạch toán (*)','Ngày chứng từ (*)','Số chứng từ (*)','Mã đối tượng','Tên đối tượng','Lý do xuất','Mã hàng','Tên hàng','Mã kho','TK Nợ (*)','TK Có (*)','ĐVT','Số lượng','Mã đối tượng THCP','Tên đối tượng THCP']];
const NK_HDR = [['FILE MẪU PHIẾU NHẬP KHO ĐỂ NHẬP VÀO PHẦN MỀM ASP KẾ TOÁN'],['Hướng dẫn:'],['- Điền dữ liệu vào các cột tương ứng trên file này'],['- Các cột có dấu (*) là những cột bắt buộc'],['- Nếu muốn nhập nhiều thông tin hơn người dùng có thể tải mẫu đầy đủ/hoặc tự thêm cột trên mẫu cơ bản'],['- Các dòng dữ liệu phía dưới chỉ là ví dụ minh họa'],['','','','','','','','Chi tiết hàng tiền'],
  ['Loại nhập kho','Ngày hạch toán (*)','Ngày chứng từ (*)','Số chứng từ (*)','Mã đối tượng','Tên đối tượng','Diễn giải','Mã hàng','Tên hàng','Mã kho','TK Nợ (*)','TK Có (*)','ĐVT','Số lượng','Mã đối tượng THCP']];
const xlSerial = d => Math.round((new Date(d+'T00:00:00Z') - Date.UTC(1899,11,30))/86400000);
function ktSettings(){ const s=state.settings; return {maDT: s.ktMaDT||'NV_DMT', tenDT: s.ktTenDT||'Đặng Minh Thảo', tkNoXK: s.ktTkNoXK||'621', tkCoNK: s.ktTkCoNK||'154'}; }
function buildXK(p){ const items=itemMap(); const k=ktSettings(); return p.lines.filter(l=>l.tong>0).slice().sort((a,b)=>(a.ngayXuatNVL+a.maLenh).localeCompare(b.ngayXuatNVL+b.maLenh)).map(l=>{ const it=items[l.maVT]||{}; const tp=items[l.maTP]||{}; return ['Xuất kho sản xuất', l.ngayXuatNVL, l.ngayXuatNVL, `XK${l.maTP}${xlSerial(l.ngayXuatNVL)}`, k.maDT, k.tenDT, `Xuất VL - ${tp.ten||l.maTP}`, l.maVT, it.ten||'', it.kho||'152', k.tkNoXK, it.kho||'152', it.dvt||'', round(l.tong,4), l.maTP, tp.ten||'']; }); }
function buildNK(p){ const items=itemMap(); const k=ktSettings(); return p.orders.filter(o=>o.slTH>0).slice().sort((a,b)=>(a.ngaySX+a.maLenh).localeCompare(b.ngaySX+b.maLenh)).map(o=>{ const tp=items[o.maTP]||{}; return ['Nhập kho thành phẩm sản xuất', o.ngaySX, o.ngaySX, `TP-${o.maTP}${xlSerial(o.ngaySX)}`, k.maDT, k.tenDT, `Nhập kho TP sản xuất - ${tp.ten||o.maTP}`, o.maTP, tp.ten||'', tp.kho||'155', tp.kho||'155', k.tkCoNK, tp.dvt||'', round(o.slTH,4), o.maTP]; }); }
function sheetWithDates(hdr, rows){ const aoa = hdr.concat(rows.map(r=>r.map((v,i)=> (i===1||i===2) && typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T00:00:00') : v))); const ws=XLSX.utils.aoa_to_sheet(aoa, {cellDates:true}); const n=hdr.length; for (let r=0;r<rows.length;r++) for (const c of [1,2]) { const a=XLSX.utils.encode_cell({r:n+r,c}); if (ws[a]) { ws[a].t='d'; ws[a].z='dd/mm/yyyy'; } } ws['!cols']=[20,16,16,18,12,18,34,12,34,8,8,8,8,12,16,24].map(w=>({wch:w})); return ws; }
function vXuatPhieu(m){
  const p=P(); if(!p) return noData(m); const tab=m.dataset.ptab||'xk'; const xk=buildXK(p), nk=buildNK(p); const k=ktSettings();
  const prev = (rows, hdr) => `<div class="tw"><table><thead><tr>${hdr[hdr.length-1].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,400).map(r=>`<tr>${r.map((v,i)=>`<td class="${i===13?'n':''}">${esc((i===1||i===2)?fmtD(v):(i===13?fmtQ(v):v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>400?`<div class="small mut">Chỉ xem trước 400/${rows.length} dòng – tệp xuất có đủ.</div>`:''}`;
  m.innerHTML = head(`File tải dữ liệu Misa – ${fmtKy(selKy)}`, `<button class="btn p" id="exBoth">⬇ Xuất Excel</button><span class="pill">XK NVL ${xk.length} dòng · NK TP ${nk.length} dòng</span>`) +
  `<div class="bar"><span class="pill">Đối tượng: ${esc(k.maDT)} – ${esc(k.tenDT)}</span><span class="pill">TK Nợ xuất ${esc(k.tkNoXK)} · TK Có nhập ${esc(k.tkCoNK)}</span>${calcDirty?'<span class="pill warn">⚠ Dữ liệu đã thay đổi – bấm Tính giá thành trước khi xuất</span>':''}</div>
  <div class="tabs"><button data-t="xk" class="${tab==='xk'?'act':''}">Phiếu xuất kho NVL (XK NVL)</button><button data-t="nk" class="${tab==='nk'?'act':''}">Phiếu nhập kho TP (NK TP)</button></div>` + (tab==='xk' ? prev(xk, XK_HDR) : prev(nk, NK_HDR));
  bindKy(); m.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ m.dataset.ptab=b.dataset.t; render(); });
  const mk = (which) => { if (typeof XLSX==='undefined') return toast('Thư viện Excel chưa tải được'); const wb=XLSX.utils.book_new(); if (which!=='nk') XLSX.utils.book_append_sheet(wb, sheetWithDates(XK_HDR, xk), 'XK NVL'); if (which!=='xk') XLSX.utils.book_append_sheet(wb, sheetWithDates(NK_HDR, nk), 'NK TP'); saveWb(wb, `${which==='xk'?'Misa_XK_NVL':which==='nk'?'Misa_NK_TP':'Misa_Phieu_kho'}_${selKy}.xlsx`); };
  $('#exBoth').onclick=()=>mk('both');
}
