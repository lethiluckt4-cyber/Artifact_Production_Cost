// Số âm hiển thị dạng (1.234) – chữ đỏ (class .neg gắn tự động). fmtNi/fmtQi: dạng -1234 dùng cho ô nhập.

const NEG_RE = /^\(\d[\d.,]*%?\)$/;
function negCheck(el){ if (!el || el.nodeType!==1 || el.closest('input,select,textarea,option')) return; let t=''; for (const n of el.childNodes) { if (n.nodeType===3) t+=n.nodeValue; else if (n.nodeType===1 && n.textContent.trim()) return el.classList.remove('neg'); } t=t.trim(); if (NEG_RE.test(t)) el.classList.add('neg'); else el.classList.remove('neg'); }
function negScan(root){ if (!root) return; if (root.nodeType===3) return negCheck(root.parentElement); if (root.nodeType!==1) return; const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n=>n.nodeValue.indexOf('(')>=0 || (n.parentElement&&n.parentElement.classList.contains('neg')) ? 1 : 3 }); let n; const seen=new Set(); while ((n=w.nextNode())) { const p=n.parentElement; if (p && !seen.has(p)) { seen.add(p); negCheck(p); } } }
(()=>{ const pend=new Set(); let raf=0; const flush=()=>{ raf=0; pend.forEach(n=>{ if (n.isConnected) negScan(n); }); pend.clear(); };
  const mo=new MutationObserver(recs=>{ for (const r of recs) { if (r.type==='characterData') pend.add(r.target); else { r.addedNodes.forEach(n=>pend.add(n)); if (r.target.nodeType===1 && r.target.classList.contains('neg')) pend.add(r.target); } } if (!raf) raf=requestAnimationFrame(flush); });
  const go=()=>{ mo.observe(document.body, {childList:true, subtree:true, characterData:true}); negScan(document.body); };
  if (document.body) go(); else document.addEventListener('DOMContentLoaded', go); })();
const fmtQ = v => negP(fmtQi(v));
const fmtP = v => (v==null || isNaN(v)) ? '' : negP((v*100).toLocaleString('vi-VN', {maximumFractionDigits:1})).replace(/(\)?)$/, '%$1');
const fmtD = s => { if(!s) return ''; const [y,m,d]=String(s).split('-'); return d && m && y ? `${d}/${m}/${y}` : s; };
const fmtKy = ky => { if(!ky) return ''; if(ky.startsWith('R:')) { const [,a,b]=ky.split(':'); return `${fmtD(a)} – ${fmtD(b)}`; } if(ky.length===4) return `cả năm ${ky}`; const [y,m]=ky.split('-'); return `${m}/${y}`; };
const kyOf = s => (s||'').slice(0,7);
const num = v => { if (v==null || v==='') return 0; if (typeof v==='number') return v; let t=String(v).trim().replace(/\s/g,''); const pm=t.match(/^\((.+)\)$/); if (pm) t='-'+pm[1]; let x; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) x=parseFloat(t.replace(/\./g,'').replace(',','.')); else x=parseFloat(t.replace(/,/g,'')); return isNaN(x)?0:x; };
const daysInMonth = ky => { const [y,m]=ky.split('-').map(Number); return new Date(y,m,0).getDate(); };
const nextKy = ky => { let [y,m]=ky.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
const todayKy = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

const round = (v,d) => { const p=Math.pow(10,d); return Math.round(v*p)/p; };
const sum = (a, f) => a.reduce((s,x)=>s+(f?f(x):x),0);
function toISODate(v){
  if (v==null || v==='') return '';
  if (v instanceof Date) { if (isNaN(v)) return ''; return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; }
  if (typeof v==='number') { if (v<20000 || v>80000) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s=String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2})$/); if (m) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function toKy(v){

function dbBackend(db){
  const col = db.collection('gt');
  return {
    // tài liệu lớn (tháng có nhiều lệnh / cân đối) được chia thành nhiều phần k__c1, k__c2… để không vượt giới hạn dung lượng một tài liệu
    chunks:{},
    async loadAll(){ const snap = await col.get(); const raw={}; snap.docs.forEach(d=>{ if(d.exists) raw[d.id]=d.data(); }); const o={};
      for (const id in raw) { if (/__c\d+$/.test(id)) continue; const v=raw[id]; if (v && v.__chunks) { let s=''; let ok=true; for (let i=1;i<=v.__chunks;i++){ const c=raw[`${id}__c${i}`]; if (!c) { ok=false; break; } s+=c.part; } this.chunks[id]=v.__chunks; if (ok) { try { o[id]=JSON.parse(s); } catch(e){ console.error('chunk parse', id, e); } } } else o[id]=v; }
      return o; },
    async put(k,v){ const s=JSON.stringify(v); const LIM=100000; const old=this.chunks[k]||0;
      if (s.length<=LIM) { await col.doc(k).set(v); for (let i=1;i<=old;i++) await col.doc(`${k}__c${i}`).delete(); delete this.chunks[k]; return; }
      const n=Math.ceil(s.length/LIM); for (let i=1;i<=n;i++) await col.doc(`${k}__c${i}`).set({part:s.slice((i-1)*LIM, i*LIM)});
      await col.doc(k).set({__chunks:n}); for (let i=n+1;i<=old;i++) await col.doc(`${k}__c${i}`).delete(); this.chunks[k]=n; },
    async del(k){ await col.doc(k).delete(); const old=this.chunks[k]||0; for (let i=1;i<=old;i++) await col.doc(`${k}__c${i}`).delete(); delete this.chunks[k]; },
  };
}
function idbBackend(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('giathanh_kh', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('docs');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const idb = req.result;
      const tx = (mode, fn) => new Promise((r, j)=>{ const t=idb.transaction('docs', mode); const s=t.store||t.objectStore('docs'); const q=fn(s); t.oncomplete=()=>r(q && q.result); t.onerror=()=>j(t.error); });

        async loadAll(){ const o={}; await new Promise((r,j)=>{ const t=idb.transaction('docs'); const c=t.objectStore('docs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=r; t.onerror=()=>j(t.error); }); return o; },
        put(k,v){ return tx('readwrite', s=>s.put(v,k)); },
        del(k){ return tx('readwrite', s=>s.delete(k)); },
      });
    };
  });
}

function vnKey(x){ return String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim(); }
function scanItemCodes(wb){

  wb.SheetNames.forEach(sn=>{ const ws=wb.Sheets[sn]; if (!ws || !ws['!ref']) return; const aoa=XLSX.utils.sheet_to_json(ws,{header:1, defval:'', raw:false});
    let hr=-1; for (let i=0;i<Math.min(15,aoa.length);i++) { if ((aoa[i]||[]).some(isCode)) { hr=i; break; } } if (hr<0) return;
    const hdr=aoa[hr].map(h=>String(h||'').trim()); const keys=hdr.map(vnKey);
    const codeCols=hdr.map((h,i)=>isCode(h)?i:-1).filter(i=>i>=0); if (!codeCols.length) return;

    let n=0;
    codeCols.forEach(ci=>{ const iTen=near(ci,k=>/^ten/.test(k)), iDvt=near(ci,k=>/^(dvt|don vi|dv tinh)/.test(k)), iNhom=near(ci,k=>/^nhom/.test(k)), iKho=near(ci,k=>/^(kho|ma kho)$/.test(k));
      for (let r=hr+1;r<aoa.length;r++) { const row=aoa[r]||[]; let ma=String(row[ci]==null?'':row[ci]).trim(); if (!ma || isCode(ma) || /^dòng \d+ là ví dụ/i.test(ma) || /^(tổng|cộng)/i.test(ma)) continue; ma=ma.replace(/\s+/g,'');
        const key=ma.toUpperCase(); const o=found[key]||(found[key]={ma, ten:'', dvt:'', nhom:'', kho:'', n:0, src:new Set(), tp:false}); o.n++; n++; if (/^ma (tp|thanh pham|sp|san pham)( |$)/.test(keys[ci])) o.tp=true;

}

        if (v instanceof Date) { c.value=v; c.numFmt='dd/mm/yyyy'; w=10; }
        else if (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) { c.value=new Date(v+'T00:00:00'); c.numFmt='dd/mm/yyyy'; w=10; }
        else if (typeof v==='string' && /^\d{4}-\d{2}$/.test(v)) { c.value=new Date(v+'-01T00:00:00'); c.numFmt='mm/yyyy'; w=8; }
        else if (typeof v==='number') { c.value=v; c.numFmt = Number.isInteger(v) ? '#,##0' : '#,##0.####'; w=String(Math.round(v)).length+4; }
        else { c.value=v; w=Math.min(40, String(v).length+2); }
        c.font = ri+1===hdrRow ? {...XL_FONT, bold:true} : XL_FONT; widths[ci]=Math.max(widths[ci]||0, w); }); });
      const pctCols=new Set(); if (aoa[hdrRow-1]) aoa[hdrRow-1].forEach((h,ci)=>{ if (typeof h==='string' && /^Tỷ (trọng|lệ)/.test(h)) pctCols.add(ci); });
      aoa.forEach((row,ri)=>{ if (ri+1<=hdrRow) return; row.forEach((v,ci)=>{ if (pctCols.has(ci) && typeof v==='number' && Math.abs(v)<=5) { const c=es.getRow(ri+1).getCell(ci+1); c.numFmt='0.0%'; } }); });
      const cols = ws['!cols']||[]; for (let i=0;i<widths.length;i++) { es.getColumn(i+1).width = (cols[i]&&cols[i].wch) || Math.max(8, widths[i]||8); }
      if (aoa.length>=hdrRow) { const hr=es.getRow(hdrRow); hr.alignment={wrapText:true, vertical:'middle'}; hr.eachCell(c=>{ c.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FFFFF2CC'}}; c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}; }); es.views=[{state:'frozen', ySplit:hdrRow}]; }
    });
    const buf = await ewb.xlsx.writeBuffer(); saveFile(name, new Blob([buf], {type:mime}));
  } catch(e) { console.error(e); const out = XLSX.write(wb, {bookType:'xlsx', type:'array'}); saveFile(name, new Blob([out], {type:mime})); }
}
// Xuất Excel đúng như bảng đang hiện trên tab: các cột đang hiện (theo thiết lập cột), các dòng sau lọc (kể cả dòng chưa vẽ do phân trang), dòng Tổng
function exportDomTable(tbl, name, sheet){ if (typeof XLSX==='undefined') return toast('Thư viện Excel chưa tải được'); if (!tbl) return toast('Không có bảng để xuất');
  const hr=tbl.querySelector('thead tr:last-child')||tbl.querySelector('thead tr'); const ths=[...hr.children];
  const keep=ths.map((th,i)=>i).filter(i=>{ const th=ths[i]; if (th.classList.contains('ckth')||th.classList.contains('actth')) return false; if (getComputedStyle(th).display==='none') return false; return th.textContent.replace('▼','').trim()!==''; });
  const head=keep.map(i=>ths[i].textContent.replace('▼','').replace(/\s+/g,' ').trim());
  const trs=[...tbl.querySelectorAll('tbody tr')].filter(tr=>tr.classList.contains('tot') || tr.classList.contains('pgh') || tr.style.display!=='none');
  const txt=td=>{ if (!td) return ''; const i=td.querySelector('input,select'); if (i) return (i.value||'').trim(); return (td.textContent||'').replace(/\s*🔒/,'').replace(/\s+/g,' ').trim(); };
  const body=trs.map(tr=>keep.map(i=>txt(tr.children[i])));
  const textCol=keep.map((_,j)=>body.some(r=>/^0\d/.test(r[j]))); // số HĐ, mã có số 0 đầu: giữ dạng chữ
  const aoa=[head, ...body.map(r=>r.map((v,j)=>{ if (v===''||v==='–') return ''; if (textCol[j] || /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v) || /^\d{1,2}\/\d{4}$/.test(v)) return v; const n=cellNum(v); return n==null?v:(/%\)?$/.test(v)?n/100:n); }))];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=head.map((h,j)=>({wch:Math.max(10,Math.min(40,Math.max(h.length, ...body.slice(0,200).map(r=>String(r[j]).length))+2))}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, String(sheet).replace(/[\\/?*\[\]:]/g,'').slice(0,31)||'Sheet1'); saveWb(wb, name); }
function exportSheet(name, sheet, json){ const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(json), sheet); saveWb(wb, name); }

  &nbsp;&nbsp;Cuối tháng: Chi phí 622 / 627 (nhập tay) → phân bổ vào từng lệnh theo tỷ lệ 621 → 154 = 621 + 622 + 627 → giá thành đơn vị và giá vốn TP. Kiểm tra & cảnh báo: mã thiếu, lệnh thiếu định mức, NVL chưa có giá vốn, tồn âm.<br>
  <b>3 · Đề xuất & giá thành</b> (chạy sau khi đã nhập mua – bán – lệnh kế hoạch của kỳ)<br>
  &nbsp;&nbsp;Bấm <b>▶ Tính giá thành</b> (chọn tháng) → phần mềm tự chạy 3 bước: (1) giá thành theo lệnh kế hoạch → (2) <b>Đề xuất sản xuất</b> tăng/giảm mẻ theo tồn NVLC & năng lực, <b>tự áp dụng</b> vào <b>Lệnh sản xuất thực tế</b> rồi tính lại → (3) nếu NXT còn âm: lập <b>Đề xuất điều chỉnh NVL</b>. Bảng thông báo cuối cùng cho bấm <i>Áp dụng cân đối NVL & tính lại</i> hoặc mở Lệnh SX thực tế để sửa tay (cột Điều chỉnh mẻ, thêm lệnh tay) rồi Tính giá thành lại → xem <b>Giá thành</b>.<br>
  <b>4 · Báo cáo</b> (theo tháng hoặc cả năm)<br>
  &nbsp;&nbsp;NXT – Tổng hợp năm – <b>File tải dữ liệu Misa</b> (phiếu xuất NVL / nhập TP theo mẫu nhập vào phần mềm kế toán). <b>Tổng quan</b> và <b>Cảnh báo & kiểm tra</b> đặt ở đầu menu để xem nhanh mỗi ngày.<br>
  <b>Chuyển kỳ</b>: tồn cuối tháng → tồn đầu tháng sau, tháng 12 → tháng 1 năm sau, tự động; không khóa sổ thủ công. Sao lưu .json cuối mỗi tháng tại Thiết lập.</div></div>
  <div class="box"><h3>Công thức áp dụng (giống file Excel gốc)</h3><ul class="tight">
  <li>Giá vốn kỳ = (Tồn đầu TT + Nhập TT) ÷ (Tồn đầu SL + Nhập SL). Thành phẩm: Nhập = sản lượng và giá thành 154 của các lệnh trong kỳ.</li>
  <li>SL NVL theo định mức = Định mức/mẻ × Số mẻ (làm tròn 2). Tổng xuất = SL theo ĐM + Điều chỉnh. 621 = Tổng xuất × Giá vốn.</li>
  <li><b>Cân đối NVL theo lệnh</b> có 2 chiều: <b>giảm (−)</b> do phần mềm đề xuất khi NVL âm kho (tại đúng lệnh làm tồn âm, đưa tồn về 0) hoặc bạn nhập; <b>tăng (+)</b> chỉ do bạn nhập tay (xuất thêm NVL cho lệnh so với định mức, ví dụ hao hụt thực tế, làm lại mẻ). Cả hai cộng dồn vào Tổng SL xuất của lệnh – mã VT đó; nhập tại Cân đối NVL (Thêm / Nhập Excel) hoặc bấm vào lệnh ở Giá thành.</li>
  <li>NVL thay thế: ngày SX trong [Từ – Đến ngày] → thay toàn bộ, hoặc tách gốc (1 − tỷ lệ) + thay thế (tỷ lệ).</li>
  <li>622 và 627 của lệnh được phân bổ <b>theo sản lượng (kg)</b> (mặc định): 622 lệnh = Tổng 622 tháng × (SL sản xuất lệnh ÷ Tổng SL sản xuất tháng); 627 tương tự (627 gồm chi phí nhập + giá trị xuất NVL dùng chung). Có thể đổi sang phân bổ theo giá trị NVL (621) ở Hệ thống → Thiết lập & sao lưu → tab Phân bổ 622 / 627 (chọn riêng cho 622 và 627). 154 = 621 + 622 + 627.</li>
  <li><b>Mua hàng – cột "Mua hàng chưa HĐ"</b>: chỉ ghi khi phiếu đã được <b>chuyển ngày nhập kho</b> (nút 📅 ở Cân đối NVL) hoặc <b>tách dòng</b> (✂ Tách) sang ngày nhập khác: <b>x</b> = chuyển cả phiếu; <b>x - số hóa đơn</b> = dòng tách mang ngày nhập mới; <b>số hóa đơn</b> = phần còn lại của hóa đơn giữ ngày nhập cũ. Phiếu nhập kho khác ngày hóa đơn nhưng không chuyển / tách thì để trống.</li>
  <li><b>Xuất vật tư dùng chung</b> có 2 loại (cột Loại xuất): <b>Thử nghiệm (641)</b> – xuất NVL để thử nghiệm sản phẩm, chỉ trừ tồn kho, giá trị (SL × giá vốn kỳ) tính vào chi phí 641, <b>không</b> vào giá thành; <b>Dùng chung SX (627)</b> – xuất NVL dùng chung cho sản xuất, giá trị (SL × giá vốn kỳ) <b>cộng vào chi phí 627 của tháng</b> rồi phân bổ vào các lệnh theo tỷ lệ 621. Hai khoản này hiện ở màn hình Chi phí 622/627 (cột "627 từ xuất NVL dùng chung", "641 xuất NVL thử nghiệm").</li>
  <li>Tồn cuối SL = Tồn đầu + Nhập − Xuất; Tồn cuối TT = Tồn đầu TT + Nhập TT − Xuất SL × Giá vốn (bằng 0 khi SL = 0).</li>
  <li>Lãi gộp = SL bán × (Giá bán − Giá vốn kỳ); Giá bán = Doanh số ÷ SL.</li></ul></div>
  <div class="box"><h3>Phát hiện sai – muốn làm lại từ đầu thì làm thế nào?</h3><div class="small" style="line-height:1.7">
  Nguyên tắc chung: <b>sửa dữ liệu gốc ở nhóm 1–2, rồi bấm ▶ Tính giá thành lại</b>. Phần mềm luôn tính lại tuần tự từ kỳ bắt đầu đến tháng chọn, nên sửa tháng nào cũng kéo theo các tháng sau. Cụ thể theo từng bước:</div>
  <table style="margin-top:8px"><thead><tr><th>Đang ở bước / phát hiện</th><th>Cách làm lại</th></tr></thead><tbody>
  <tr><td>Sai <b>Danh mục / Số dư đầu kỳ / Định mức</b></td><td>Sửa trực tiếp (Sửa dòng, Nhập Excel chế độ thay thế). Định mức đổi NVL vĩnh viễn: đặt <i>Hiệu lực đến</i> dòng cũ + thêm dòng mới có <i>Hiệu lực từ</i>; đổi tạm thời: bảng NVL thay thế. Rồi Tính giá thành lại (tick <i>Đề xuất lại từ đầu</i> nếu muốn PM xếp lại mẻ).</td></tr>
  <tr><td>Thiếu / sai <b>Mua hàng, Bán hàng, Xuất dùng chung</b></td><td>Bổ sung hoặc sửa dòng ở nhóm 2 (Nhập Excel cùng tháng chọn <i>Thay thế các kỳ có trong tệp</i> để không trùng). Sau đó Tính giá thành lại. Bán hàng không đổi giá thành, chỉ đổi tồn TP, lãi và số liệu đề xuất.</td></tr>
  <tr><td>Sai <b>Lệnh sản xuất kế hoạch</b></td><td>Sửa ở <i>Lệnh sản xuất (kế hoạch)</i>. Vì lệnh thực tế = kế hoạch + điều chỉnh mẻ, nên nếu kỳ đã có mẻ PM xếp, hãy Tính giá thành với <i>Đề xuất lại từ đầu</i> để PM xếp lại trên lệnh kế hoạch đúng.</td></tr>
  <tr><td>Đã chạy <b>Tính giá thành</b> (PM đã xếp mẻ tăng/giảm) nhưng muốn <b>đề xuất lại</b></td><td>Tick <b>Đề xuất lại từ đầu</b> trong hộp Tính giá thành. PM xóa toàn bộ <b>từ tháng đó trở về sau</b> (tháng chưa khóa): mẻ tăng/giảm (kể cả sửa tay), lệnh do PM/bạn thêm ở Lệnh SX thực tế, mọi dòng Cân đối NVL (kể cả nhập tay) → về đúng lệnh kế hoạch rồi chạy lại 3 bước. Các tháng sau tính lần lượt lại.</td></tr>
  <tr><td>Đã chốt lệnh thực tế, chỉ muốn <b>chỉnh vài lệnh</b></td><td>Sửa cột <i>Điều chỉnh mẻ</i> hoặc thêm lệnh tay ở Lệnh SX thực tế → Tính giá thành lại (không tick Đề xuất lại). PM giữ nguyên lệnh thực tế, chỉ tính lại và lập lại đề xuất NVL.</td></tr>
  <tr><td>Sai <b>Cân đối NVL</b> (đã áp dụng)</td><td>Vào Cân đối NVL: Sửa / Xóa từng dòng (lọc cột Lý do = "Đề xuất PM" để thấy các dòng PM ghi) → Tính giá thành lại; PM lập đề xuất NVL mới ở bước 3 cho phần còn âm. Muốn xóa sạch điều chỉnh của kỳ: Tính giá thành với tick Đề xuất lại từ đầu (lưu ý xóa cả mẻ PM đã xếp).</td></tr>
  <tr><td>Sai <b>Chi phí 622/627</b></td><td>Sửa số tháng đó → Tính giá thành lại. Chỉ ảnh hưởng 622/627/154, không ảnh hưởng mẻ hay NVL.</td></tr>
  <tr><td>Tháng đã <b>Khóa kỳ</b></td><td>Vào <b>Tổng quan</b> bấm 🔒 Khóa kỳ → bỏ chọn tháng để mở khóa → sửa → tính lại → khóa lại. Khóa kỳ chỉ chặn sửa, không chặn tính lại.</td></tr>
  <tr><td>Muốn <b>làm lại hoàn toàn</b> một tháng</td><td>Nhập Excel chế độ <i>Thay thế các kỳ có trong tệp</i> cho Mua/Bán/Lệnh SX/Xuất chung của tháng đó (tệp mới thay toàn bộ dữ liệu tháng), tick Đề xuất lại từ đầu, Tính giá thành.</td></tr>
  <tr><td>Màn hình <b>Lệnh sản xuất thực tế</b> đọc thế nào</td><td><b>Mẻ thực tế</b> = Mẻ kế hoạch + Điều chỉnh mẻ (mẻ tăng / giảm do đề xuất hoặc bạn sửa tay). Mỗi dòng có Sửa / Xóa; bấm <b>Thêm</b> để thêm lệnh phát sinh.</td></tr><tr><td>Muốn xem nhanh <b>bước nào còn lỗi</b></td><td>Mở <b>Luồng xử lý</b>: sơ đồ 5 bước từ dữ liệu nền đến báo cáo theo kỳ đang chọn. Ô xanh lá = người dùng nhập, ô tím = phần mềm tự tính. Luồng chỉ kiểm soát <b>quy trình</b> (bước nào chưa nhập đủ / chưa làm: thiếu thông tin bắt buộc, mã chưa có trong danh mục, lệnh chưa có định mức, tháng có sản xuất chưa nhập chi phí, tháng đã kết thúc còn NVL âm chưa chuyển ngày / cân đối, chưa tính lại giá thành…); ô chữ đỏ có số việc chưa xong – bấm để xem chi tiết. Rủi ro số liệu (giá bất thường, tồn âm, bán dưới giá vốn…) xem ở <b>Cảnh báo & kiểm tra</b>.</td></tr><tr><td>Có file Excel (mua, bán, định mức, file kế toán…) muốn biết <b>mã nào chưa có trong danh mục</b></td><td>Danh mục hàng → bấm <b>Kiểm tra mã</b> → chọn file. Phần mềm đọc mọi sheet, liệt kê mã chưa có kèm tên / ĐVT / nhóm / kho lấy từ file; bổ sung ô còn trống rồi bấm <b>Nạp … mã vào danh mục</b>.</td></tr><tr><td>Muốn <b>làm lại toàn bộ phần mềm</b></td><td>Vào Thiết lập & sao lưu → bấm <b>Sao lưu (.json)</b> để giữ bản hiện tại → bấm <b>Phục hồi từ file sao lưu</b> và chọn file muốn dùng làm điểm bắt đầu (bản sao lưu cũ, hoặc file đã chuẩn bị lại). Phục hồi thay toàn bộ dữ liệu; muốn quay lại thì phục hồi từ file vừa sao lưu. Cũng có thể làm lại từng phần bằng Nhập Excel chế độ <i>Thay thế</i>.</td></tr>
  </tbody></table></div>
  <div class="box"><h3>Trạng thái rủi ro và Phân loại trong báo cáo Nhập – Xuất – Tồn</h3><div class="small" style="line-height:1.7">
  Mỗi mã hàng trong NXT được phần mềm gắn <b>Trạng thái rủi ro</b> (chữ mô tả, có thể có nhiều trạng thái cùng lúc) và <b>Phân loại</b> (<span class="pill bad">Rủi ro cao</span> / <span class="pill warn">Cảnh báo</span> / <span class="pill ok">OK</span>). Phân loại lấy theo trạng thái nặng nhất; mã không có trạng thái nào là OK. Lọc cột Phân loại bằng nút ▼ để xem nhanh các mã cần xử lý.<br>
  <b>Các đại lượng dùng để xét:</b> <i>BQ/ngày</i> = số lượng phát sinh trong tháng ÷ số ngày đến lệnh sản xuất cuối cùng của tháng (thành phẩm tính theo số bán ra; NVL tính theo xuất cho sản xuất + xuất dùng chung). <i>Số ngày còn dùng</i> = Tồn cuối SL ÷ BQ/ngày. <i>Cần lấy 5 ngày</i> = BQ/ngày × 5 − tồn cuối (phần NVL cần mua thêm để đủ dùng 5 ngày).</div>
  <table style="margin-top:8px"><thead><tr><th>Trạng thái</th><th>Áp dụng cho</th><th>Điều kiện</th><th>Phân loại</th><th>Nên làm gì</th></tr></thead><tbody>
  <tr><td>Âm kho - xử lý ngay</td><td>Mọi mã</td><td>Tồn cuối SL &lt; 0</td><td><span class="pill bad">Rủi ro cao</span></td><td>Kiểm tra mua hàng chưa nhập, số dư đầu kỳ, xuất vượt tồn; xem Đề xuất điều chỉnh NVL.</td></tr>
  <tr><td>Tồn thấp - cần mua</td><td>NVL, phụ gia, gia vị, bao bì</td><td>Tồn cuối chưa đủ dùng 5 ngày (Cần lấy 5 ngày &gt; 0)</td><td><span class="pill bad">Rủi ro cao</span></td><td>Mua bổ sung theo số "Cần lấy 5 ngày".</td></tr>
  <tr><td>Tồn trên 3 tháng - không mua thêm (NVL quá dư)</td><td>NVL chính (NVLC)</td><td>Số ngày còn dùng &gt; 90</td><td><span class="pill bad">Rủi ro cao</span></td><td>Ngừng mua; PM đề xuất tăng sản xuất thành phẩm dùng NVLC này.</td></tr>
  <tr><td>Tồn trên 1 năm - không mua thêm (NVL quá dư)</td><td>Phụ gia, gia vị, bao bì</td><td>Số ngày còn dùng &gt; 365</td><td><span class="pill bad">Rủi ro cao</span></td><td>Ngừng mua, xem xét xử lý tồn.</td></tr>
  <tr><td>Chưa xây dựng định mức</td><td>NVL và vật tư (có nhóm hàng)</td><td>Mã không xuất hiện ở bảng <b>Định mức</b> (cột Mã NVL hoặc cột NVL thay thế của định mức) <b>và</b> không xuất hiện ở bảng <b>NVL thay thế</b> (cột NVL gốc hoặc NVL thay thế). Có mặt ở một trong các nơi này là coi như đã có định mức.</td><td><span class="pill warn">Cảnh báo</span></td><td>Bổ sung định mức hoặc bỏ mã nếu không còn dùng.</td></tr>
  <tr><td>TP có SX - chưa bán ra</td><td>Thành phẩm</td><td>Có tồn đầu hoặc nhập trong kỳ nhưng chưa bán lần nào</td><td><span class="pill warn">Cảnh báo</span></td><td>Kiểm tra bán hàng chưa nhập hoặc sản phẩm chưa có đầu ra.</td></tr>
  <tr><td>Tồn TP thấp - tăng SX</td><td>Thành phẩm</td><td>Số ngày còn dùng &lt; 7 (và có bán)</td><td><span class="pill warn">Cảnh báo</span></td><td>Xem Đề xuất sản xuất để tăng mẻ.</td></tr>
  <tr><td>Giảm SX TP - Tăng cường bán ra</td><td>Thành phẩm</td><td>Số ngày còn dùng &gt; 30</td><td><span class="pill warn">Cảnh báo</span></td><td>Giảm sản xuất hoặc đẩy mạnh bán.</td></tr>
  <tr><td>Tồn trên 1 tháng - SX thêm TP (hạn chế mua)</td><td>NVL, vật tư (trừ phụ gia, gia vị, bao bì)</td><td>Số ngày còn dùng &gt; 30 (chưa tới 90 ngày với NVLC)</td><td><span class="pill warn">Cảnh báo</span></td><td>Hạn chế mua thêm, ưu tiên sản xuất thành phẩm dùng NVL này.</td></tr>
  <tr><td>Tồn trên 6 tháng - rủi ro tồn lâu</td><td>Phụ gia, gia vị, bao bì</td><td>Số ngày còn dùng từ 181 đến 365</td><td><span class="pill warn">Cảnh báo</span></td><td>Theo dõi, không mua thêm.</td></tr>
  <tr><td>(không có trạng thái)</td><td>Mọi mã</td><td>Không rơi vào các điều kiện trên, hoặc tồn cuối bằng 0</td><td><span class="pill ok">OK</span></td><td>Không cần xử lý.</td></tr>
  </tbody></table>
  <div class="small mut" style="margin-top:6px">Trạng thái chỉ tính khi mã có phát sinh (BQ/ngày &gt; 0) với các mức theo số ngày; riêng "Âm kho" và "Chưa xây dựng định mức" xét cả khi không có phát sinh. Các mốc 7 / 30 / 90 / 180 / 365 ngày đang cố định trong phần mềm.</div></div>
  <div class="box"><h3>Cách phần mềm đề xuất sản xuất (tăng / giảm mẻ)</h3><div class="small" style="line-height:1.75">
  <b>Khi nào chạy:</b> mỗi lần bấm <b>▶ Tính giá thành</b> một tháng (bước 2/3). Sau khi tính giá thành theo lệnh kế hoạch, phần mềm lập đề xuất rồi <b>tự áp dụng</b> vào <i>Lệnh sản xuất thực tế</i> và tính lại. Kỳ đã áp dụng hoặc đã sửa tay thì giữ nguyên, muốn đề xuất lại phải tick <i>Đề xuất lại từ đầu</i>. Kết quả xem và cân chỉnh ở Menu 3 → Lệnh sản xuất thực tế; thông số đề xuất ở Menu 3 → Đề xuất sản xuất.<br>
  <b>Đối tượng xét:</b> từng <b>NVL chính (nhóm NVLC)</b> và các <b>thành phẩm</b> dùng NVLC đó trong định mức (loại DM). Số liệu lấy từ tồn cuối tháng, bình quân xuất/ngày (BQ/ngày) và <i>Số ngày còn dùng</i> = tồn cuối ÷ BQ/ngày.<br>
  <b>Ba trường hợp, xét theo từng NVLC:</b>
  <ol style="margin:4px 0 4px 18px">
  <li><b>NVLC âm kho → GIẢM sản xuất.</b> Chọn thành phẩm còn tồn nhiều ngày nhất trong số TP dùng NVLC đó. Số mẻ giảm = phần âm ÷ NVLC dùng/mẻ (làm tròn lên), nhưng không vượt quá <b>số mẻ đã sản xuất</b> trong kỳ và <b>số mẻ tương ứng tồn TP</b> hiện có. Nếu giảm hết mức vẫn chưa bù đủ thì ghi rõ phần còn thiếu để bạn xử lý bằng điều chỉnh NVL. Mẻ giảm được trừ vào các lệnh gần nhất của TP đó.</li>
  <li><b>NVLC còn dùng quá <i>Mốc tồn lâu</i> (mặc định 75 ngày) → TĂNG sản xuất để tiêu thụ.</b> Phần dư = tồn cuối − BQ/ngày × mốc tồn lâu. Dư này được chia lần lượt cho các TP dùng NVLC đó theo <b>thứ tự ưu tiên</b>: (1) TP còn tồn ít ngày bán nhất, (2) lãi gộp/đv cao hơn, (3) dùng nhiều NVLC/mẻ hơn. Mỗi TP được tăng tối đa số mẻ mà phần dư cho phép, rồi phần dư còn lại chuyển cho TP kế tiếp.</li>
  <li><b>Thành phẩm âm kho → TĂNG để bù.</b> Số mẻ = tồn âm ÷ SL/mẻ (làm tròn lên), xét giới hạn như dưới đây.</li>
  </ol>
  <b>Giới hạn khi tăng mẻ</b> (mẻ tăng chỉ được lấy mức thấp nhất của các giới hạn sau, để không tạo ra tồn âm mới):
  <ul style="margin:4px 0 4px 18px">
  <li><b>Các NVL khác</b> trong định mức của TP (chỉ xét NVL có tỷ trọng giá trị &gt; <i>ngưỡng bỏ qua</i>, mặc định 10%; bao bì, gia vị nhỏ bị bỏ qua): lượng NVL còn lại = tồn cuối − BQ/ngày × <i>Dự phòng</i> (mặc định 5 ngày) − lượng đã giữ chỗ cho các đề xuất trước đó trong cùng lần chạy.</li>
  <li><b>Năng lực sản xuất</b>: mỗi ngày tối đa <i>Lần/ngày</i> trong Định mức; chỉ tính các ngày còn trống trong khoảng được phép xếp (dưới đây).</li>
  <li>Nếu hết năng lực hoặc thiếu NVL chính, dòng đề xuất ghi "Không tăng" kèm lý do.</li>
  </ul>
  <b>Xếp mẻ vào ngày nào:</b> chỉ trong <b>tháng đang tính</b>, từ đầu tháng đến <b>ngày có lệnh sản xuất cuối cùng</b> (ngày bạn đã nhập dữ liệu tới), ưu tiên các ngày gần nhất còn trống năng lực, lùi dần về đầu tháng. Không xếp vào ngày tương lai và <b>không xếp vào ngày nghỉ</b> (mặc định nghỉ Chủ nhật; ngày lễ / nghỉ chờ việc khai ở Hệ thống → Thiết lập & sao lưu → tab Lịch nghỉ / tăng ca; ngày khai <i>Tăng ca</i> được coi là ngày làm việc). Lệnh đã có sẵn ở ngày nghỉ vẫn giữ nguyên. Nếu ngày đó đã có lệnh của TP thì cộng thêm vào cột <i>Điều chỉnh mẻ</i>, chưa có thì tạo lệnh mới (mẻ kế hoạch = 0, ghi chú "Đề xuất SX").<br>
  <b>Kế hoạch chốt theo thành phẩm:</b> gộp các đề xuất cùng một TP (không trùng mã): tổng mẻ tăng, mẻ giảm, mẻ đã sản xuất, tổng mẻ sau điều chỉnh. Bảng bên cạnh liệt kê NVL còn thiếu nếu muốn thực hiện đủ mẻ tăng (cần mua thêm).<br>
  <b>Sau đề xuất mẻ:</b> phần mềm tính lại giá thành và NXT, rồi lập tiếp <b>đề xuất điều chỉnh NVL</b> cho các mã còn âm (chỉ giảm, xem mục Công thức). Bạn kiểm tra ở Lệnh sản xuất thực tế và Cân đối NVL, sửa tay nếu cần rồi tính lại.</div></div>
  <div class="box"><h3>Thiết lập cho đề xuất – ở đâu, nghĩa là gì, đổi giữa chừng thì sao?</h3>
  <table style="margin-top:4px"><thead><tr><th>Thiết lập</th><th>Vào đâu để đổi</th><th>Ý nghĩa / cách PM dùng</th></tr></thead><tbody>
  <tr><td><b>Mốc NVLC tồn lâu</b> (mặc định 75 ngày)</td><td>Menu 3 → Đề xuất sản xuất → bấm Sửa, đổi số, bấm Lưu</td><td>NVLC có <i>Số ngày còn dùng</i> (tồn ÷ bình quân xuất/ngày) lớn hơn mốc này → phần tồn vượt mốc được đem đề xuất <b>tăng mẻ</b> thành phẩm. Tăng mốc = ít đề xuất tăng hơn.</td></tr>
  <tr><td><b>Dự phòng NVL chính</b> (mặc định 5 ngày)</td><td>Menu 3 → Đề xuất sản xuất (ô thứ 2)</td><td>Khi tính mẻ tăng, các NVL khác của thành phẩm phải còn ≥ 5 ngày dùng sau khi trừ – thiếu thì giới hạn mẻ và ghi "giới hạn bởi NVL …".</td></tr>
  <tr><td><b>Bỏ qua NVL tỷ trọng ≤</b> (mặc định 0,1 = 10%)</td><td>Menu 3 → Đề xuất sản xuất (ô thứ 3)</td><td>NVL chiếm ≤ 10% giá trị thành phẩm (bao bì, gia vị…) không giới hạn mẻ tăng; chỉ được cộng vào Đề xuất điều chỉnh NVL nếu âm.</td></tr>
  <tr><td><b>Khoảng ngày xếp mẻ</b></td><td>Tự động</td><td>Mẻ tăng/giảm chỉ xếp <b>trong tháng đang tính</b>, từ đầu tháng đến ngày có lệnh SX cuối cùng (ngày bạn đã nhập dữ liệu tới), ưu tiên các ngày gần nhất còn trống năng lực; không xếp vào ngày tương lai. Mẻ giảm trừ vào lệnh gần nhất của thành phẩm đó.</td></tr>

  <div class="small" style="line-height:1.7;margin-top:8px"><b>Đổi thiết lập giữa chừng</b>: các tham số lưu chung cho mọi tháng và chỉ có tác dụng ở <b>lần Tính giá thành kế tiếp</b>, không tự sửa những gì đã xếp. Vì vậy:<br>
  • Tháng <b>chưa chạy</b> Tính giá thành: đổi xong, tính bình thường.<br>
  • Tháng <b>đã chạy</b> (PM đã xếp mẻ) và muốn đề xuất theo tham số mới: Tính giá thành với tick <b>Đề xuất lại từ đầu</b>. Không tick → PM giữ nguyên lệnh thực tế hiện có.<br>
  • Tháng <b>đã khóa</b>: không bị ảnh hưởng; muốn tính lại phải mở khóa.<br>
  • Đổi <b>Định mức / Năng lực / NVL thay thế</b>: nên dùng <i>Hiệu lực từ ngày</i> để tháng cũ giữ nguyên; nếu sửa thẳng dòng cũ, PM sẽ báo ảnh hưởng tới kỳ đã khóa và tính lại các kỳ đó khi bạn tính giá thành.</div></div>
  <div class="box"><h3>Màn hình Nhập – Xuất – Tồn – cách tính</h3><div class="small" style="line-height:1.7">
  <b>Hai tab:</b> <i>Tổng hợp nhập xuất tồn</i> (mỗi mã một dòng) và <i>Chi tiết nhập xuất tồn</i> (từng nghiệp vụ của mọi mã, có cột Kho, Mã, Mặt hàng; màn hình hiện 1.500 dòng đầu, Xuất Excel có đủ). Ở tab Tổng hợp bấm vào <b>mã</b> (chữ xanh) hoặc bất kỳ chỗ nào trên dòng để mở <b>thẻ kho</b> của mã đó; bấm chữ xanh ở cột <b>Chứng từ / lệnh</b> để mở chứng từ (xem trước, bấm Sửa để sửa – tháng đã khóa thì không sửa được).<br>
  <b>Lọc:</b> ô Nhóm và ô Kho tích chọn được nhiều giá trị (Chọn tất cả / Bỏ chọn / Đóng); bảng lọc ngay. Mã có tồn đầu, nhập, xuất, tồn cuối đều bằng 0 thì không hiện.<br>
  <b>Nhập:</b> mua hàng (theo ngày nhập kho) và thành phẩm nhập kho từ lệnh sản xuất (theo ngày SX). <b>Xuất:</b> NVL xuất cho lệnh sản xuất theo định mức (có NVL thay thế và điều chỉnh NVL), bán hàng, xuất dùng chung (627) và thử nghiệm (641).<br>
  <b>Giá vốn</b> = bình quân cả kỳ: (Tồn đầu TT + Nhập TT) ÷ (Tồn đầu SL + Nhập SL); mọi dòng xuất trong tháng tính theo giá này. Thành phẩm nhập kho theo giá thành 154 của lệnh. Tồn cuối = Tồn đầu + Nhập − Xuất.<br>
  <b>BQ/ngày</b> = phát sinh xuất ÷ số ngày tính đến lệnh sản xuất cuối cùng của tháng (xem cả năm: tổng số ngày đến lệnh SX cuối mỗi tháng; xem khoảng ngày: số ngày trong khoảng). <b>Số ngày còn dùng</b> = Tồn cuối SL ÷ BQ/ngày.<br>
  <b>Cập nhật:</b> số lượng cập nhật ngay khi lưu dữ liệu; giá vốn và các cột giá trị cập nhật khi vào <b>Giá thành</b> bấm ▶ Tính giá thành.</div></div>
  <div class="box"><h3>Màn hình Chi phí 622 / 627 – ý nghĩa các cột</h3><div class="small" style="line-height:1.7">
  Mỗi dòng là một tháng; cột nền vàng nhập tay (bấm Sửa), cột xám phần mềm tự tính.<br>
  <b>621 NVL (lệnh SX):</b> tổng giá trị NVL xuất cho các lệnh sản xuất trong tháng.<br>
  <b>Các cột 622 / 627 nhập tay</b> (nhân công, dụng cụ, khấu hao, điện, nước, khác…): số chi phí của tháng; thêm / bớt cột bằng nút <b>⚙ Cột chi phí</b>. <b>Tổng 622</b> hiện khi có nhiều cột 622.<br>
  <b>627 từ xuất NVL dùng chung:</b> giá trị các phiếu Xuất dùng chung loại 627 trong tháng. <b>Tổng 627</b> = các cột 627 nhập tay + 627 từ xuất dùng chung.<br>
  <b>622 đ/kg SX, 627 đ/kg SX:</b> chi phí ÷ sản lượng sản xuất (kg) của tháng.<br>
  <b>Tổng giá thành 154</b> = 621 + 622 + 627 đã phân bổ vào lệnh. <b>621 / 154, 622 / 154, 627 / 154:</b> tỷ trọng từng khoản trong giá thành.<br>
  <b>641 xuất NVL thử nghiệm:</b> giá trị phiếu xuất loại Thử nghiệm (641) – chi phí bán hàng, không vào giá thành.<br>
  <b>Chưa phân bổ (không SX):</b> tháng có chi phí 622/627 nhưng không có lệnh sản xuất nên chưa phân bổ được.<br>
  Tiêu thức phân bổ (theo kg hoặc theo 621) đổi ở Thiết lập → tab Phân bổ 622 / 627. Các cột tự tính cập nhật khi bấm ▶ Tính giá thành.</div></div>
  <div class="box"><h3>Cân đối NVL – các ý cần biết</h3><div class="small" style="line-height:1.7"><ol class="tight">
  <li><b>Cân đối là gì:</b> điều chỉnh số lượng NVL xuất theo định mức của một lệnh, xác định bằng <b>Ngày sản xuất + Mã sản phẩm + Mã VT/HH</b>, ghi ở menu <b>Cân đối NVL</b>. Cột <i>Lệnh SX</i> có thể bỏ trống – phần mềm tự gắn lệnh khớp Ngày sản xuất + Mã sản phẩm (ngày đó có nhiều lệnh cùng mã thì gắn lệnh đầu tiên; muốn gắn lệnh khác thì gõ Lệnh SX). Cột <i>Đơn giá</i> là giá xuất kho bình quân của tháng, <i>Giá trị</i> = SL cân đối × Đơn giá. Số <b>âm</b> = giảm tiêu hao, số <b>dương</b> = tăng. Cân đối làm thay đổi <i>621 và giá thành 154 của lệnh đó</i>, <i>cột Xuất ở Nhập – Xuất – Tồn</i> và <i>số lượng trên phiếu Xuất kho của File tải dữ liệu Misa</i>.</li>
  <li><b>Thứ tự xử lý NVL âm cuối tháng:</b> ở menu Cân đối NVL (màn hình <i>Cân đối nguyên vật liệu theo lệnh</i>) bấm <b>📅 Chuyển ngày nhập kho</b> trước, rồi mới <b>⚙ Cân đối theo đề xuất</b> cho phần còn âm. Nếu bấm Cân đối khi vẫn còn phiếu chuyển ngày được, phần mềm sẽ nhắc và có nút chuyển ngày trước.</li>
  <li><b>Chuyển ngày nhập kho:</b> phiếu mua của <b>tháng sau</b> cùng mã được lùi ngày nhập kho về ngày tồn bắt đầu âm của tháng đang âm, phiếu sớm nhất trước.
    <ul class="tight"><li>Ngày hóa đơn cách ngày nhập kho mới <b>không quá 1 tháng</b> (cột Ghi chú màu cam ghi số ngày cách nhau); phiếu cách xa hơn không được chuyển.</li>
    <li>Phiếu lớn hơn số thiếu thì <b>tách đúng phần thiếu</b>: dòng tách mang ngày nhập mới, dòng gốc giữ phần còn lại (thành tiền chia theo số lượng). Ghi chú ghi "PM chuyển ngày nhập kho từ …".</li>
    <li>Cột <b>Mua hàng chưa HĐ</b> ở Mua hàng chỉ ghi cho phiếu đã chuyển / tách: dòng tách ghi <b>x - Số HĐ</b>, các dòng còn lại của hóa đơn ghi <b>Số HĐ</b>, chuyển cả phiếu ghi <b>x</b>.</li></ul></li>
  <li><b>Đề xuất cân đối:</b> phần mềm xét theo ngày trong tháng (mua, xuất cho lệnh, xuất dùng chung, bán), giảm tiêu hao ở các lệnh làm tồn xuống âm – lệnh sớm trước, không giảm quá lượng đang xuất – cho đến khi tồn cuối tháng về 0. Mỗi dòng ghi vào Cân đối NVL có Lý do <b>"PM cân đối – nguyên nhân (tồn ngày … về …)"</b>. Thành phẩm âm và NVL âm không do lệnh SX (tồn đầu âm, xuất dùng chung vượt tồn) không cân đối được – xem nguyên nhân ở Cảnh báo & kiểm tra.</li>
  <li><b>Bảng đề xuất:</b> xem trước Tồn cuối, SL cân đối, <b>Đang xuất → Sau cân đối</b> và Nguyên nhân; tick từng dòng rồi <b>Áp dụng</b>. Phần mềm áp dụng lần lượt từng tháng, nên tháng sau có thể cần cân đối ít hơn số đang hiện. Bảng chuyển ngày nhập kho cũng tick từng dòng như vậy.</li>
  <li><b>Màu nút:</b> <b>cam</b> là còn việc cần làm (rê chuột vào nút để xem số tháng); xanh <b>"✓ Đã …"</b> là đã xong (không còn phiếu chuyển được / không còn NVL âm cần cân đối) cho kỳ đang chọn ở ô Năm · Xem.</li>
  <li><b>Tháng chưa kết thúc:</b> không chuyển ngày nhập kho, không cân đối, vì NVL âm thường do chưa nhập đủ phiếu mua. Cuối tháng nhập đủ chứng từ rồi tính lại. Tháng đã khóa cũng không được chuyển / cân đối.</li>
  <li><b>Sau khi chuyển ngày / cân đối:</b> số lượng ở Nhập – Xuất – Tồn cập nhật ngay; giá vốn, giá thành và File Misa cập nhật khi vào Giá thành bấm <b>▶ Tính giá thành</b>. Dòng cân đối có thể Sửa / Xóa từng dòng ở Cân đối NVL (lọc cột Lý do = "PM cân đối").</li>
  <li><b>Cách khác:</b> hộp kết quả ▶ Tính giá thành có 2 nút riêng: <b>① 📅 Chuyển ngày nhập kho</b> (làm trước) và <b>② ⚙ Cân đối NVL</b> (làm sau). Mỗi nút mở bảng chi tiết của tháng đó; tick dòng muốn nhận rồi bấm <b>Áp dụng … & tính lại</b>. Đã chuyển kho thì cân đối tính theo số sau chuyển kho; không cần chuyển kho thì bấm thẳng ② – cân đối theo số hiện tại. Đã chuyển kho mà muốn bỏ: bấm <b>↩ Bỏ chuyển kho</b> (có ở bảng kết quả Tính giá thành và menu Cân đối NVL) – phiếu được trả về ngày nhập gốc, phiếu bị tách được gộp lại như cũ.</li>
  <li><b>Làm lại từ đầu:</b> Tính giá thành với tick <b>Đề xuất lại từ đầu</b> – từ tháng đó trở về sau: xóa toàn bộ Cân đối NVL (kể cả dòng nhập tay), mẻ PM đã xếp, sửa tay mẻ và lệnh thêm. Phiếu đã chuyển ngày nhập kho <i>không</i> tự trả lại – muốn trả lại thì bấm <b>↩ Bỏ chuyển kho</b>.</li>
  </ol></div></div>
  <div class="box"><h3>Ngưỡng cảnh báo – cách đặt</h3><div class="small" style="line-height:1.7">
  Vào <b>Cảnh báo & kiểm tra</b> → tab <b>Ngưỡng cảnh báo</b>. Bảng ngưỡng mặc định bị khóa (ô xám); bấm <b>Sửa</b> để mở, sửa số rồi bấm <b>Lưu ngưỡng</b> (hoặc <b>Hủy</b> để giữ số cũ).<br>
  <b>Chỉ tiêu đánh giá rủi ro:</b> mỗi chỉ tiêu có 2 ngưỡng. Giá trị tháng ≥ ngưỡng <i>Cảnh báo</i> thì ô tháng tô vàng nhạt, ≥ ngưỡng <i>Rủi ro cao</i> thì tô đỏ (tab Cảnh báo số liệu). Chỉ tiêu tính theo % thì nhập số phần trăm (ví dụ 115 = 115%).<br>
  Không cần theo dõi chỉ tiêu nào thì bấm thùng rác đỏ cuối dòng – phần mềm hỏi lại rồi xóa và lưu ngay. Muốn dùng lại: bấm Sửa → chọn chỉ tiêu → <b>+ Thêm dòng</b> → Lưu ngưỡng.<br>
  <b>Ngưỡng đơn giá mua / bán:</b> mỗi dòng mua (bán) được so với đơn giá bình quân của cùng mã hàng trong kỳ đang xem (mã cần có ít nhất 2 dòng). Lệch ≥ ngưỡng Cảnh báo thì đưa vào bảng <i>Đơn giá mua / bán bất thường</i> ở tab Kiểm tra số liệu (Giá mua cao / thấp, Giá bán cao / thấp); lệch ≥ ngưỡng Rủi ro cao thì nhãn tô đỏ. Bảng này cố định 2 dòng Giá mua và Giá bán.<br>
  Ngoài ra bảng đơn giá bất thường luôn báo: <i>Bán dưới giá vốn</i>, <i>Doanh số = 0</i>, <i>Thiếu đơn giá</i> (dòng mua có số lượng nhưng chưa có đơn giá / thành tiền) – không phụ thuộc ngưỡng.<br>
  <b>Trạng thái tồn kho</b> (cột Trạng thái ở Nhập – Xuất – Tồn và bảng Rủi ro tồn kho) dựa trên <i>số ngày còn dùng</i> = tồn cuối ÷ xuất bình quân ngày (ngưỡng cố định, không sửa ở bảng ngưỡng): tồn cuối âm → Âm kho; thành phẩm dưới 7 ngày → Tồn TP thấp, trên 30 ngày → Giảm SX TP; NVL có tồn dưới nhu cầu 5 ngày → Tồn thấp – cần mua; NVL chính (NVLC) trên 90 ngày → quá dư; NVL khác trên 30 ngày → hạn chế mua; nhóm PG / GV / BB trên 180 ngày → rủi ro tồn lâu, trên 365 ngày → quá dư.</div></div>
  <div class="box"><h3>Sang năm mới & mở sổ lại</h3><div class="small" style="line-height:1.7">
  <b>Sang năm mới:</b> không cần thao tác – tồn cuối tháng 12 tự động trở thành tồn đầu tháng 1 năm sau. Chỉ cần tiếp tục nhập mua hàng, lệnh SX, bán hàng của năm mới, đổi <b>Năm làm việc</b> ở Tổng quan để xem báo cáo năm mới.<br>
  <b>Mở sổ lại</b> từ một kỳ (lấy số kiểm kê làm tồn đầu): vào Thiết lập & sao lưu → ô Thông tin chung bấm Sửa → đổi <b>Kỳ bắt đầu</b> → Lưu, rồi nhập lại <b>Số dư NXT đầu kỳ</b> (sheet TonDau). Dữ liệu các kỳ trước vẫn được giữ nhưng không còn ảnh hưởng đến số dư.</div></div>
  <div class="box"><h3>Quy ước màn hình</h3><ul class="tight"><li>Ô <b>Xem</b> (Cả năm / Tháng / Từ ngày – đến ngày) mặc định là <b>Cả năm</b> của năm làm việc và được nhớ <b>riêng cho từng menu</b>: đổi kỳ ở menu này không làm đổi kỳ ở menu khác. Đổi <b>Năm làm việc</b> ở Tổng quan thì mọi menu về Cả năm của năm mới.</li><li><b>Tổng quan</b> và <b>Cảnh báo & kiểm tra</b> luôn tính theo dữ liệu mới nhất (kể cả lãi gộp, giá trị 154, giá trị tồn) – không cần bấm nút.</li><li><b>Cập nhật số liệu ở các màn hình khác:</b> những gì không liên quan đến tính giá thành (số lượng nhập – xuất – tồn, doanh số, kiểm tra dữ liệu, cảnh báo tồn âm…) cập nhật ngay khi lưu, không cần bấm nút. Giá vốn, giá trị tồn, giá thành 621/622/627/154, lãi gộp, File tải dữ liệu Misa, đề xuất sản xuất và đề xuất điều chỉnh NVL chỉ cập nhật khi vào mục <b>Giá thành</b> bấm <b>▶ Tính giá thành</b>.</li><li>Ở các màn hình báo cáo, nút Xuất Excel, Làm mới, Thiết lập bảng (và ▶ Tính giá thành ở Giá thành, 🔒 Khóa kỳ ở Tổng quan) nằm cùng hàng với ô chọn Năm, canh phải.</li><li>Ô <b>vàng</b>: nhập liệu. Ô <b>xám</b>: phần mềm tự tính – không sửa.</li><li>Thanh nút của mỗi bảng: <b>Thêm</b> (dòng mới) · <b>Xuất Excel</b> · <b>Nhập Excel</b> (kéo thả tệp đúng mẫu, tải mẫu ngay trong cửa sổ) · biểu tượng hai mũi tên xoay vòng = <b>Làm mới dữ liệu</b> (lưu phần đang chờ rồi đọc lại dữ liệu đã lưu, hữu ích khi mở trên nhiều máy) · biểu tượng thanh trượt = <b>Thiết lập bảng</b> (bỏ tích để ẩn cột, mũi tên lên / xuống để đổi thứ tự cột, bấm Lưu; nhớ riêng từng bảng, có nút Trả về mặc định).</li><li>Nút biểu tượng trên mỗi dòng (rê chuột để xem tên): cây bút = <b>Sửa</b> · đĩa mềm = <b>Lưu</b> (Enter cũng lưu) · thùng rác đỏ = <b>Xóa</b> ( khi đang sửa dòng mới thì bỏ dòng; phím Esc = bỏ).</li><li>Chế độ <b>Thay thế các kỳ có trong tệp</b>: tải lại cùng tháng nhiều lần không trùng.</li></ul></div>`;
  bindKy();
}
// ---------- Kế hoạch & đề xuất sản xuất ----------
function capRule(maTP, date){ if(!date) return null; const c=state.caps.filter(x=>x.maTP===maTP && x.tuNgay && date>=x.tuNgay && date<=(x.denNgay||'9999-12-31')).sort((a,b)=>b.tuNgay.localeCompare(a.tuNgay)); return c[0]||null; }
function bomInfo(maTP, loai='DM', date){ const rows=bomFor(maTP, loai, date); const r=date?capRule(maTP,date):null; return {slTP: rows.length?num(rows[0].slTP):0, lanNgay: r? num(r.lanNgay) : (rows.length?num(rows[0].lanNgay):0), meThang: r? num(r.meThang):0, capSrc: r?'thời kỳ':'định mức', rows}; }
function ordersOn(ngay, maTP){ return state.orders.filter(o=>o.ngaySX===ngay && o.maTP===maTP); }
function planStatus(r){
  const os = ordersOn(r.ngaySX, r.maTP); const me = num(r.soMe);
  if (!os.length) return me>0 ? {code:'new', text:'Chưa có lệnh → tạo mới'} : {code:'none', text:'Không SX'};
  const cur = sum(os, o=>num(o.soMeKH)+num(o.dieuChinhMe));
  if (Math.abs(cur-me)<1e-9) return {code:'ok', text:`Đã khớp (${os.map(o=>o.maLenh).join(', ')})`};
  return {code:'upd', text:`Lệnh ${os[0].maLenh}: ${fmtQ(cur)} → ${fmtQ(me)} mẻ`};
}
function applyPlanRow(r){
  const os = ordersOn(r.ngaySX, r.maTP); const me=num(r.soMe);
  if (!os.length) { if (me>0) state.orders.push({_id:uid(), maLenh:genMaLenh(r.ngaySX), ngayXuatNVL:r.ngaySX, ngaySX:r.ngaySX, maTP:r.maTP, loaiDM:'DM', soMeKH:me, dieuChinhMe:0, ghiChu:'Từ kế hoạch SX'}); return; }
  const o=os[0]; o.dieuChinhMe = round(me - num(o.soMeKH), 6);
}
function proposalParams(){ const s=state.settings; return {tonLau: num(s.tonLau)||75, duPhong: num(s.duPhong)||5, boQua: s.boQua!=null && s.boQua!=='' ? num(s.boQua) : 0.1}; }
function buildProposal(p){
  const prm = proposalParams(); const items=itemMap(); const nx={}; p.nxt.forEach(x=>nx[x.ma]=x);
  const meTH = {}; p.orders.forEach(o=>meTH[o.maTP]=(meTH[o.maTP]||0)+o.soMe);
  const tps = state.items.filter(i=>i.nhom==='Thành phẩm').map(i=>i.ma).filter(ma=>bomFor(ma,'DM').length);
  // tỷ trọng giá trị từng NVL trong TP
  const share = {}; tps.forEach(tp=>{ const rows=bomFor(tp,'DM'); const tot=sum(rows,b=>num(b.slNVL)*(p.giaVon[b.maNVL]||0)); share[tp]={}; rows.forEach(b=>share[tp][b.maNVL]= tot? num(b.slNVL)*(p.giaVon[b.maNVL]||0)/tot : 0); });
  const tpDays = ma => { const x=nx[ma]; return x && x.bq>0 ? x.closeSL/x.bq : (x && x.closeSL>0 ? Infinity : 0); };
  const endDay = p.isRange ? rangeOf(p.ky).to : (p.isYear ? `${p.ky}-12-31` : `${p.ky}-${String(daysInMonth(p.ky)).padStart(2,'0')}`);
  // kỳ đang diễn ra: chỉ đề xuất / xếp mẻ đến hôm nay
  const capDay = (()=>{ const t=todayISO(); return t<endDay ? t : endDay; })();
  const lastDay0 = p.orders.length ? p.orders.map(o=>o.ngaySX).sort().pop() : endDay; const lastDay = lastDay0 < capDay ? lastDay0 : capDay;
  const remDays = Math.max(0, Math.round((new Date(endDay+'T00:00:00') - new Date(lastDay+'T00:00:00'))/86400000));
  const monthDays = (()=>{ const out=[]; if (p.isRange) { const r=rangeOf(p.ky); const d=new Date(r.from+'T00:00:00'); const end=new Date(r.to+'T00:00:00'); while (d<=end) { out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); } return out; } if (p.isYear) { for (let mth=1; mth<=12; mth++){ const k=`${p.ky}-${String(mth).padStart(2,'0')}`; for (let d=1; d<=daysInMonth(k); d++) out.push(`${k}-${String(d).padStart(2,'0')}`); } } else for (let d=1; d<=daysInMonth(p.ky); d++) out.push(`${p.ky}-${String(d).padStart(2,'0')}`); return out.filter(d=>d<=capDay); })();
  const dayLoad = {}; state.orders.forEach(o=>{ dayLoad[o.ngaySX+'|'+o.maTP]=(dayLoad[o.ngaySX+'|'+o.maTP]||0)+num(o.soMeKH)+num(o.dieuChinhMe); });
  const roomDays = tp => { const any = monthDays.some(d=>bomInfo(tp,'DM',d).lanNgay>0); if (!any) return null; return monthDays.filter(isWorkDay).map(d=>{ const ln=bomInfo(tp,'DM',d).lanNgay; return {d, room: ln ? Math.max(0, ln-(dayLoad[d+'|'+tp]||0)) : 0}; }).filter(x=>x.room>0); };
  const capLeft = tp => { const r=roomDays(tp); if (r===null) return Infinity; let cap=sum(r, x=>x.room); const mt = monthDays.map(d=>bomInfo(tp,'DM',d).meThang).find(v=>v>0); if (mt) { const sched = sum(monthDays, d=>dayLoad[d+'|'+tp]||0); cap=Math.min(cap, Math.max(0, mt-sched)); } return cap; };
  const reserved = {}; const resCap = {}; // NVL và năng lực đã giữ chỗ cho các đề xuất trước
  const ts0 = {}; tpSummary(p).forEach(x=>ts0[x.ma]=x);
  const laiKg = tp => { const s=ts0[tp]; return s && s.gb ? (s.gb - s.gv) : 0; };
  const limitByNVL = (tp, me, skipMa) => { // giới hạn mẻ tăng bởi NVL khác có tỷ trọng > boQua, rồi bởi năng lực còn lại trong kỳ
    let lim = me, by=''; const cap=Math.max(0, capLeft(tp)-(resCap[tp]||0)); if (cap<lim) { lim=cap; const bi=bomInfo(tp,'DM',monthDays[monthDays.length-1]); by=`năng lực còn trống trong tháng (${fmtQ(bi.lanNgay)} mẻ/ngày${bi.meThang?`, tối đa ${fmtQ(bi.meThang)} mẻ/tháng`:''} – theo ${bi.capSrc})`; }
    bomFor(tp,'DM').forEach(b=>{ if (b.maNVL===skipMa) return; const sh=share[tp][b.maNVL]||0; if (sh<=prm.boQua) return; const x=nx[b.maNVL]; const avail = x ? Math.max(0, x.closeSL - x.bq*prm.duPhong - (reserved[b.maNVL]||0)) : 0; const mx = num(b.slNVL)>0 ? Math.floor(avail/num(b.slNVL)) : me; if (mx<lim){ lim=mx; by=b.maNVL; } }); return {lim:Math.max(0,lim), by};
  };
  const reserve = (tp, me) => { bomFor(tp,'DM').forEach(b=>{ reserved[b.maNVL]=(reserved[b.maNVL]||0)+num(b.slNVL)*me; }); resCap[tp]=(resCap[tp]||0)+me; };
  const rankTPs = (list, nvlMa) => list.map(tp=>{ const q = nvlMa ? num((bomFor(tp,'DM').find(b=>b.maNVL===nvlMa)||{}).slNVL) : 0; return {tp, d:tpDays(tp), lai:laiKg(tp), q}; }).sort((a,b)=> (a.d-b.d) || (b.lai-a.lai) || (b.q-a.q));
  const rows=[];
  state.items.filter(i=>i.nhom==='NVLC').forEach(nvl=>{
    const x=nx[nvl.ma]; if(!x) return; const users = tps.filter(tp=>bomFor(tp,'DM').some(b=>b.maNVL===nvl.ma));
    if (!users.length) { if (x.closeSL!==0) rows.push({ma:nvl.ma, ten:nvl.ten, days:x.days, tp:'', tenTP:'', note:'NVLC không có thành phẩm phù hợp', st:'Chưa thể đề xuất', me:0}); return; }
    if (x.closeSL < 0) {
      const tp = users.sort((a,b)=>tpDays(b)-tpDays(a))[0]; const q=num(bomFor(tp,'DM').find(b=>b.maNVL===nvl.ma).slNVL); const can = q>0 ? Math.ceil(-x.closeSL/q) : 0; const slTPme=bomInfo(tp).slTP; const tonTP=(nx[tp]||{}).closeSL||0; const maxTP = slTPme>0 ? Math.max(0, Math.floor(tonTP/slTPme)) : 0; const me = Math.min(can, meTH[tp]||0, maxTP); const sau = x.closeSL + me*q;
      rows.push({ma:nvl.ma, ten:nvl.ten, days:x.days, tp, tenTP:(items[tp]||{}).ten, tpDays:tpDays(tp), bq:(nx[tp]||{}).bq||0, slTP:bomInfo(tp).slTP, q, meLT:-can, meTH:meTH[tp]||0, me:-me, note: me<can ? `Giảm ${me}/${can} mẻ (giới hạn: tồn TP ${fmtQ(tonTP)} = ${maxTP} mẻ, đã SX ${meTH[tp]||0} mẻ); vẫn thiếu ${fmtQ(-sau)} ${nvl.dvt}` : `Giảm ${me} mẻ đủ bù tồn âm`, st:'Giảm sản xuất'});
    } else if (x.days!=null && x.days > prm.tonLau) {
      let du = Math.max(0, x.closeSL - x.bq*prm.tonLau - (reserved[nvl.ma]||0)); const ranked = rankTPs(users, nvl.ma); let rank=0;
      ranked.forEach(r=>{ const tp=r.tp, q=r.q; if (!q || du<=0) return; rank++; const meLT = Math.floor(du/q); if (meLT<=0) return; const L = limitByNVL(tp, meLT, nvl.ma);
        const reason = `Ưu tiên ${rank}: tồn TP ${r.d===Infinity?'∞':fmtN(r.d,0)} ngày, lãi ${fmtN(r.lai)}/${items[tp]?items[tp].dvt:''}, dùng ${fmtQ(q)} ${nvl.dvt}/mẻ`;

const isoD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      pnCu:x.goc.map(g=>`NK${g.slice(2,4)}${g.slice(5,7)}${g.slice(8,10)}-${hdNo(x.so)}`).join(', '), pnMoi:[...new Set(x.mv.map(r=>soPhieu[`${r.ngayNhap}|${x.k}|false`]))].join(', '),

  const E=v=>v==null?'':v;
  const ds=inv.map(x=>[x.pnCu, x.so, x.gt, x.rate==null?'':x.rate, E(x.thue), x.gt+(x.thue||0), x.d, x.ncc, x.gtMv, E(x.txMv), x.gtKem, E(x.txKem), x.goc.map(fmtD).join(', '), x.moi.map(fmtD).join(', '), x.pnMoi, x.soNVK]);
  const dc=inv.map(x=>{ const sGt=x.gtMv+x.gtKem; const dGt=x.gt-sGt; const dTx=x.thue==null?'':x.thue-((x.txMv||0)+(x.txKem||0));
    return [x.so, x.d, x.ncc, x.gt, E(x.thue), x.gtMv, x.gtKem, E(x.txKem), E(x.txMv), dGt, dTx, x.thue==null ? 'Chưa có % thuế' : (Math.abs(dGt)>1||Math.abs(num(dTx))>1) ? 'Lệch' : (x.gtKem>0 ? 'Khớp – chuyển một phần' : 'Khớp – chuyển toàn bộ')]; });
  return {mh:mh.map(r=>r.slice(0,27)), nvk, ds, dc, inv, n:mh.length, tt:sum(mh,r=>r[22]), tx:sum(mh,r=>num(r[24]))}; }
const DS_COLS = ['Phiếu nhập cũ','Số hóa đơn','Số tiền chưa thuế','% thuế','Thuế','Tổng thanh toán','Ngày hóa đơn','Nhà cung cấp','Nhập trước HĐ (không kèm HĐ)','Thuế khai NVK','Nhập theo HĐ (kèm HĐ)','Thuế kèm HĐ','Ngày nhập kho cũ','Ngày nhập kho mới','Phiếu nhập mới (không kèm HĐ)','Số chứng từ NVK'];

function sheetASP(hdr, rows, dateIdx, widths){ const aoa = hdr.concat(rows.map(r=>r.map((v,i)=> dateIdx.includes(i) && typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T00:00:00') : v))); const ws=XLSX.utils.aoa_to_sheet(aoa, {cellDates:true}); const n=hdr.length;
  for (let r=0;r<rows.length;r++) for (const c of dateIdx) { const a=XLSX.utils.encode_cell({r:n+r,c}); if (ws[a] && ws[a].t==='d') ws[a].z='dd/mm/yyyy'; } ws['!cols']=widths.map(w=>({wch:w})); return ws; }
function sheetWithDates(hdr, rows){ const aoa = hdr.concat(rows.map(r=>r.map((v,i)=> (i===1||i===2) && typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T00:00:00') : v))); const ws=XLSX.utils.aoa_to_sheet(aoa, {cellDates:true}); const n=hdr.length; for (let r=0;r<rows.length;r++) for (const c of [1,2]) { const a=XLSX.utils.encode_cell({r:n+r,c}); if (ws[a]) { ws[a].t='d'; ws[a].z='dd/mm/yyyy'; } } ws['!cols']=[20,16,16,18,12,18,34,12,34,8,8,8,8,12,16,24].map(w=>({wch:w})); return ws; }
function vXuatPhieu(m){
  const p=P(); if(!p) return noData(m); const tab=m.dataset.ptab||'xk'; const xk=buildXK(p), nk=buildNK(p); const k=ktSettings();
  const prev = (rows, hdr) => `<div class="tw"><table><thead><tr>${hdr[hdr.length-1].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,400).map(r=>`<tr>${r.map((v,i)=>`<td class="${i===13?'n':''}">${esc((i===1||i===2)?fmtD(v):(i===13?fmtQ(v):v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>400?`<div class="small mut">Chỉ xem trước 400/${rows.length} dòng – tệp xuất có đủ.</div>`:''}`;
  m.innerHTML = head(`File tải dữ liệu kế toán (mẫu ASP)`, `<button class="btn p" id="exBoth">${IC('xlOut')}Xuất Excel</button>`) +

    const sub=`<div class="subtabs">${[['mh','Mua hàng trong nước'],['nvk','Nghiệp vụ khác'],['ds','DS HĐ chuyển ngày'],['dc','Đối chiếu HĐ']].map(([k,t])=>`<button data-at="${k}" class="${st===k?'act':''}">${t}</button>`).join('')}</div>`;
    if (!a.n) return sub+`<div class="box" style="text-align:center;padding:18px"><span class="pill ok" style="font-size:var(--fs);padding:6px 14px">Kỳ ${esc(fmtKy(selKy))} không có phiếu mua chuyển ngày nhập kho về trước hóa đơn</span></div>`;

    const td=(v,cls)=>`<td class="${cls||''}">${v}</td>`; const nN=v=>td(v===''?'':fmtN(v),'n'); const dD=v=>td(fmtD(v));
    if (st==='mh') { const H=MH_HDR[MH_HDR.length-1]; return sub+T(H, a.mh, (v,i)=> [4,5,10].includes(i)?dD(v) : i===20?td(fmtQ(v),'n') : [21,22,24].includes(i)?nN(v) : td(esc(v)), `<tr class="tot"><td>Tổng cộng</td>${H.slice(1).map((_,i)=>i===21?`<td class="n">${fmtN(a.tt)}</td>`:i===23?`<td class="n">${fmtN(a.tx)}</td>`:'<td></td>').join('')}</tr>`); }
    if (st==='nvk') { const H=NVK_HDR[NVK_HDR.length-1]; return sub+T(H, a.nvk, (v,i)=> [1,2,16].includes(i)?dD(v) : [8,11,14].includes(i)?nN(v) : td(esc(v)), `<tr class="tot"><td>Tổng cộng</td>${H.slice(1).map((_,i)=>i===7?`<td class="n">${fmtN(sum(a.inv,x=>x.txMv||0))}</td>`:i===10?`<td class="n">${fmtN(sum(a.inv,x=>x.gtMv))}</td>`:i===13?`<td class="n">${fmtN(sum(a.inv,x=>x.txMv||0))}</td>`:'<td></td>').join('')}</tr>`); }
    if (st==='ds') return sub+`<div class="small" style="margin:4px 0 6px">% thuế mặc định <input id="aspVat" style="width:56px" inputmode="decimal" value="${esc(state.settings.aspVat??'')}" placeholder="trống"> <span class="mut">– sửa % thuế từng hóa đơn ở cột "% thuế"</span></div>` +
      T(DS_COLS, a.ds, (v,i,r)=> i===3 ? `<td class="n"><input class="aspR" data-k="${esc(a.inv[a.ds.indexOf(r)].k)}" title="Sửa % thuế của hóa đơn này" style="width:52px;text-align:right;border:none;background:transparent;outline:none;font:inherit" inputmode="decimal" value="${v===''?'':v}"></td>` : [2,4,5,8,9,10,11].includes(i)?nN(v) : i===6?dD(v) : td(esc(v)),
        `<tr class="tot"><td>Tổng cộng</td>${DS_COLS.slice(1).map((_,j)=>{ const i=j+1; return [2,4,5,8,9,10,11].includes(i)?`<td class="n">${fmtN(sum(a.ds,r=>num(r[i])))}</td>`:'<td></td>'; }).join('')}</tr>`);
    return sub+T(DC_COLS, a.dc, (v,i)=> [3,4,5,6,7,8,9,10].includes(i)?nN(v) : i===1?dD(v) : i===11?td(esc(v), /^Khớp/.test(v)?'':'mut') : td(esc(v)),
      `<tr class="tot"><td>Tổng cộng</td><td></td><td></td>${[3,4,5,6,7,8,9,10].map(i=>`<td class="n">${fmtN(sum(a.dc,r=>num(r[i])))}</td>`).join('')}<td></td></tr>`); })());
  bindKy(); m.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ m.dataset.ptab=b.dataset.t; render(); });
  const mk = (which) => { if (typeof XLSX==='undefined') return toast('Thư viện Excel chưa tải được'); const wb=XLSX.utils.book_new(); if (which!=='nk') XLSX.utils.book_append_sheet(wb, sheetWithDates(XK_HDR, xk), 'XK NVL'); if (which!=='xk') XLSX.utils.book_append_sheet(wb, sheetWithDates(NK_HDR, nk), 'NK TP'); saveWb(wb, `${which==='xk'?'Misa_XK_NVL':which==='nk'?'Misa_NK_TP':'Misa_Phieu_kho'}_${selKy}.xlsx`); };
  $('#exBoth').onclick=()=> tab==='mh' ? mkAsp() : mk('both');
  const mkAsp = () => { if (typeof XLSX==='undefined') return toast('Thư viện Excel chưa tải được'); const a=buildASP(); if (!a.n) return toast('Kỳ này không có phiếu mua chuyển ngày nhập kho về trước hóa đơn');
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, sheetASP(MH_HDR, a.mh, [4,5,10], [6,16,16,18,14,14,22,10,10,12,12,14,36,40,12,34,8,10,10,8,10,12,14,8,12,8,8]), 'Mua hang trong nuoc ');
    XLSX.utils.book_append_sheet(wb, sheetASP(NVK_HDR, a.nvk, [1,2,16], [6,14,14,20,50,30,8,8,14,12,30,16,8,8,14,8,14,14,10,10,8,12,40]), 'Nghiep vu khac');
    const tot=(n, idx)=>{ const r=new Array(n).fill(''); r[0]='Tổng cộng'; return r; };
    const dsTot=tot(DS_COLS.length); [2,4,5,8,9,10,11].forEach(i=>dsTot[i]=sum(a.ds,r=>num(r[i])));
    XLSX.utils.book_append_sheet(wb, sheetASP([DS_COLS], a.ds.concat([dsTot]), [6], [20,14,16,8,14,16,14,40,18,14,18,14,18,18,24,20]), 'DS HD chuyen ngay');
    const dcTot=tot(DC_COLS.length); [3,4,5,6,7,8,9,10].forEach(i=>dcTot[i]=sum(a.dc,r=>num(r[i])));
    XLSX.utils.book_append_sheet(wb, sheetASP([DC_COLS], a.dc.concat([dcTot]), [1], [14,14,40,16,14,18,18,16,16,14,14,22]), 'Doi chieu HD');
    saveWb(wb, `File_tai_HD_chuyen_ngay_nhap_kho_${selKy}.xlsx`); };

// ---------- Giữ nguyên vị trí đang xem (màn hình, tab, kỳ, ô tìm, vị trí cuộn) khi tải lại trang / khi phần mềm được cập nhật ----------
const UI_KEY = 'gt_ui_v1';
const uiState = {
  restoring: null, timer: null,
  store(){ try { return window.localStorage; } catch(e){ return null; } },
  snapshot(){ const m=$('#main'); const tw=m && m.querySelector('.tw'); const se=document.scrollingElement||document.documentElement;
    const ds={}; if (m) ['tab','stab','ptab','ktab','atab'].forEach(k=>{ if (m.dataset[k]) ds[k]=m.dataset[k]; });
    return { v:1, view, selKy, kyByView, kyDefault, search, searchBy:{...searchBy, [searchCur]:search}, searchCur, ds, nxtTab, cbTab, cdTab, scroll:{ win:se?se.scrollTop:0, main:m?m.scrollTop:0, twT:tw?tw.scrollTop:0, twL:tw?tw.scrollLeft:0 }, at:Date.now() }; },
  save(){ const st=this.store(); if (!st || this.restoring) return; try { st.setItem(UI_KEY, JSON.stringify(this.snapshot())); } catch(e){} },
  later(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.save(), 250); },
  load(){ const st=this.store(); if (!st) return null; try { const o=JSON.parse(st.getItem(UI_KEY)||'null'); return o && o.v===1 ? o : null; } catch(e){ return null; } },
  apply(o){ if (!o) return false; const ok=k=>typeof k==='string' && /^(\d{4}(-\d{2})?|R:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2}|.+)$/.test(k);
    try { if (o.view && typeof o.view==='string') view=o.view; if (ok(o.selKy)) selKy=o.selKy; if (o.kyByView && typeof o.kyByView==='object') kyByView=o.kyByView; if (o.kyDefault!==undefined) kyDefault=o.kyDefault; if (typeof o.search==='string') search=o.search; if (o.searchBy && typeof o.searchBy==='object') searchBy=o.searchBy; if (typeof o.searchCur==='string') searchCur=o.searchCur;
      if (o.nxtTab) nxtTab=o.nxtTab; if (o.cbTab) cbTab=o.cbTab; if (o.cdTab) cdTab=o.cdTab; const m=$('#main'); if (m && o.ds) Object.entries(o.ds).forEach(([k,v])=>m.dataset[k]=v); this.restoring=o.scroll||null; return true; } catch(e){ return false; } },
  restoreScroll(){ const sc=this.restoring; if (!sc) return; const go=()=>{ const m=$('#main'); const tw=m && m.querySelector('.tw'); const se=document.scrollingElement||document.documentElement;
      if (se) se.scrollTop=sc.win||0; if (m) m.scrollTop=sc.main||0; if (tw) { tw.scrollTop=sc.twT||0; tw.scrollLeft=sc.twL||0; } };
    requestAnimationFrame(()=>{ go(); setTimeout(()=>{ go(); this.restoring=null; this.save(); }, 120); }); }
};
window.addEventListener('scroll', ()=>uiState.later(), {capture:true, passive:true});
window.addEventListener('pagehide', ()=>uiState.save()); document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') uiState.save(); });
// ---------- Khởi động ----------
window.app = { state, calc, importDocs: d=>{ fromDocs(d); changed(); selKy=''; render(); }, importAOA, toDocs, render, setKy: k=>{ state.settings.workYear=k.slice(0,4); selKy=k; kyByView={}; kyDefault=k; renderedKy=k; calcCache=null; render();} };
(async function(){

  try { const el=document.getElementById('pendingImport'); const PI=el && JSON.parse(el.textContent); let doneLocal=false; try { doneLocal = localStorage.getItem('gt_import_'+PI.id)==='1'; } catch(e){}

      const keep={...state.settings}; fromDocs(PI.docs); state.settings=Object.assign(state.settings, keep, PI.settings, {importId:PI.id, locked:[]});
      calcCache=null; calcDirty=true; selKy=''; kyByView={}; kyDefault=null; changed(); await store.flush(); try { localStorage.setItem('gt_import_'+PI.id,'1'); } catch(e){}
      setTimeout(()=>toast('Đã nạp dữ liệu mới từ các file Excel (thay dữ liệu cũ, không có số dư đầu kỳ) – vào Giá thành bấm ▶ Tính giá thành', 8000), 300);
    } } catch(e){ console.error('pendingImport', e); }

  try { if (fixCodesOnce()) { calcCache=null; calcDirty=true; changed(); await store.flush(); setTimeout(()=>toast('Đã thay mã MUIHEO1 bằng PG_GREENINNO trong định mức', 5000), 400); } } catch(e){ console.error('fixCodes', e); }
  const ui = uiState.load(); let restored=false;
  if (ui) { restored = uiState.apply(ui); }
  try { render(); } catch(e){ console.error(e); view='tongquan'; selKy=''; kyByView={}; render(); }
  if (restored) uiState.restoreScroll();
})();
