<script>
/* Bảo vệ khởi động: nếu có lỗi hoặc treo, hiện thông báo rõ ràng thay vì trang trắng */
(function(){
  function box(html){ var m=document.getElementById('main'); var d=document.getElementById('bootErr');
    if(!d){ d=document.createElement('div'); d.id='bootErr'; d.style.cssText='margin:16px;padding:14px 16px;border:1px solid #fca5a5;background:#fef2f2;color:#991b1b;border-radius:10px;font:14px/1.5 system-ui,sans-serif'; (m||document.body).prepend(d); }
    d.innerHTML=html; }
  window.__bootBox = box;
  window.addEventListener('error', function(e){ if(window.__booted) return; box('<b>⚠ Phần mềm gặp lỗi khi khởi động.</b> Dữ liệu trên tài khoản <b>không bị ảnh hưởng</b>. Hãy chụp màn hình khung này gửi lại để sửa.<br><small>'+String(e.message||e.error||'').replace(/</g,'&lt;')+(e.lineno?' (dòng '+e.lineno+')':'')+'</small>'); });
  window.addEventListener('unhandledrejection', function(e){ if(window.__booted) return; var r=e.reason; box('<b>⚠ Phần mềm gặp lỗi khi tải dữ liệu.</b> Dữ liệu trên tài khoản <b>không bị ảnh hưởng</b>. Hãy chụp màn hình khung này gửi lại để sửa.<br><small>'+String(r&&(r.message||r)||'').replace(/</g,'&lt;')+'</small>'); });
  setTimeout(function(){ if(!window.__booted) box('<b>⏳ Phần mềm chưa tải xong sau 60 giây.</b> Dữ liệu trên tài khoản vẫn còn. Hãy kiểm tra mạng / đăng nhập Claude rồi tải lại trang (F5).<br><small>Bước đang chờ: '+(window.__bootStep||'khởi động')+'</small>'); }, 60000);
})();
</script>
<script>
/* =========================================================
   PHẦN MỀM GIÁ THÀNH – nhiều năm, chuyển số dư đầu kỳ
   ========================================================= */
'use strict';

/* =====================================================================
   SƠ ĐỒ MÃ NGUỒN (để tùy biến cho công ty khác)
   PHẦN DÙNG CHUNG (giữ nguyên):
     Tiện ích · Lưu trữ (store/toDocs/fromDocs) · Giao diện (NAV, head, render)
     Lưới nhập liệu (GRID/vGrid) · Nhập Excel (importDialog/importAOA/TEMPLATE)
     Bảng kiểu Excel (enhanceTables) · Khóa kỳ · Thiết lập · Hướng dẫn
   PHẦN RIÊNG THEO CÔNG TY (sửa ở đây):
     [A] Định nghĩa dữ liệu: F (thứ tự cột), GRID (cột, công thức phụ), TEMPLATE/SAMPLES (mẫu Excel), NAV (menu)
     [B] Tính toán: calc() – giá vốn, trải định mức, 621/622/627/154, NXT, chuyển kỳ
     [C] Đề xuất: buildProposal / buildAdjProposal / applyProposalCore / proposalParams
     [D] Chuỗi tự chạy: runCalcFor / showCalcResult
     [E] Báo cáo: vTongQuan, vNXT, vGiaThanh, vNam, vCanhBao
     [F] Xuất kế toán: XK_HDR/NK_HDR, buildXK/buildNK, ktSettings
     [G] Dữ liệu mẫu: <script id="seed"> (để {} nếu không có)
   ===================================================================== */
// ---------- Tiện ích ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (v, d=0) => (v==null || v==='' || isNaN(v)) ? '' : Number(v).toLocaleString('vi-VN', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtQ = v => (v==null || isNaN(v)) ? '' : Number(v).toLocaleString('vi-VN', {maximumFractionDigits:3});
const fmtPct = v => (v===''||v==null||!num(v)) ? '' : (num(v)*100).toLocaleString('vi-VN',{maximumFractionDigits:4})+'%';
const pctIn = v => { let t=String(v==null?'':v).trim(); if(!t) return 0; t=t.replace('%','').trim(); if(t.includes(',') && !/\.\d{3}/.test(t)) t=t.replace(',','.'); return num(t)/100; };
const fmtP = v => (v==null || isNaN(v)) ? '' : (v*100).toLocaleString('vi-VN', {maximumFractionDigits:1}) + '%';
const fmtD = s => { if(!s) return ''; const [y,m,d]=String(s).split('-'); return d && m && y ? `${d}/${m}/${y}` : s; };
const fmtKy = ky => { if(!ky) return ''; if(ky.startsWith('R:')) { const [,a,b]=ky.split(':'); return `${fmtD(a)} – ${fmtD(b)}`; } if(ky.length===4) return `cả năm ${ky}`; const [y,m]=ky.split('-'); return `${m}/${y}`; };
const kyOf = s => (s||'').slice(0,7);
const num = v => { if (v==null || v==='') return 0; if (typeof v==='number') return v; const t=String(v).trim().replace(/\s/g,''); let x; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) x=parseFloat(t.replace(/\./g,'').replace(',','.')); else if(/^-?\d+,(\d{1,2}|\d{4,})$/.test(t)) x=parseFloat(t.replace(',','.')); else x=parseFloat(t.replace(/,/g,'')); return isNaN(x)?0:x; };
const daysInMonth = ky => { const [y,m]=ky.split('-').map(Number); return new Date(y,m,0).getDate(); };
const nextKy = ky => { let [y,m]=ky.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
const todayKy = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const round = (v,d) => { if (!isFinite(v) || !v) return v||0; const sg=v<0?-1:1; const x=Number(Math.abs(v).toPrecision(15)); return sg*Number(Math.round(Number(x+'e'+d))+'e-'+d); }; // làm tròn như hàm ROUND của Excel (15 chữ số)
const sum = (a, f) => a.reduce((s,x)=>s+(f?f(x):x),0);
// Nhập nhanh ngày: "15" = ngày 15 của tháng đang xem; "15/10" = 15/10 của năm đang xem
function quickDate(v){ const t=String(v||'').trim(); if(!t) return t; const k=(typeof selKy==='string' && /^\d{4}-\d{2}$/.test(selKy)) ? selKy : (typeof selKy==='string' && /^\d{4}/.test(selKy) ? selKy.slice(0,4)+'-'+String(new Date().getMonth()+1).padStart(2,'0') : null); if(!k) return t; let m=t.match(/^(\d{1,2})$/); if(m) return `${m[1].padStart(2,'0')}/${k.slice(5,7)}/${k.slice(0,4)}`; m=t.match(/^(\d{1,2})[\/.-](\d{1,2})$/); if(m) return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${k.slice(0,4)}`; return t; }
function toISODate(v){
  if (v==null || v==='') return '';
  if (v instanceof Date) { if (isNaN(v)) return ''; return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; }
  if (typeof v==='number') { if (v<20000 || v>80000) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s=String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2})$/); if (m) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function toKy(v){
  if (v==null || v==='') return '';
  if (v instanceof Date || typeof v==='number') return kyOf(toISODate(v));
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/](\d{4})$/); if(m) return `${m[2]}-${m[1].padStart(2,'0')}`;
  const d=toISODate(s); return d?kyOf(d):'';
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

// Dùng như SheetJS: XW.book_new / aoa_to_sheet / json_to_sheet / sheet_add_aoa / book_append_sheet / write. Đọc tệp vẫn dùng SheetJS.
const XW = (()=>{
  const FONT='Aptos Narrow', SZ=11;
  const book_new = () => ({SheetNames:[], Sheets:{}, _xw:true});
  const aoa_to_sheet = aoa => ({_aoa:(aoa||[]).map(r=>(r||[]).slice()), _bold:new Set([0])});
  const json_to_sheet = json => { const keys=[]; (json||[]).forEach(o=>Object.keys(o).forEach(k=>{ if(!keys.includes(k)) keys.push(k); })); const ws=aoa_to_sheet([keys, ...(json||[]).map(o=>keys.map(k=>o[k]??''))]); ws['!cols']=keys.map(k=>({wch:Math.max(10,Math.min(40,String(k).length+2))})); return ws; };
  const sheet_add_aoa = (ws, aoa, opt) => { const o=(opt&&opt.origin)||{r:ws._aoa.length,c:0}; (aoa||[]).forEach((row,i)=>{ const r=o.r+i; while (ws._aoa.length<=r) ws._aoa.push([]); row.forEach((v,j)=>{ ws._aoa[r][o.c+j]=v; }); }); return ws; };
  const book_append_sheet = (wb, ws, name) => { let n=String(name||'Sheet').replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Sheet'; let k=n, i=2; while (wb.SheetNames.includes(k)) k=(n.slice(0,28)+'_'+(i++)); wb.SheetNames.push(k); wb.Sheets[k]=ws; return wb; };
  const xesc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const colName = c => { let s=''; c++; while (c>0) { const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; };
  const serial = (y,m,d) => Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30))/86400000);
  // kiểu ô: 0 thường, 1 ngày dd/mm/yyyy, 2 tháng mm/yyyy, 3 tiêu đề đậm, 4 ngày đậm (không dùng)
  const cell = (v, ref, bold) => {
    if (v==null || v==='') return '';
    if (v instanceof Date && !isNaN(v)) return `<c r="${ref}" s="1"><v>${serial(v.getFullYear(), v.getMonth()+1, v.getDate())}</v></c>`;
    if (typeof v==='number') return isFinite(v) ? `<c r="${ref}"${bold?' s="3"':''}><v>${v}</v></c>` : '';
    if (typeof v==='boolean') return `<c r="${ref}" t="b"><v>${v?1:0}</v></c>`;
    const s=String(v); let m;
    if ((m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return `<c r="${ref}" s="1"><v>${serial(+m[1],+m[2],+m[3])}</v></c>`;
    if ((m=s.match(/^(\d{4})-(\d{2})$/)) && +m[2]>=1 && +m[2]<=12) return `<c r="${ref}" s="2"><v>${serial(+m[1],+m[2],1)}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${bold?' s="3"':''}><is><t xml:space="preserve">${xesc(s)}</t></is></c>`;
  };
  const sheetXml = ws => {
    const cols = (ws['!cols']||[]).map((c,i)=>c&&c.wch?`<col min="${i+1}" max="${i+1}" width="${Math.max(4,c.wch)+1}" customWidth="1"/>`:'').join('');
    const rows = ws._aoa.map((r,i)=>{ const b=ws._bold.has(i); const cs=(r||[]).map((v,j)=>cell(v, colName(j)+(i+1), b)).join(''); return cs?`<row r="${i+1}">${cs}</row>`:''; }).join('');
    const fz=ws['!freeze']; const sv = fz ? `<sheetViews><sheetView workbookViewId="0"><pane${fz.x?` xSplit="${fz.x}"`:''}${fz.y?` ySplit="${fz.y}"`:''} topLeftCell="${colName(fz.x||0)}${(fz.y||0)+1}" activePane="${fz.x&&fz.y?'bottomRight':fz.x?'topRight':'bottomLeft'}" state="frozen"/></sheetView></sheetViews>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${sv}<sheetFormatPr defaultRowHeight="15"/>${cols?`<cols>${cols}</cols>`:''}<sheetData>${rows}</sheetData></worksheet>`;
  };
  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="mm/yyyy"/></numFmts><fonts count="2"><font><sz val="${SZ}"/><name val="${FONT}"/><family val="2"/></font><font><b/><sz val="${SZ}"/><name val="${FONT}"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  // ZIP (lưu không nén) + CRC32
  const CRC = (()=>{ const t=new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = u => { let c=0xFFFFFFFF; for (let i=0;i<u.length;i++) c = CRC[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const zip = files => { const enc=new TextEncoder(); const parts=[], central=[]; let off=0;
    files.forEach(([name, text])=>{ const nm=enc.encode(name), data=enc.encode(text), crc=crc32(data);
      const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer), nm, data);
      const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
      central.push(new Uint8Array(c.buffer), nm); off += 30+nm.length+data.length; });
    const csz=central.reduce((s,a)=>s+a.length,0); const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csz,true); e.setUint32(16,off,true);
    const all=[...parts, ...central, new Uint8Array(e.buffer)]; const out=new Uint8Array(all.reduce((s,a)=>s+a.length,0)); let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; }); return out; };
  const write = wb => { const n=wb.SheetNames.length;
    const files=[['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${wb.SheetNames.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${wb.SheetNames.map((s,i)=>`<sheet name="${xesc(s)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wb.SheetNames.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', STYLES], ...wb.SheetNames.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`, sheetXml(wb.Sheets[s])])];
    return zip(files); };

})();

function dbBackend(db){

    async put(k,v){ await col.doc(k).set(v); },
    async del(k){ await col.doc(k).delete(); },
  };
}
function idbBackend(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('giathanh_kh', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('docs');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const idb = req.result;
      const tx = (mode, fn) => new Promise((r, j)=>{ const t=idb.transaction('docs', mode); const s=t.store||t.objectStore('docs'); const q=fn(s); t.oncomplete=()=>r(q && q.result); t.onerror=()=>j(t.error); });
      res({
        async loadAll(){ const o={}; await new Promise((r,j)=>{ const t=idb.transaction('docs'); const c=t.objectStore('docs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=r; t.onerror=()=>j(t.error); }); return o; },
        put(k,v){ return tx('readwrite', s=>s.put(v,k)); },
        del(k){ return tx('readwrite', s=>s.delete(k)); },
      });
    };
  });
}
function memBackend(){ const m={}; return { async loadAll(){return {...m};}, async put(k,v){m[k]=v;}, async del(k){delete m[k];} }; }

  const kg = pp ? sum(pp.orders.filter(o=>o.maTP==='BTP_BGKT'), o=>o.slTH) : 0; const gas = pp?num(pp.cp.gas):0;
  const n621bt=nvl('BT'), n621tp=nvl('TP'), t622=costSum(c,'622'), t627=costSum(c,'627')+gas; const t621=n621bt+n621tp; const t154=t621+t622+t627;
  return {ky, n621bt, n621tp, t621, t622, t627, gas, kg, d622:kg?t622/kg:0, d627:kg?t627/kg:0, t154, r621:t154?t621/t154:0, r622:t154?t622/t154:0, r627:t154?t627/t154:0, c641:pp?num(pp.chi641):0, un:pp?Math.abs(pp.unalloc622)+Math.abs(pp.unalloc627):0, thu:pp?sum(pp.orders,o=>o.thuHoi||0):0}; }

  $('#loiCompDo').onclick=()=>{ const pl=loiCompPlan(); const ch=pl.filter(x=>x.nw!==x.cur); if (!ch.length) return toast('Không có lệnh nào cần điều chỉnh'); confirmBox(`Tăng <b>${ch.length}</b> lệnh sản phẩm chính để bù hao hụt sản phẩm lỗi (tổng ${fmtQ(sum(ch,x=>x.cur))} → ${fmtQ(sum(ch,x=>x.nw))}). SL gốc được lưu để hoàn tác. Nên <b>Sao lưu (.json)</b> trước. Tiếp tục?`, ()=>{ const n=loiCompApply(pl); changed(); render(); toast(`Đã điều chỉnh ${n} lệnh – bấm ▶ Tính giá thành để cập nhật`, 4500); }); };
  $('#loiCompUndo').onclick=()=>{ const n=state.orders.filter(o=>o.slGoc!==''&&o.slGoc!=null).length; if (!n) return toast('Chưa có lệnh nào được bù hao hụt'); confirmBox(`Trả <b>${n}</b> lệnh về SL lệnh gốc?`, ()=>{ const k=loiCompUndo(); changed(); render(); toast(`Đã hoàn tác ${k} lệnh`); }); };
  $('#loiAdd').onclick=()=>{ const rows=read(); rows.push({maSP:(made[0]||{}).ma||'', maLoi:'', tyLe:0, gia:0, tuKy:'', ghiChu:''}); state.settings.spLoi=rows; render(); };
  m.querySelectorAll('[data-lrm]').forEach(b=>b.onclick=()=>confirmBox('Xóa quy tắc sản phẩm lỗi này?', ()=>{ const rows=read(); rows.splice(+b.dataset.lrm,1); state.settings.spLoi=rows; changed(); render(); }));
  $('#loiSave').onclick=()=>{ const rows=read(); const im=itemMap();
    for (const r of rows) { if (!r.maSP || !r.maLoi) return toast('Chọn đủ Sản phẩm chính và Mã sản phẩm lỗi', 4000); if (!isLoi(im[r.maLoi])) return toast(`Mã ${r.maLoi} phải thuộc nhóm "Sản phẩm lỗi" trong Danh mục hàng`, 4500); if (!(r.tyLe>=0 && r.tyLe<1)) return toast('Tỷ lệ lỗi phải từ 0% đến dưới 100%', 4000); if (r.tyLe>0 && !(r.gia>=0)) return toast('Giá bán ước tính không hợp lệ'); }

    state.settings.spLoi=rows; changed(); render(); toast('Đã lưu quy tắc sản phẩm lỗi – bấm ▶ Tính giá thành để áp dụng', 4000); };
}

function vHuongDan(m){

  `<div class="box"><h3>Trình tự làm việc hằng tháng (làm theo thứ tự)</h3><ol class="small" style="margin:4px 0 0 18px;line-height:1.8">

  <li><b>Nhập liệu</b> (nhóm 2): Mua hàng & Bán hàng (Nhập Excel chế độ <i>Thay thế các kỳ có trong tệp</i>), Xuất dùng chung (gas… loại <i>Chi phí sản xuất (627)</i>; xuất cho bán hàng loại <i>641</i>), cuối tháng Chi phí 622/627.</li>
  <li><b>▶ Tính giá thành</b> → chọn tháng → Tính. Phần mềm tự chạy: (1) <b>đề xuất sản xuất → đưa thẳng vào Lệnh sản xuất</b> cho các ngày chưa có lệnh, (2) tính giá thành bán thành phẩm → bánh gấu kem tươi → thành phẩm, (3) hoàn thiện NXT, (4) <b>đề xuất cân đối NVL</b> nếu tồn âm.</li>
  <li><b>Xem lại & sửa tay Lệnh sản xuất</b> (nhóm 3): sửa ô <i>Số lượng lệnh</i>, hoặc <i>Điều chỉnh TP (+/- thùng)</i> ở dòng thành phẩm (bán thành phẩm tự tính lại theo mẻ); thêm / xóa lệnh. Cột <i>Nguồn</i> cho biết lệnh do phần mềm đề xuất, đã sửa tay hay nhập tay.</li>
  <li><b>Cân đối NVL</b> – 2 cách: (a) <b>áp dụng đề xuất</b> (nút <i>Áp dụng cân đối NVL & tính lại</i> trong bảng kết quả, hoặc <i>⚙ Cân đối theo đề xuất</i> ở menu Cân đối NVL); (b) <b>tự nhập tay</b> dòng cân đối (ngày SX + mã sản phẩm + mã VT, số âm = giảm).</li>
  <li><b>▶ Tính giá thành lại</b>: tháng đã chạy đề xuất thì phần mềm <b>giữ nguyên Lệnh sản xuất</b> (kể cả phần sửa tay), chỉ tính lại giá thành, NXT và đề xuất cân đối NVL. Lặp đến khi Cảnh báo sạch, tồn không âm. Muốn làm lại từ đầu: tick <i>Đề xuất lại từ đầu</i> khi Tính (hoặc nút ⟲ Đề xuất lại từ tháng này ở Lệnh sản xuất) – xóa toàn bộ Lệnh sản xuất và Cân đối NVL từ tháng đó trở về sau (kể cả lệnh tay, nhập Excel) rồi đề xuất lại các tháng này.</li>
  <li><b>Xem kết quả</b>: Giá thành, NXT, Tổng hợp bán hàng theo mặt hàng, Tổng hợp năm, Cảnh báo & kiểm tra.</li>
  <li><b>🔒 Khóa kỳ</b> tháng đã xong; sao lưu .json tại Thiết lập. Tồn cuối tháng tự chuyển thành tồn đầu tháng sau.</li></ol></div>
  <div class="box"><h3>Sơ đồ sản xuất & tính giá thành (theo file Gia thanh - 26 TH)</h3><div class="small" style="line-height:1.7">
  <b>Cấp 1 – Bán thành phẩm theo mẻ</b>: Bánh khô (BTP_BGK) và Kem tươi (BTP_KT), mẻ 100 kg. NVL xuất = Số mẻ thực hiện × SL NVL/lần làm (+ cân đối).<br>
  <b>Cấp 2 – Bánh gấu kem tươi</b> (BTP_BGKT, nhóm "Thành phẩm"): 1 kg = 0,6 kg bánh khô + 0,4 kg kem tươi; SL xuất = ROUND(SL × (1 + hao hụt) × định mức, 1).<br>
  <b>Cấp 3 – Thành phẩm đóng gói</b> (TP_BKG 5 kg, TP_BKG_150G, TP_BKG_400G): bánh gấu kem tươi (không làm tròn) + túi, thùng (làm tròn 1 số lẻ).<br>
  Phần mềm tự xác định cấp theo định mức nên đổi mã / thêm sản phẩm cùng cấu trúc vẫn tính được.</div></div>
  <div class="box"><h3>Công thức áp dụng (khớp file Excel)</h3><ul class="tight small">
  <li><b>Giá BQ NVL mua</b> (sheet Tồn kho tháng cột P) = (Tồn đầu tiền + Tiền mua trong tháng) ÷ (Tồn đầu SL + SL mua) – dùng làm đơn giá NVL, bao bì, gas xuất trong tháng.</li>
  <li><b>Đơn giá bán thành phẩm / bánh gấu kem tươi</b> khi xuất cho công đoạn sau = Tổng 154 của sản phẩm đó trong tháng ÷ Tổng SL sản xuất trong tháng.</li>
  <li><b>621</b> = Tổng số lượng xuất × Đơn giá. <b>627</b> tháng = 6273 + 6274 + Điện + Nước + Xuất dùng chung loại Chi phí sản xuất (627). Xuất dùng chung loại Bán hàng (641) chỉ trừ kho, không vào giá thành.</li>
  <li><b>Phân bổ</b>: CĐ1 nhận 622 × tỷ lệ tổng CĐ1 (mặc định 80%) và 627 × 100%, chia Bánh khô / Kem tươi / BGKT theo tỷ lệ SP trong CĐ (622: 25/25/50%, 627: 60/20/20%), trong từng sản phẩm chia theo tỷ trọng 621 của lệnh. CĐ2 (thành phẩm đóng gói) nhận phần còn lại (622 × 20%) chia theo tỷ trọng 621 trong tháng.</li>
  <li><b>154</b> = 621 + 622 + 627; Giá vốn/đv của lệnh = (154 − thu hồi sản phẩm lỗi) ÷ SL đạt.</li>
  <li><b>Sản phẩm lỗi (bánh gấu khô dẹp)</b> – hỏng trong định mức, theo VAS 02: SL lỗi = SL thực hiện × tỷ lệ lỗi (${spLoiList().filter(r=>num(r.tyLe)>0).map(r=>`${esc(r.maSP)} ${fmtP(num(r.tyLe))}, ${fmtN(num(r.gia))} đ/${esc((itemMap()[r.maLoi]||{}).dvt||'đv')} từ ${r.tuKy?fmtKy(r.tuKy):'đầu'}`).join('; ')||'chưa thiết lập'}); <b>giá trị thu hồi = SL lỗi × giá bán ước tính</b> → nhập kho mã sản phẩm lỗi (Nợ 155 / Có 154) và <b>trừ khỏi giá thành sản phẩm đạt</b>. SL đạt = SL thực hiện − SL lỗi; đơn giá xuất cho công đoạn sau = Σ(154 − thu hồi) ÷ Σ SL đạt. Đề xuất SX tự tăng sản lượng để bù: cần SX = cần dùng ÷ (1 − tỷ lệ lỗi).</li>
  <li><b>Giá vốn BQ tháng</b> (NXT) = (Tồn đầu tiền + Nhập tiền) ÷ (Tồn đầu SL + Nhập SL); Xuất tiền = Xuất SL × Giá vốn BQ; giá vốn hàng bán theo giá vốn BQ của tháng bán.</li>
  <li><b>BQ/ngày</b> = phát sinh tháng ÷ số ngày Thứ 2–Thứ 7 từ đầu tháng đến ngày phát sinh cuối; <b>Số ngày còn dùng</b> = Tồn cuối ÷ BQ/ngày; <b>NVL cần lấy đủ 15 ngày</b> = BQ × 15 − tồn cuối.</li>
  <li>Đã đối chiếu với file Excel: 10 tháng năm 2026, 1.172 lệnh – NXT, 621, 622, 627, 154 từng lệnh khớp (chênh lệch &lt; 0,5 đồng).</li></ul></div>
  <div class="box"><h3>Đề xuất sản xuất – theo công suất năng lượng (điện + gas)</h3><ul class="tight small">
  <li><b>Đầu tháng</b> nhập <i>ước tính điện + gas</i> của tháng (Đề xuất sản xuất → tab 1). Khi đã nhập <i>tiền điện thực tế</i> ở Chi phí 622/627, phần mềm tự dùng số thực tế = điện + gas (Xuất dùng chung loại 627).</li>
  <li><b>Công suất tháng (kg bánh gấu kem tươi)</b> = năng lượng ÷ tỷ lệ đ/kg (nhập tay, hoặc gợi ý = bình quân 3 tháng gần nhất có đủ điện + gas). <b>Mỗi ngày làm việc</b> = công suất tháng ÷ số ngày làm việc (trừ Chủ nhật, ngày lễ, nghỉ chờ việc; Chủ nhật tăng ca được tính).</li>

// ---------- [C] Kế hoạch sản xuất & đề xuất (theo sheet Ke hoach SX, Cân đối NVL của file Excel) ----------
function bomInfo(maTP, loai='DM', date){ const rows=bomFor(maTP, loai, date); return {slTP: rows.length?num(rows[0].slTP):0, lanNgay: rows.length?num(rows[0].lanNgay):0, rows}; }
function ordersOn(ngay, maTP){ return state.orders.filter(o=>o.ngaySX===ngay && o.maTP===maTP); }
// Cấu trúc sản phẩm cho kế hoạch: thành phẩm đóng gói ← bánh gấu kem tươi (nhóm "Thành phẩm") ← bán thành phẩm theo mẻ
function planStructure(date){
  const items=itemMap(); const finals=[]; let X=null;
  state.items.filter(i=>isFinal(i)).forEach(f=>{ const b=bomFor(f.ma,'DM',date).find(b=>(items[b.maNVL]||{}).nhom==='Thành phẩm'); if (b) { finals.push({ma:f.ma, ten:f.ten, dm:num(b.slTP)?num(b.slNVL)/num(b.slTP):0}); X = X || b.maNVL; } });
  if (!X || !finals.length) return null;
  const btp = bomFor(X,'DM',date).filter(b=>isProd(items[b.maNVL])).map(b=>({ma:b.maNVL, ten:(items[b.maNVL]||{}).ten||b.maNVL, r:num(b.slTP)?num(b.slNVL)/num(b.slTP):0, bs:batchSize(b.maNVL, date)||1}));
  finals.sort((a,b)=>b.dm-a.dm);
  return {X, tenX:(items[X]||{}).ten||X, finals, btp};
}
const ceil9 = v => Math.ceil(round(v,9)); const floor9 = v => Math.floor(round(v,9));
function keyQty(v){ const r=round(v,3); return Number.isInteger(r) ? `${r}.` : String(r); }
// Năng lượng tháng (điện + gas): thực tế nếu đã nhập tiền điện tháng, nếu không dùng ước tính đầu tháng
function energyOf(ky){ const c=calc(); const P=c.periods[ky]; const dien=num((state.costs[ky]||{}).dien); const gas=P?num((P.cp||{}).gas):0; const uoc=num((planPrm().nlUoc||{})[ky]);
  if (dien>0) return {E:dien+gas, src:'Thực tế', dien, gas, uoc, noGas: !gas};
  return {E:uoc, src: uoc?'Ước tính':'', dien:0, gas, uoc}; }
// Tỷ lệ gợi ý: bình quân đ/kg BGKT của 3 tháng gần nhất có đủ điện + gas + sản xuất
function suggestRate(beforeKy){ const c=calc(); const ks=c.list.filter(k=>!beforeKy || k<beforeKy).slice().reverse(); const out=[];
  for (const k of ks) { const P=c.periods[k]; const dien=num((state.costs[k]||{}).dien), gas=num((P.cp||{}).gas); const kg=sum(P.orders.filter(o=>o.maTP==='BTP_BGKT'),o=>o.slTH); if (dien>0 && gas>0 && kg>0) out.push({k, r:(dien+gas)/kg}); if (out.length>=3) break; }
  return {rate: out.length ? Math.round(sum(out,x=>x.r)/out.length) : 0, from: out.map(x=>x.k).reverse()}; }

// Tháng đã chạy đề xuất: lần Tính giá thành sau giữ nguyên Lệnh SX hiện có (kể cả phần sửa tay)
function proposedList(){ return Array.isArray(state.settings.daDeXuat) ? state.settings.daDeXuat : []; }
function isProposed(ky){ return proposedList().includes(ky) || state.orders.some(o=>(o.nguon||'').startsWith('PM') && kyOf(o.ngaySX)===ky); }
function markProposed(ky){ const L=new Set(proposedList()); L.add(ky); state.settings.daDeXuat=[...L].sort(); }
// Đề xuất lại từ đầu: xóa TOÀN BỘ lệnh sản xuất (đề xuất, sửa tay, nhập tay, nhập Excel) và TOÀN BỘ cân đối NVL của tháng, rồi đề xuất lại
// Các tháng từ tháng chọn trở về sau có phát sinh (bán hàng / lệnh SX / cân đối) – đề xuất lại tháng 10 thì tháng 11, 12… cũng phải làm lại
function resetMonths(ky){ const s=new Set([ky]); state.orders.forEach(o=>{ const k=kyOf(o.ngaySX); if (k>ky) s.add(k); }); state.adjustments.forEach(a=>{ const k=kyOf(a.ngaySX); if (k>ky) s.add(k); }); state.sales.forEach(r=>{ const k=kyOf(r.ngay); if (k>ky) s.add(k); }); return [...s].filter(Boolean).sort(); }
function resetInfo(ky){ const ms=resetMonths(ky); return {months:ms, ords:state.orders.filter(o=>kyOf(o.ngaySX)>=ky).length, adj:state.adjustments.filter(a=>kyOf(a.ngaySX)>=ky).length, locked:ms.filter(k=>isLocked(k))}; }
function resetProposal(ky){ const o0=state.orders.length, a0=state.adjustments.length; state.orders=state.orders.filter(o=>!(kyOf(o.ngaySX)>=ky)); state.adjustments=state.adjustments.filter(a=>!(kyOf(a.ngaySX)>=ky)); state.settings.daDeXuat=proposedList().filter(k=>k<ky); calcCache=null; return {ords:o0-state.orders.length, adj:a0-state.adjustments.length}; }
// Khung "Đề xuất chưa áp dụng" ở màn hình Cân đối NVL (tính lại mỗi lần Tính giá thành, không lưu)
function adjBanner(){ let p=null; try { p=P(); } catch(e){} if (!p) return '';
  let d; try { d=buildAdjProposal(p); } catch(e){ return ''; }
  const when = lastCalc ? `tính lúc ${lastCalc.at.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}` : 'theo số liệu hiện có';
  const stale = calcDirty ? ` <span class="pill warn">dữ liệu đã thay đổi – bấm ▶ Tính giá thành để cập nhật đề xuất</span>` : '';

const NK_HDR = [['FILE MẪU PHIẾU NHẬP KHO ĐỂ NHẬP VÀO PHẦN MỀM ASP KẾ TOÁN'],['Hướng dẫn:'],['- Điền dữ liệu vào các cột tương ứng trên file này'],['- Các cột có dấu (*) là những cột bắt buộc'],['- Nếu muốn nhập nhiều thông tin hơn người dùng có thể tải mẫu đầy đủ/hoặc tự thêm cột trên mẫu cơ bản'],['- Các dòng dữ liệu phía dưới chỉ là ví dụ minh họa'],['','','','','','','','Chi tiết hàng tiền'],
  ['Loại nhập kho','Ngày hạch toán (*)','Ngày chứng từ (*)','Số chứng từ (*)','Mã đối tượng','Tên đối tượng','Diễn giải','Mã hàng','Tên hàng','Mã kho','TK Nợ (*)','TK Có (*)','ĐVT','Số lượng','Mã đối tượng THCP']];
const xlSerial = d => Math.round((new Date(d+'T00:00:00Z') - Date.UTC(1899,11,30))/86400000);
function ktSettings(){ const s=state.settings; return {maDT: s.ktMaDT||'', tenDT: s.ktTenDT||'', tkNoXK: s.ktTkNoXK||'621', tkCoNK: s.ktTkCoNK||'154'}; }
function buildXK(p){ const items=itemMap(); const k=ktSettings(); return p.lines.filter(l=>l.tong>0).slice().sort((a,b)=>(a.ngayXuatNVL+a.maLenh).localeCompare(b.ngayXuatNVL+b.maLenh)).map(l=>{ const it=items[l.maVT]||{}; const tp=items[l.maTP]||{}; return ['Xuất kho sản xuất', l.ngayXuatNVL, l.ngayXuatNVL, `XK${l.maTP}${xlSerial(l.ngayXuatNVL)}`, k.maDT, k.tenDT, `Xuất VL - ${tp.ten||l.maTP}`, l.maVT, it.ten||'', it.kho||'152', k.tkNoXK, it.kho||'152', it.dvt||'', round(l.tong,4), l.maTP, tp.ten||'']; }); }
function buildNK(p){ const items=itemMap(); const k=ktSettings(); return p.orders.filter(o=>o.slTH>0).slice().sort((a,b)=>(a.ngaySX+a.maLenh).localeCompare(b.ngaySX+b.maLenh)).flatMap(o=>{ const tp=items[o.maTP]||{}; const out=[['Nhập kho thành phẩm sản xuất', o.ngaySX, o.ngaySX, `TP-${o.maTP}${xlSerial(o.ngaySX)}`, k.maDT, k.tenDT, `Nhập kho TP sản xuất - ${tp.ten||o.maTP}`, o.maTP, tp.ten||'', tp.kho||'155', tp.kho||'155', k.tkCoNK, tp.dvt||'', round(o.slDat??o.slTH,4), o.maTP]];
  if (o.slLoi>0) { const lo=items[o.maLoi]||{}; out.push(['Nhập kho thành phẩm sản xuất', o.ngaySX, o.ngaySX, `TP-${o.maTP}${xlSerial(o.ngaySX)}`, k.maDT, k.tenDT, `Nhập kho sản phẩm lỗi thu hồi - ${lo.ten||o.maLoi}`, o.maLoi, lo.ten||'', lo.kho||'155', lo.kho||'155', k.tkCoNK, lo.dvt||'', round(o.slLoi,4), o.maTP]); }
  return out; }); }
function sheetWithDates(hdr, rows){ const ws=XW.aoa_to_sheet(hdr.concat(rows)); ws._bold=new Set([0, hdr.length-1]); ws['!cols']=[20,16,16,18,12,18,34,12,34,8,8,8,8,12,16,24].map(w=>({wch:w})); return ws; }
function vXuatPhieu(m){
  const p=P(); if(!p) return noData(m); const tab=m.dataset.ptab||'xk'; const xk=buildXK(p), nk=buildNK(p); const k=ktSettings();
  const prev = (rows, hdr) => `<div class="tw"><table><thead><tr>${hdr[hdr.length-1].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,400).map(r=>`<tr>${r.map((v,i)=>`<td class="${i===13?'n':''}">${esc((i===1||i===2)?fmtD(v):(i===13?fmtQ(v):v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>400?`<div class="small mut">Chỉ xem trước 400/${rows.length} dòng – tệp xuất có đủ.</div>`:''}`;
  m.innerHTML = head(`File tải dữ liệu kế toán (mẫu ASP) – ${fmtKy(selKy)}`, `<button class="btn p" id="exBoth">⬇ Xuất Excel</button><span class="pill">XK NVL ${xk.length} dòng · NK TP ${nk.length} dòng</span>`) +
  `<div class="bar"><span class="pill">Đối tượng: ${esc(k.maDT)} – ${esc(k.tenDT)}</span><span class="pill">TK Nợ xuất ${esc(k.tkNoXK)} · TK Có nhập ${esc(k.tkCoNK)}</span>${calcDirty?'<span class="pill warn">⚠ Dữ liệu đã thay đổi – bấm Tính giá thành trước khi xuất</span>':''}</div>
  <div class="tabs"><button data-t="xk" class="${tab==='xk'?'act':''}">Phiếu xuất kho NVL (XK NVL)</button><button data-t="nk" class="${tab==='nk'?'act':''}">Phiếu nhập kho TP (NK TP)</button></div>` + (tab==='xk' ? prev(xk, XK_HDR) : prev(nk, NK_HDR));
  bindKy(); m.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ m.dataset.ptab=b.dataset.t; render(); });
  const mk = (which) => { const wb=XW.book_new(); if (which!=='nk') XW.book_append_sheet(wb, sheetWithDates(XK_HDR, xk), 'XK NVL'); if (which!=='xk') XW.book_append_sheet(wb, sheetWithDates(NK_HDR, nk), 'NK TP'); saveWb(wb, `${which==='xk'?'KeToan_XK_NVL':which==='nk'?'KeToan_NK_TP':'KeToan_Phieu_kho'}_${selKy}.xlsx`); };
  $('#exBoth').onclick=()=>mk('both');
}

window.app = { state, calc, importDocs: d=>{ fromDocs(d); changed(); selKy=''; render(); }, importAOA, toDocs, render, setKy: k=>{ state.settings.workYear=k.slice(0,4); selKy=k; calcCache=null; render();} };
(async function(){
  $('#main').innerHTML = '<div class="note">Đang tải dữ liệu…</div>';
  try { await store.init(); }
  catch(e){ console.error(e); window.__bootBox && window.__bootBox('<b>⚠ Không tải được dữ liệu.</b> Dữ liệu trên tài khoản không bị ảnh hưởng. Hãy tải lại trang (F5).<br><small>'+esc(e&&e.message||e)+'</small>'); return; }
  if (state._migrated) { delete state._migrated; if (!store.readOnly) store.schedule(); }
  window.__bootStep = 'hiển thị';
  try { render(); window.__booted = true; }
  catch(e){ console.error(e); window.__booted = true; const m=$('#main'); m.innerHTML = `<div class="note" style="background:#fef2f2;border:1px solid #fca5a5;color:#991b1b"><b>⚠ Màn hình này bị lỗi khi hiển thị</b> (dữ liệu vẫn còn: ${state.items.length} mã hàng, ${state.purchases.length} dòng mua, ${state.orders.length} lệnh SX). Hãy chọn màn hình khác ở menu bên trái và chụp màn hình lỗi gửi lại.<br><small>${esc(e&&e.message||e)}</small></div>`; try{ renderNav(); }catch(_){}} 
})();
