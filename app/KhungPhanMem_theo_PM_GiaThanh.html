/* Bảo vệ khởi động: nếu có lỗi hoặc treo, hiện thông báo rõ ràng thay vì trang trắng */
(function(){
  function box(html){ var m=document.getElementById('main'); var d=document.getElementById('bootErr');
    if(!d){ d=document.createElement('div'); d.id='bootErr'; d.style.cssText='margin:16px;padding:14px 16px;border:1px solid #fca5a5;background:#fef2f2;color:#991b1b;border-radius:10px;font:14px/1.5 system-ui,sans-serif'; (m||document.body).prepend(d); }
    d.innerHTML=html; }
  window.__bootBox = box;
  window.addEventListener('error', function(e){ if(window.__booted) return; box('<b>⚠ Phần mềm gặp lỗi khi khởi động.</b> Dữ liệu trên tài khoản <b>không bị ảnh hưởng</b>. Hãy chụp màn hình khung này gửi lại để sửa.<br><small>'+String(e.message||e.error||'').replace(/</g,'&lt;')+(e.lineno?' (dòng '+e.lineno+')':'')+'</small>'); });
  window.addEventListener('unhandledrejection', function(e){ if(window.__booted) return; var r=e.reason; box('<b>⚠ Phần mềm gặp lỗi khi tải dữ liệu.</b> Dữ liệu trên tài khoản <b>không bị ảnh hưởng</b>. Hãy chụp màn hình khung này gửi lại để sửa.<br><small>'+String(r&&(r.message||r)||'').replace(/</g,'&lt;')+'</small>'); });
  setTimeout(function(){ if(!window.__booted) box('<b>⏳ Phần mềm chưa tải xong sau 60 giây.</b> Dữ liệu trên tài khoản vẫn còn. Hãy kiểm tra mạng / đăng nhập Claude rồi tải lại trang (F5).<br><small>Bước đang chờ: '+(window.__bootStep||'khởi động')+'</small>'); }, 60000);
})();
</script>
<script>
/* =========================================================
   PHẦN MỀM GIÁ THÀNH – nhiều năm, chuyển số dư đầu kỳ
   ========================================================= */
'use strict';

/* =====================================================================
   SƠ ĐỒ MÃ NGUỒN (để tùy biến cho công ty khác)
   PHẦN DÙNG CHUNG (giữ nguyên):
     Tiện ích · Lưu trữ (store/toDocs/fromDocs) · Giao diện (NAV, head, render)
     Lưới nhập liệu (GRID/vGrid) · Nhập Excel (importDialog/importAOA/TEMPLATE)
     Bảng kiểu Excel (enhanceTables) · Khóa kỳ · Thiết lập · Hướng dẫn
   PHẦN RIÊNG THEO CÔNG TY (sửa ở đây):
     [A] Định nghĩa dữ liệu: F (thứ tự cột), GRID (cột, công thức phụ), TEMPLATE/SAMPLES (mẫu Excel), NAV (menu)
     [B] Tính toán: calc() – giá vốn, trải định mức, 621/622/627/154, NXT, chuyển kỳ
     [C] Đề xuất: buildProposal / buildAdjProposal / applyProposalCore / proposalParams
     [D] Chuỗi tự chạy: runCalcFor / showCalcResult
     [E] Báo cáo: vTongQuan, vNXT, vGiaThanh, vNam, vCanhBao
     [F] Xuất kế toán: XK_HDR/NK_HDR, buildXK/buildNK, ktSettings
     [G] Dữ liệu mẫu: <script id="seed"> (để {} nếu không có)
   ===================================================================== */
// ---------- Tiện ích ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Số âm hiển thị (1.234) màu đỏ: NEGM là ký tự ẩn đánh dấu để tô đỏ (paintNeg) */
const NEGM='\u2060'; const negWrap = t => /^-0([.,]0+)?%?$/.test(t) ? t.slice(1) : (t[0]==='-' ? NEGM+'('+t.slice(1)+')' : t);
// Tô đỏ số âm: tìm các đoạn có dấu NEGM trong trang, bọc <span class="negv">; ô nhập (input) có số âm thì chữ đỏ
function paintNeg(root){ if (!root) return; const RX=/\u2060(\([^)]*\))/g;
  if (root.nodeType===3) { root=root.parentNode; if (!root) return; }
  if (root.nodeType!==1 && root.nodeType!==11) return;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.nodeValue.indexOf('\u2060')<0 ? NodeFilter.FILTER_SKIP : NodeFilter.FILTER_ACCEPT}); const L=[]; while (tw.nextNode()) L.push(tw.currentNode);
  if (root.nodeType===1 && root.childNodes.length===1 && root.firstChild.nodeType===3 && root.firstChild.nodeValue.indexOf('\u2060')>=0 && !L.includes(root.firstChild)) L.push(root.firstChild);
  L.forEach(t=>{ const par=t.parentNode; if (!par) return; const tag=par.nodeName; if (tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='OPTION'||par.namespaceURI!=='http://www.w3.org/1999/xhtml') { t.nodeValue=t.nodeValue.replace(/\u2060/g,''); return; }
    const v=t.nodeValue; const f=document.createDocumentFragment(); let last=0, m; RX.lastIndex=0;
    while ((m=RX.exec(v))) { if (m.index>last) f.appendChild(document.createTextNode(v.slice(last,m.index))); const sp=document.createElement('span'); sp.className='negv'; sp.textContent=m[1]; f.appendChild(sp); last=m.index+m[0].length; }
    if (last<v.length) f.appendChild(document.createTextNode(v.slice(last).replace(/\u2060/g,''))); par.replaceChild(f, t); });
  (root.querySelectorAll ? root.querySelectorAll('input') : []).forEach(i=>{ if (i.value && i.value.indexOf('\u2060')>=0) { i.value=i.value.replace(/\u2060/g,''); i.classList.add('negv'); } });
}
function startNegPaint(){ if (startNegPaint.on) return; startNegPaint.on=1; paintNeg(document.body);
  let q=[], sch=false; const run=()=>{ sch=false; const L=q; q=[]; L.forEach(n=>{ if (n.isConnected) paintNeg(n); }); };
  new MutationObserver(recs=>{ recs.forEach(r=>{ if (r.type==='characterData') { if (r.target.nodeValue && r.target.nodeValue.indexOf('\u2060')>=0) q.push(r.target); } else r.addedNodes.forEach(n=>{ if (n.nodeType===1 || (n.nodeType===3 && n.nodeValue.indexOf('\u2060')>=0)) q.push(n); }); }); if (q.length && !sch) { sch=true; Promise.resolve().then(run); } })
    .observe(document.body, {childList:true, subtree:true, characterData:true}); }
const fmtN = (v, d=0) => { if (v==null || v==='' || isNaN(v)) return ''; return negWrap(Number(v).toLocaleString('vi-VN', {minimumFractionDigits:d, maximumFractionDigits:d})); };
const fmtQ = v => (v==null || isNaN(v)) ? '' : negWrap(Number(v).toLocaleString('vi-VN', {maximumFractionDigits:3}));
const fmtPct = v => (v===''||v==null||!num(v)) ? '' : negWrap((num(v)*100).toLocaleString('vi-VN',{maximumFractionDigits:4})+'%');
const pctIn = v => { let t=String(v==null?'':v).trim(); if(!t) return 0; t=t.replace('%','').trim(); if(t.includes(',') && !/\.\d{3}/.test(t)) t=t.replace(',','.'); return num(t)/100; };
const fmtP = v => (v==null || isNaN(v)) ? '' : negWrap((v*100).toLocaleString('vi-VN', {maximumFractionDigits:1}) + '%');
const fmtD = s => { if(!s) return ''; const [y,m,d]=String(s).split('-'); return d && m && y ? `${d}/${m}/${y}` : s; };
const fmtKy = ky => { if(!ky) return ''; if(ky.startsWith('R:')) { const [,a,b]=ky.split(':'); return `${fmtD(a)} – ${fmtD(b)}`; } if(ky.length===4) return `cả năm ${ky}`; const [y,m]=ky.split('-'); return `${m}/${y}`; };
const kyOf = s => (s||'').slice(0,7);
const num = v => { if (v==null || v==='') return 0; if (typeof v==='number') return v; let t=String(v).replace(/\u2060/g,'').trim().replace(/\s/g,''); { const pm=t.match(/^\((.+)\)$/); if (pm) { const x=num(pm[1]); return x ? -Math.abs(x) : 0; } } let x; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) x=parseFloat(t.replace(/\./g,'').replace(',','.')); else if(/^-?\d+,(\d{1,2}|\d{4,})$/.test(t)) x=parseFloat(t.replace(',','.')); else x=parseFloat(t.replace(/,/g,'')); return isNaN(x)?0:x; };
const daysInMonth = ky => { const [y,m]=ky.split('-').map(Number); return new Date(y,m,0).getDate(); };
const nextKy = ky => { let [y,m]=ky.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
const todayKy = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const todayD = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* Tháng chưa trọn (tháng hiện tại): lệnh sản xuất chỉ đề xuất đến ngày hôm nay */
const cutDay = k => k===todayKy() ? todayD() : null;
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const round = (v,d) => { if (!isFinite(v) || !v) return v||0; const sg=v<0?-1:1; const x=Number(Math.abs(v).toPrecision(15)); const t=String(x); if (t.includes('e')) { const f=Math.pow(10,d); return sg*Math.round(x*f)/f; } const r=Math.round(Number(t+'e'+d)); const rs=String(r); return sg*(rs.includes('e') ? r/Math.pow(10,d) : Number(rs+'e-'+d)); }; // làm tròn như hàm ROUND của Excel (15 chữ số); an toàn với số rất nhỏ dạng 1e-12
const sum = (a, f) => a.reduce((s,x)=>s+(f?f(x):x),0);
// Nhập nhanh ngày: "15" = ngày 15 của tháng đang xem; "15/10" = 15/10 của năm đang xem
function quickDate(v){ const t=String(v||'').trim(); if(!t) return t; const k=(typeof selKy==='string' && /^\d{4}-\d{2}$/.test(selKy)) ? selKy : (typeof selKy==='string' && /^\d{4}/.test(selKy) ? selKy.slice(0,4)+'-'+String(new Date().getMonth()+1).padStart(2,'0') : null); if(!k) return t; let m=t.match(/^(\d{1,2})$/); if(m) return `${m[1].padStart(2,'0')}/${k.slice(5,7)}/${k.slice(0,4)}`; m=t.match(/^(\d{1,2})[\/.-](\d{1,2})$/); if(m) return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${k.slice(0,4)}`; return t; }
function toISODate(v){
  if (v==null || v==='') return '';
  if (v instanceof Date) { if (isNaN(v)) return ''; return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; }
  if (typeof v==='number') { if (v<20000 || v>80000) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s=String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2})$/); if (m) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function toKy(v){
  if (v==null || v==='') return '';
  if (v instanceof Date || typeof v==='number') return kyOf(toISODate(v));
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/](\d{4})$/); if(m) return `${m[2]}-${m[1].padStart(2,'0')}`;
  const d=toISODate(s); return d?kyOf(d):'';
}
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

// ---------- Ghi tệp Excel (tự ghi OOXML): phông Aptos Narrow cỡ 11, ngày dd/mm/yyyy, tháng mm/yyyy ----------
// Dùng như SheetJS: XW.book_new / aoa_to_sheet / json_to_sheet / sheet_add_aoa / book_append_sheet / write. Đọc tệp vẫn dùng SheetJS.
const XW = (()=>{
  const FONT='Aptos Narrow', SZ=11;
  const book_new = () => ({SheetNames:[], Sheets:{}, _xw:true});
  const aoa_to_sheet = aoa => ({_aoa:(aoa||[]).map(r=>(r||[]).slice()), _bold:new Set([0])});
  const json_to_sheet = json => { const keys=[]; (json||[]).forEach(o=>Object.keys(o).forEach(k=>{ if(!keys.includes(k)) keys.push(k); })); const ws=aoa_to_sheet([keys, ...(json||[]).map(o=>keys.map(k=>o[k]??''))]); ws['!cols']=keys.map(k=>({wch:Math.max(10,Math.min(40,String(k).length+2))})); return ws; };
  const sheet_add_aoa = (ws, aoa, opt) => { const o=(opt&&opt.origin)||{r:ws._aoa.length,c:0}; (aoa||[]).forEach((row,i)=>{ const r=o.r+i; while (ws._aoa.length<=r) ws._aoa.push([]); row.forEach((v,j)=>{ ws._aoa[r][o.c+j]=v; }); }); return ws; };
  const book_append_sheet = (wb, ws, name) => { let n=String(name||'Sheet').replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Sheet'; let k=n, i=2; while (wb.SheetNames.includes(k)) k=(n.slice(0,28)+'_'+(i++)); wb.SheetNames.push(k); wb.Sheets[k]=ws; return wb; };
  const xesc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const colName = c => { let s=''; c++; while (c>0) { const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; };
  const serial = (y,m,d) => Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30))/86400000);
  // kiểu ô: 0 thường, 1 ngày dd/mm/yyyy, 2 tháng mm/yyyy, 3 tiêu đề đậm, 4 ngày đậm (không dùng)
  const cell = (v, ref, bold) => {
    if (v==null || v==='') return '';
    if (v instanceof Date && !isNaN(v)) return `<c r="${ref}" s="1"><v>${serial(v.getFullYear(), v.getMonth()+1, v.getDate())}</v></c>`;
    if (typeof v==='number') return isFinite(v) ? `<c r="${ref}"${bold?' s="3"':v<0?(Number.isInteger(v)?' s="4"':' s="5"'):''}><v>${v}</v></c>` : '';
    if (typeof v==='boolean') return `<c r="${ref}" t="b"><v>${v?1:0}</v></c>`;
    const s=String(v); let m;
    if ((m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return `<c r="${ref}" s="1"><v>${serial(+m[1],+m[2],+m[3])}</v></c>`;
    if ((m=s.match(/^(\d{4})-(\d{2})$/)) && +m[2]>=1 && +m[2]<=12) return `<c r="${ref}" s="2"><v>${serial(+m[1],+m[2],1)}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${bold?' s="3"':''}><is><t xml:space="preserve">${xesc(s)}</t></is></c>`;
  };
  const sheetXml = ws => {
    const cols = (ws['!cols']||[]).map((c,i)=>c&&c.wch?`<col min="${i+1}" max="${i+1}" width="${Math.max(4,c.wch)+1}" customWidth="1"/>`:'').join('');
    const rows = ws._aoa.map((r,i)=>{ const b=ws._bold.has(i); const cs=(r||[]).map((v,j)=>cell(v, colName(j)+(i+1), b)).join(''); return cs?`<row r="${i+1}">${cs}</row>`:''; }).join('');
    const fz=ws['!freeze']; const sv = fz ? `<sheetViews><sheetView workbookViewId="0"><pane${fz.x?` xSplit="${fz.x}"`:''}${fz.y?` ySplit="${fz.y}"`:''} topLeftCell="${colName(fz.x||0)}${(fz.y||0)+1}" activePane="${fz.x&&fz.y?'bottomRight':fz.x?'topRight':'bottomLeft'}" state="frozen"/></sheetView></sheetViews>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${sv}<sheetFormatPr defaultRowHeight="15"/>${cols?`<cols>${cols}</cols>`:''}<sheetData>${rows}</sheetData></worksheet>`;
  };
  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="4"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="mm/yyyy"/><numFmt numFmtId="166" formatCode="#,##0;[Red](#,##0)"/><numFmt numFmtId="167" formatCode="#,##0.00##;[Red](#,##0.00##)"/></numFmts><fonts count="2"><font><sz val="${SZ}"/><name val="${FONT}"/><family val="2"/></font><font><b/><sz val="${SZ}"/><name val="${FONT}"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="167" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  // ZIP (lưu không nén) + CRC32
  const CRC = (()=>{ const t=new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = u => { let c=0xFFFFFFFF; for (let i=0;i<u.length;i++) c = CRC[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };

function idbBackend(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('giathanh_duongvan', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('docs');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const idb = req.result;
      const tx = (mode, fn) => new Promise((r, j)=>{ const t=idb.transaction('docs', mode); const s=t.store||t.objectStore('docs'); const q=fn(s); t.oncomplete=()=>r(q && q.result); t.onerror=()=>j(t.error); });
      res({
        async loadAll(){ const o={}; await new Promise((r,j)=>{ const t=idb.transaction('docs'); const c=t.objectStore('docs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=r; t.onerror=()=>j(t.error); }); return o; },
        put(k,v){ return tx('readwrite', s=>s.put(v,k)); },
        del(k){ return tx('readwrite', s=>s.delete(k)); },
      });
    };
  });
}

function tongHop154(y){ const c=calc(); const ks=Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`); const g=k=>c.periods[k];

function opChecks(o){ const {c, p, items, y} = o; const out=[]; const add=(t, list, lvl, fix, go, goT)=>out.push({t, n:list.length, lvl, list, fix, go, goT});

  const okD = d => /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d+'T00:00:00Z').getTime()) && new Date(d+'T00:00:00Z').toISOString().slice(0,10)===d;

function exportDomTable(tbl, name, sheet){
  const ths=[...tbl.querySelectorAll('thead tr:last-child th')];
  const head=ths.map(th=>{ const c=th.cloneNode(true); c.querySelectorAll('button,input,select,.xf-b,.xfb').forEach(e=>e.remove()); return c.textContent.replace(/[▼▲ⓘ*]/g,'').replace(/\s+/g,' ').trim(); });
  const txtCol=head.map(h=>/^(Mã|Số HĐ|Số hóa đơn|Số chứng từ|Kho|Hóa đơn)/i.test(h));
  const keep=ths.map((th,i)=>!th.classList.contains('chk') && head[i]!=='');
  const val=(td,ci)=>{ if (!td) return ''; const f=td.querySelector('input:not([type=checkbox]),select'); let t=f ? (f.tagName==='SELECT' ? (f.options[f.selectedIndex]||{}).text||'' : f.value) : td.textContent; t=String(t||'').replace(/\u2060/g,'').replace(/\s+/g,' ').trim(); if (t==='') return '';
    let m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    if (!txtCol[ci] && (td.classList.contains('n') ? /^\(?-?[\d.]+(,\d+)?\)?%?$/.test(t) : /^\(?-?\d{1,3}(\.\d{3})*(,\d+)?\)?%?$/.test(t))) { if (t.endsWith('%') || t.endsWith('%)')) return num(t.replace('%',''))/100; return num(t); } return t; };
  const rows=[...tbl.querySelectorAll('tbody tr')].filter(tr=>!tr.classList.contains('tot') && tr.style.display!=='none' && tr.children.length>=ths.length-1);
  const aoa=[head.filter((h,i)=>keep[i]), ...rows.map(tr=>ths.map((th,i)=>keep[i]?val(tr.children[i],i):null).filter((v,i)=>keep[i]))];
  const wb=XW.book_new(); const ws=XW.aoa_to_sheet(aoa); ws['!cols']=aoa[0].map(h=>({wch:Math.max(10,Math.min(40,String(h).length+2))})); XW.book_append_sheet(wb, ws, sheet); saveWb(wb, name);
  toast(`Đã xuất ${rows.length} dòng · ${aoa[0].length} cột`); }
function exportSheet(name, sheet, json){ const wb=XW.book_new(); XW.book_append_sheet(wb, XW.json_to_sheet(json), sheet); saveWb(wb, name); }

function vAlloc(m){
  const A=allocCfg(); const ts0=(A.cds[0]||{}).ts||'QD'; const multi = A.cds.length>1 && A.cds.some(c=>(c.ts||'QD')!==ts0); const ed = m.dataset.alEd==='1';
  m.innerHTML = head(`Phân bổ 622 / 627`) + `
  <div class="box"><h3>Phân bổ chi phí 622 / 627</h3>
  <div class="fld frm-g" style="max-width:520px;display:block;margin:0"><label style="display:block;margin-bottom:4px">Tiêu thức phân bổ 622 (nhân công) và 627 (sản xuất chung) của tháng cho các lệnh sản xuất trong tháng</label><select class="ci" id="alTs" ${ed?'':'disabled'}>${Object.entries(TIEU_THUC).map(([k,t])=>`<option value="${k}" ${k===ts0?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
  ${multi?`<div class="warnbox" style="margin-top:8px">Quy tắc cũ đang chia theo nhiều tiêu thức khác nhau – bấm Sửa rồi Lưu để chuyển sang 1 tiêu thức.</div>`:''}
  <div class="bar" style="margin-top:10px">${ed?`<button class="btn" id="alC">Hủy</button><button class="btn p" id="alSave">${IC.save}Lưu</button>`:`<button class="btn p" id="alE">${IC.edit}Sửa</button>`}</div></div>`;
  bindKy();
  if ($('#alE')) $('#alE').onclick=()=>{ m.dataset.alEd='1'; render(); const x=$('#alTs'); if (x) x.focus(); };
  if ($('#alC')) $('#alC').onclick=()=>{ m.dataset.alEd=''; render(); };
  if ($('#alSave')) $('#alSave').onclick=()=>{ const ts=$('#alTs').value; state.settings.alloc={cds:[{ten:'Sản xuất', t622:1, t627:1, ts}]}; m.dataset.alEd=''; changed(); render(); toast('Đã lưu tiêu thức phân bổ – giá thành tính lại ngay'); };
}
function vDanhMuc(m){ const t=m.dataset.dmt==='nhom'?'nhom':'hh'; m.dataset.dmt=t; if (t==='nhom') vNhomHang(m); else vGrid('items');
  const tb=document.createElement('div'); tb.className='tabs tabs-io'; tb.innerHTML=`<button data-dmt="hh" class="io-in ${t==='hh'?'act':''}">▦ Danh mục hàng hóa</button><button data-dmt="nhom" class="io-out ${t==='nhom'?'act':''}">▤ Nhóm hàng</button>`;
  const anchor=m.querySelector('.toolbar'); if (anchor) anchor.after(tb); else m.prepend(tb);
  tb.querySelectorAll('[data-dmt]').forEach(b=>b.onclick=()=>guardEdit(()=>{ m.dataset.dmt=b.dataset.dmt; render(); })); }
// Cân đối NVL: tab chi tiết theo lệnh + tab tổng hợp theo mặt hàng
function vCanDoi(m){ const t=m.dataset.adt==='th'?'th':'ct'; m.dataset.adt=t; if (t==='th') vAdjSum(m); else vGrid('adjustments');
  const tb=document.createElement('div'); tb.className='tabs tabs-io'; tb.innerHTML=`<button data-adt="ct" class="io-in ${t==='ct'?'act':''}">▦ Cân đối theo lệnh</button><button data-adt="th" class="io-out ${t==='th'?'act':''}">∑ Tổng hợp cân đối theo mặt hàng</button>`;
  const anchor=m.querySelector('.toolbar'); if (anchor) anchor.after(tb); else m.prepend(tb);
  tb.querySelectorAll('[data-adt]').forEach(b=>b.onclick=()=>guardEdit(()=>{ m.dataset.adt=b.dataset.adt; render(); })); }
function vAdjSum(m){ const it=itemMap(); const c=calc(); const g={};
  state.adjustments.filter(r=>r.maVT && selHas(r.ngaySX)).forEach(r=>{ const q=num(r.dieuChinh); const P=c.periods[kyOf(r.ngaySX)]; const pr=P?(P.pBQ[r.maVT]||0):0;
    const x=g[r.maVT]||(g[r.maVT]={ma:r.maVT, n:0, giam:0, tang:0, sl:0, tt:0}); x.n++; if (q<0) x.giam+=-q; else x.tang+=q; x.sl+=q; x.tt+=Math.round(pr*q)||0; });
  const all=Object.values(g).map(x=>({...x, ten:(it[x.ma]||{}).ten||'', nhom:(it[x.ma]||{}).nhom||'', dvt:(it[x.ma]||{}).dvt||''})).sort((a,b)=>a.ma.localeCompare(b.ma));
  const L=all.filter(x=>!search || matchQ(search, [x.ma,x.ten,x.nhom].join(' ')));
  const cols=[{t:'Mã VT',f:x=>x.ma},{t:'Tên vật tư',f:x=>x.ten},{t:'Nhóm',f:x=>x.nhom},{t:'ĐVT',f:x=>x.dvt},{t:'Số dòng CĐ',n:1,sum:1,f:x=>x.n},{t:'SL giảm',n:1,d:2,sum:1,f:x=>x.giam},{t:'SL tăng',n:1,d:2,sum:1,f:x=>x.tang},{t:'SL cân đối',n:1,d:2,sum:1,f:x=>x.sl},{t:'Giá trị CĐ',n:1,sum:1,f:x=>x.tt}];
  m.innerHTML = head(GRID.adjustments.t, `<button class="btn" id="adsXl">${IC.exp}Xuất Excel</button>`) +
    `<div class="bar"><input type="text" id="q" placeholder="Tìm mã / tên / nhóm" value="${esc(search)}"></div>` +
    (L.length ? table(cols, L, {total:1, click:1, h:'none'}) : '<div class="mut" style="padding:12px">Không có dòng cân đối trong kỳ đang xem.</div>');
  bindKy(); bindSearch();
  m.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>{ const x=L[+tr.dataset.i]; if (!x) return; m.dataset.adt='ct'; search=x.ma; render(); });
  $('#adsXl').onclick=()=>{ const t=m.querySelector('.tw table'); if (t) exportDomTable(t, 'TongHopCanDoiNVL.xlsx', 'TongHopCanDoi'); };
}
// Nhóm hàng: nhóm gốc (cố định – gắn với cách tính) + nhóm tự thêm (chọn "Tính như" 1 nhóm gốc); kho mặc định từng nhóm
function vNhomHang(m){ const cnt={}; state.items.forEach(i=>{ cnt[i.nhom]=(cnt[i.nhom]||0)+1; });
  const base=NHOM.filter(n=>n!=='Khác' || cnt['Khác']).map(n=>({n, goc:1, loai:n, kho:khoNhom(n), sl:cnt[n]||0}));
  const ct=nhomCT().map(g=>({n:g.ten, goc:0, loai:g.loai, kho:khoNhom(g.ten), sl:cnt[g.ten]||0}));
  const all=[...base, ...ct]; const L=all.filter(x=>!search || matchQ(search, [x.n,x.loai,x.kho].join(' ')));
  const sel=vNhomHang.sel||(vNhomHang.sel=new Set()); [...sel].forEach(n=>{ if (!all.some(x=>x.n===n)) sel.delete(n); });
  m.innerHTML = head('Danh mục hàng', `<button class="btn d" id="nhDelSel" style="display:${sel.size?'':'none'}">${IC.del}Xóa <span id="nhSelN">${sel.size}</span> nhóm</button><button class="btn ib" id="refresh" title="Làm mới dữ liệu" aria-label="Làm mới dữ liệu">${IC.ref}</button><button class="btn" id="nhXl">${IC.exp}Xuất Excel</button><button class="btn p" id="nhAdd">${IC.add}Thêm</button>`) +
  `<div class="bar"><input type="text" id="q" placeholder="Tìm…" value="${esc(search)}"></div>
  <div class="tw" style="max-height:none"><table data-freeze="2"><thead><tr><th class="chk nofx"><input type="checkbox" id="nhAll"></th><th>Nhóm hàng</th><th class="n">Số mã hàng</th><th class="nofx"></th></tr></thead><tbody>${L.map(x=>`<tr><td class="chk"><input type="checkbox" data-nsel="${esc(x.n)}" ${sel.has(x.n)?'checked':''}></td><td>${esc(x.n)}</td><td class="n ${x.sl?'lnkc':''}" ${x.sl?`data-nh="${esc(x.n)}" style="cursor:pointer" title="Xem các mã thuộc nhóm"`:''}>${x.sl||''}</td><td class="act"><button class="btn s ib" data-nedit="${esc(x.n)}" title="Sửa">${IC.edit}</button> <button class="btn s ib d" data-ndel="${esc(x.n)}" title="Xóa">${IC.del}</button></td></tr>`).join('')}</tbody></table></div>`;
  bindKy(); bindSearch();
  const upd=()=>{ $('#nhSelN').textContent=sel.size; $('#nhDelSel').style.display=sel.size?'':'none'; };
  m.querySelectorAll('[data-nsel]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.nsel):sel.delete(c.dataset.nsel); upd(); });
  $('#nhAll').onchange=e=>{ m.querySelectorAll('[data-nsel]').forEach(c=>{ c.checked=e.target.checked; c.checked?sel.add(c.dataset.nsel):sel.delete(c.dataset.nsel); }); upd(); };
  m.querySelectorAll('[data-nh]').forEach(td=>td.onclick=()=>{ m.dataset.dmt='hh'; search=td.dataset.nh; render(); });
  const del=names=>{ const goc=names.filter(n=>NHOM.includes(n)); names=names.filter(n=>!NHOM.includes(n)); const used=names.filter(n=>cnt[n]); const ok=names.filter(n=>!cnt[n]); if (!ok.length) return toast(goc.length && !used.length ? `Nhóm có sẵn của phần mềm không xóa được (${goc.join(', ')}) – gắn với cách tính giá thành` : `Nhóm đang có mã hàng – chuyển các mã sang nhóm khác trước khi xóa (${[...used, ...goc].join(', ')})`, 5000);
    confirmBox(`Xóa ${ok.length} nhóm: <b>${ok.map(esc).join(', ')}</b>?${used.length?`<div class="warnbox" style="margin-top:8px">Không xóa ${used.map(esc).join(', ')} vì đang có mã hàng.</div>`:''}${goc.length?`<div class="warnbox" style="margin-top:8px">Không xóa ${goc.map(esc).join(', ')} – nhóm có sẵn của phần mềm.</div>`:''}`, ()=>{ state.settings.nhomCT=nhomCT().filter(g=>!ok.includes(g.ten)); sel.clear(); changed(); render(); toast(`Đã xóa ${ok.length} nhóm`); }); };
  m.querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>del([b.dataset.ndel]));
  $('#nhDelSel').onclick=()=>del([...sel]);
  $('#nhXl').onclick=()=>exportSheet('NhomHang.xlsx', 'NhomHang', all.map(x=>({'Nhóm hàng':x.n,'Tính như (nhóm gốc)':x.goc?x.n:x.loai,'Kho mặc định':x.kho,'Số mã hàng':x.sl})));
  const form=(x)=>{ const isNew=!x; const goc=x&&x.goc; const opts=NHOM.map(n=>`<option ${x&&x.loai===n?'selected':''}>${esc(n)}</option>`).join('');
    modal(`<div class="tcm-h"><h3>${isNew?'Thêm':'Sửa'} — Nhóm hàng</h3><button class="tcm-x" id="nfX" title="Đóng">${IC.x}</button></div>
    <div class="frm-g"><div class="ed"><label>Tên nhóm hàng<span class="rq">*</span></label><input class="ci" id="nfTen" value="${esc(x?x.n:'')}" ${goc?'disabled':''}></div>
    <div class="ed"><label>Tính như (nhóm gốc)<span class="rq">*</span></label><select class="ci" id="nfLoai" ${goc?'disabled':''}>${goc?`<option>${esc(x.n)}</option>`:`<option value="">– chọn –</option>${opts}`}</select></div>
    <div class="ed"><label>Kho mặc định</label><input class="ci" id="nfKho" list="nfKhoL" value="${esc(x?x.kho:'')}" placeholder="Chọn kho…"><datalist id="nfKhoL">${khoList().map(v=>`<option value="${esc(v)}">${esc(KHO_T[v]||'')}</option>`).join('')}</datalist></div></div>
    <div class="frm-f"><button class="btn" id="nfC">Hủy</button><button class="btn p" id="nfS">${IC.save}Lưu</button></div>`);
    $('#modal .in').classList.add('frm-in'); const nf0=()=>[...document.querySelectorAll('#modal .ci')].map(x=>x.value).join('|'); const v0=nf0(); const close=()=>{ if (nf0()===v0) return closeModal(); const box=$('#modal .in'); const keep=[...box.childNodes]; modal(`<h3>⚠ Nhóm hàng đang sửa chưa được lưu</h3><div>Đóng mà không lưu?</div><div style="text-align:right;margin-top:12px"><button class="btn" id="gStay">Ở lại</button> <button class="btn d" id="gDrop">Bỏ thay đổi</button></div>`); $('#gDrop').onclick=()=>closeModal(); $('#gStay').onclick=()=>{ const inn=$('#modal .in'); inn.innerHTML=''; keep.forEach(n=>inn.appendChild(n)); inn.classList.add('frm-in'); }; }; $('#nfX').onclick=$('#nfC').onclick=close;
    if (!goc) $('#nfLoai').onchange=()=>{ if (!$('#nfKho').value) $('#nfKho').value=KHO_NHOM[$('#nfLoai').value]||''; };
    setTimeout(()=>{ const f=goc?$('#nfKho'):$('#nfTen'); if (f) f.focus(); },0);
    $('#nfS').onclick=()=>{ const kho=$('#nfKho').value.trim();
      if (goc) { const o=Object.assign({}, state.settings.khoNhom||{}); if (kho && kho!==(KHO_NHOM[x.n]||'')) o[x.n]=kho; else delete o[x.n]; state.settings.khoNhom=o; closeModal(); changed(); render(); return toast('Đã lưu kho mặc định của nhóm – áp dụng cho mã mới / mã chưa có kho'); }
      const ten=$('#nfTen').value.trim(), loai=$('#nfLoai').value; if (!ten) return toast('Nhập tên nhóm hàng'); if (!loai) return toast('Chọn "Tính như" – nhóm gốc để phần mềm biết cách tính');
      if (nhomAll().some(n=>n.toLowerCase()===ten.toLowerCase() && (isNew || n!==x.n))) return toast(`Nhóm ${ten} đã có`);
      const L2=nhomCT().slice(); if (isNew) L2.push({ten, loai, kho}); else { const k=L2.findIndex(g=>g.ten===x.n); L2[k]={ten, loai, kho}; if (ten!==x.n) state.items.forEach(i=>{ if (i.nhom===x.n) i.nhom=ten; }); }
      state.settings.nhomCT=L2; closeModal(); changed(); render(); toast(isNew?`Đã thêm nhóm ${ten}`:'Đã lưu nhóm hàng'); }; };
  $('#nhAdd').onclick=()=>form(null);
  m.querySelectorAll('[data-nedit]').forEach(b=>b.onclick=()=>form(all.find(x=>x.n===b.dataset.nedit)));
}

  `<div class="box"><h3>Trình tự làm việc hằng tháng (làm theo thứ tự)</h3><ol class="small" style="margin:4px 0 0 18px;line-height:1.8">

  <div class="box" id="hdManHinh"><h3>Giải thích từng màn hình</h3><div class="small" style="line-height:1.7">

  <details><summary><b>Tổng quan</b></summary><ul style="margin:4px 0 8px 18px"><li>Luôn mở ở chế độ <b>cả năm</b>; chọn tháng ở ô Xem. Chi tiết xem ở Giá thành (giá thành & lãi theo sản phẩm), Tổng hợp bán hàng theo mặt hàng, Đề xuất sản xuất (năng lực công nhân), Cảnh báo & kiểm tra (rủi ro tồn kho).</li></ul></details>

   <li><b>Gia công ngoài</b>: mỗi dòng mua mã thuộc nhóm <i>Dịch vụ gia công</i> (in, thêu…) → bấm ⚙ Tạo lô từ HĐ dịch vụ gia công (hoặc ▶ Tính giá thành) để lập 1 lô: ngày nhận = ngày nhập kho HĐ, ngày gửi lùi ${num(prm.gcLT)} ngày làm việc, SL nhận = SL HĐ × hệ số, SL gửi = SL nhận × (1 + hao hụt). Mã gửi / mã nhận / số ngày / hao hụt riêng từng mã dịch vụ đặt ở ⚙ Thiết lập theo mã dịch vụ (trống = mặc định chung ở Đề xuất sản xuất → Thông số). Giá trị: vải gửi xuất kho theo giá BQ tháng gửi; nhận về = vải gửi + phí gia công.</li>
   <li><b>Xuất dùng chung</b>: loại <b>627</b> cộng vào chi phí sản xuất chung của tháng và phân bổ vào giá thành; loại <b>641</b> (bán hàng) chỉ trừ kho, không vào giá thành.</li></ul></details>
  <details><summary><b>Đề xuất sản xuất</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Thông số</b>: rời ô là lưu – có tác dụng ở lần ▶ Tính giá thành / đề xuất tiếp theo.</li>
   <li><b>Thành phẩm-DDH</b> làm đúng số lượng của đơn đặt hàng (lô = 1); ngày nào may xong bao nhiêu nhập kho bấy nhiêu, điều kiện là đủ hàng trước ngày giao; đơn càng nhiều bộ thì cắt (xuất NVL) càng sớm – lùi đủ số ngày may theo năng lực ngày để may xong trước ngày giao. <b>Thành phẩm-SX</b>: bán lấy hàng trong kho; khi tồn không đủ cho dòng bán (cộng tồn an toàn) thì cắt thêm theo <b>lô cắt</b> (mỗi mã 1 lần cắt ${fmtN(num(prm.loMax))} SP, thiếu nhiều thì 200, 300…), cần có hàng trước ngày bán 1 ngày làm việc; ngày cắt (xuất NVL) lùi đủ số ngày may lô đó theo năng lực ngày (cắt hôm trước, may hôm sau). Ngày nào cũng có thành phẩm nhập kho: cuối ngày may xong bao nhiêu nhập kho bấy nhiêu. Phần năng lực còn dư may tồn kho (MT). Lô cắt riêng / tồn an toàn / tỷ trọng riêng: nút ⚙ Thông số riêng từng mã – chỉ nhập khi mã nào khác mặc định.</li>
   <li><b>Năng lực</b> = số CN × ngày làm việc × ${fmtN(num(prm.nangSuat))} bộ chuẩn × hiệu suất ${fmtP(num(prm.hieuSuat))} × <b>tỷ lệ thời gian may</b> ${fmtP(tyLeMay())} (công nhân còn cắt, đóng gói…; trống = theo tỷ lệ công đoạn May ở Phân bổ 622) (bộ chuẩn: bộ / đầm / váy = 1, quần bơi = 0,5 – hệ số ở Danh mục). <b>May tồn kho (MT)</b> = max(0; năng lực − SL bán quy đổi hàng DDH − SX bù tồn cần thiết) → chia cho hàng SX theo <b>tỷ trọng may tồn</b> (tỷ trọng riêng, hoặc SL bán năm × hệ số của mã ÷ tổng hàng SX), làm tròn theo lô cắt, rải các ngày làm việc. Chưa nhập số CN → chỉ đề xuất theo bán hàng. Ngày làm việc trừ Chủ nhật và Lịch nghỉ / tăng ca.</li>
   <li><b>Nhập kho thành phẩm theo ngày</b> (khi đã nhập số công nhân): mỗi lệnh = 1 lần cắt của 1 mã; nhiều lô may song song. Mỗi ngày làm việc, năng lực (bộ chuẩn) chia cho các lô đang may – lô gắn với bán hàng (DDH, SX, lệnh tay) có <i>Ngày nhập kho TP</i> sớm hơn làm trước, may tồn kho (MT) lấp phần còn dư; cuối ngày may xong bao nhiêu nhập kho bấy nhiêu. <i>Ngày nhập kho TP</i> trên lệnh là ngày cần hàng; ngày nhập kho thật xem cột <b>Nhập kho xong</b> ở Giá thành và trong chi tiết lệnh (⚠ = trễ so với ngày cần hàng). Giá trị mỗi lần nhập = giá thành lệnh × SL nhập ÷ SL lệnh; phần chưa nhập cuối tháng là dở dang 154. Tháng chưa nhập số công nhân: lệnh nhập kho 1 lần vào Ngày nhập kho TP.</li>
   <li><b>Chi tiết theo ngày</b> (như sheet Ke hoach SX): lệnh đang may, số bộ nhập kho mỗi ngày so với năng lực, ngày trễ hạn.</li>
   <li><b>Lệnh sản xuất</b>: gom 3 nguồn 1-DDH, 2-SX, 3-MT; lệnh tay (nguồn 4) nhập ở Lệnh sản xuất. Đề xuất lại một tháng thì đề xuất lại từ tháng đó trở về sau (xóa đề xuất cũ, cân đối NVL, lệnh nhập tay từ tháng đó).</li>
   <li><b>Cân đối NVL → ⚙ Cân đối theo đề xuất</b>: chạy tồn theo ngày, giảm tiêu hao tại đúng lệnh làm tồn âm; ô vàng sửa số trước khi áp dụng (0 = bỏ dòng); bấm Áp dụng để ghi vào Cân đối NVL.</li></ul></details>
  <details><summary><b>Cân đối NVL – các ý cần biết</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Cân đối là gì</b>: điều chỉnh số lượng NVL xuất theo định mức của một lệnh sản xuất, xác định bằng <i>Ngày nhập kho TP của lệnh + Mã thành phẩm + Mã VT</i>. Số <b>âm</b> = giảm tiêu hao, số <b>dương</b> = tăng tiêu hao. Cân đối làm thay đổi <b>621</b> và giá thành của lệnh đó, cột <b>Xuất</b> của Nhập – Xuất – Tồn và số lượng trên <b>phiếu XK NVL</b> của File tải dữ liệu kế toán.</li>
   <li><b>Có 2 kiểu cân đối</b>:
     <br>(1) <b>Cân đối tự động</b> khi ▶ Tính giá thành – chọn ở Kế hoạch sản xuất → Thông số đề xuất → <i>Cân đối NVL tự động</i>: <i>Chỉ vải</i> (mặc định – vải, vải in không âm; phụ liệu được âm), <i>Mọi NVL</i> hoặc <i>Tắt</i>. Mỗi dòng xuất chỉ lấy tối đa bằng tồn tại ngày xuất, phần thiếu ghi ở cột Cân đối của chi tiết giá thành và thống kê ở Cảnh báo & kiểm tra → <i>NVL thiếu phải cân đối tự động</i>; kiểu này không ghi dòng vào bảng Cân đối NVL.
     <br>(2) <b>Cân đối theo lệnh</b> – các dòng trong bảng <b>Cân đối NVL</b>: nhập tay (tiêu hao thực tế khác định mức) hoặc lấy từ đề xuất của phần mềm (nguồn <i>PM</i>).</li>
   <li><b>Tăng ca tự động</b>: khi xếp lịch may, nếu năng lực ngày thường không đủ để lệnh gắn với bán hàng (DDH, SX, lệnh tay) may xong trước <i>Ngày nhập kho TP</i>, phần mềm tự tăng ca – chia đều cho các ngày làm việc trước hạn – để không có hàng bán trước khi may xong. Số bộ chuẩn tăng ca từng tháng xem cột <b>Tăng ca tự động</b> ở bảng năng lực (Đề xuất sản xuất). Cột <b>Tăng ca nhập tay</b> dùng khi muốn tăng năng lực cố định cả tháng. May tồn kho (MT) không dùng tăng ca.</li>
   <li><b>Tháng chưa trọn</b> (tháng hiện tại): lệnh sản xuất chỉ đề xuất <b>đến ngày hôm nay</b> – năng lực, ngày làm việc và may tồn kho tính đến hôm nay, không lập lệnh có ngày xuất NVL sau hôm nay. Những ngày sau: bấm ▶ Tính giá thành tháng đó, tick <i>Đề xuất lại từ đầu</i> để lập thêm lệnh đến ngày mới.</li>
   <li><b>↩ Bỏ chuyển kho (số phiếu)</b> ở màn hình Cân đối NVL (luôn hiện, số 0 là chưa có phiếu nào chuyển): trả các phiếu mua đã chuyển ngày nhập kho trong kỳ đang xem về ngày nhập kho gốc, phần đã tách gộp lại vào phiếu gốc; sau đó bấm ▶ Tính giá thành. Tháng đã khóa không bỏ được.</li>
   <li><b>Bảng kết quả Tính giá thành</b> có 2 nút theo thứ tự: <b>① 📅 Chuyển ngày nhập kho</b> (làm trước) – hiện các phiếu mua tháng sau có thể lùi ngày nhập kho về tháng đang âm, tick dòng rồi bấm <i>Áp dụng … & tính lại</i>; xong nút chuyển xanh <i>✓ Không còn phiếu chuyển kho</i>. <b>② ⚙ Cân đối NVL</b> (làm sau) – hiện đề xuất giảm tiêu hao ở các lệnh làm tồn âm, tick rồi bấm <i>Áp dụng … & tính lại</i>. Đã chuyển kho thì cân đối tính theo số sau khi chuyển (ít dòng hơn); không cần chuyển kho thì bấm thẳng nút ②.</li>
   <li><b>Thứ tự xử lý NVL âm / thiếu cuối tháng</b>: làm <b>📅 Chuyển ngày nhập kho</b> trước, rồi mới <b>⚙ Cân đối theo đề xuất</b> cho phần còn âm. Nếu bấm Cân đối khi vẫn còn phiếu chuyển ngày được, phần mềm sẽ nhắc. Trường hợp không chuyển ngày được (hàng về thật sau ngày xuất…) bấm <b>Bỏ qua chuyển ngày – cân đối luôn</b> – có ở bảng kết quả ▶ Tính giá thành và ở bảng đề xuất cân đối. Ngoài ra nên kiểm tra thiếu chứng từ mua hoặc sai mã ở Mua hàng – vì cân đối là giảm tiêu hao thật của lệnh.</li>
   <li><b>📅 Chuyển ngày nhập kho</b> (màn hình Cân đối NVL): chỉ xét NVL có <b>tồn cuối tháng âm</b> (tính như xuất đủ định mức) và chỉ chuyển <b>vừa đủ phần âm</b>: lấy phiếu mua của các tháng sau (phiếu sớm trước), đưa ngày nhập kho về ngày xuất NVL bị thiếu sớm nhất trong tháng âm:
     <br>• Chỉ lấy phiếu có <b>ngày hóa đơn cách ngày nhập kho mới không quá 1 tháng</b> (số ngày lệch ghi ở cột Ghi chú màu cam); không lấy phiếu của tháng đã khóa.
     <br>• Phiếu lớn hơn phần thiếu thì <b>tách</b>: phần chuyển mang ngày nhập mới, phần còn lại giữ ngày cũ; giá trị (thành tiền, thuế GTGT) chia theo tỷ lệ số lượng, làm tròn đồng – tổng không đổi; phiếu vừa đủ thì chuyển cả phiếu.
     <br>• Cột <b>Mua hàng chưa HĐ</b> ở Mua hàng tự ghi: dòng tách ghi <i>x - Số HĐ</i>, các dòng còn lại của hóa đơn ghi <i>Số HĐ</i>; chuyển cả phiếu ghi <i>x</i>.
     <br>• Tick từng dòng rồi bấm <i>Áp dụng các dòng đã chọn</i>; làm lần lượt từng tháng (xong tháng này phần mềm mở tháng chờ kế tiếp), sau đó ▶ Tính giá thành.</li>
   <li><b>⚙ Cân đối theo đề xuất</b> (màn hình Cân đối NVL) mở bảng phân tích & đề xuất: bảng 1 liệt kê mã tồn cuối âm kèm <i>Nguyên nhân</i> và <i>Hướng xử lý</i> – thành phẩm, bán thành phẩm, NVL chỉ xuất dùng chung / bán không cân đối được bằng cách này. Bảng 2: phần mềm chạy tồn theo từng ngày trong kỳ, giảm tiêu hao ở đúng các lệnh làm tồn xuống âm cho đến khi tồn cuối về 0; mỗi dòng ghi nguồn <i>PM</i>, lý do <i>Đề xuất PM – xử lý tồn âm</i>.</li>
   <li><b>Áp dụng đề xuất</b>: ô vàng sửa được số trước khi áp dụng (0 = bỏ dòng), tick các dòng muốn lấy rồi bấm <b>✔ Chấp nhận các dòng đã chọn</b> – các dòng được ghi vào bảng Cân đối NVL và vẫn sửa / xóa được như dòng nhập tay.</li>
   <li><b>Làm lần lượt từng tháng</b>: đề xuất tính theo kỳ đang xem; cân đối tháng trước làm thay đổi tồn đầu tháng sau, nên xử lý tháng sớm nhất trước, rồi xem lại đề xuất tháng sau – số cần cân đối có thể ít hơn số đang hiện.</li>
   <li><b>Tháng đã khóa kỳ</b> không áp dụng đề xuất và không sửa được dòng cân đối.</li>
   <li><b>Đề xuất lại lệnh SX</b> một tháng (tick <i>Đề xuất lại từ đầu</i> khi ▶ Tính giá thành) sẽ <b>xóa các dòng cân đối NVL từ tháng đó trở về sau</b> cùng với lệnh đề xuất cũ – sau khi đề xuất lại cần xem lại đề xuất cân đối.</li>
   <li><b>Màu nút</b> <i>📅 Chuyển ngày nhập kho</i> và <i>⚙ Cân đối theo đề xuất</i> ở màn hình Cân đối NVL: <b style="color:#c2410c">cam</b> là còn tháng chờ làm (rê chuột lên nút để xem số tháng), <b style="color:#15803d">xanh ✓ Đã …</b> là đã xong (chỉ tính các tháng đã kết thúc, chưa khóa). Ngoài ra xem ô <i>Cân đối NVL</i> ở Luồng xử lý và mục <i>NVL thiếu phải cân đối tự động</i> ở Cảnh báo & kiểm tra.</li>
   <li><b>Tháng chưa kết thúc</b>: phần mềm không chuyển ngày nhập kho và không cân đối, vì NVL âm có thể chỉ do chưa nhập đủ phiếu mua. Cuối tháng nhập đủ chứng từ, ▶ Tính giá thành rồi mới xử lý.</li></ul></details>
  <details><summary><b>Giá thành, Nhập – Xuất – Tồn, Tổng hợp</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Tổng hợp 154</b> (như sheet Tong hop GT): chi phí phát sinh tính theo <b>tháng xuất NVL</b> (bắt đầu may); giá thành hoàn thành theo <b>tháng nhập kho</b>; lệnh xuất NVL tháng này nhưng nhập kho tháng sau = <b>dở dang 154</b>. Tab Chi tiết NVL: mỗi dòng = 1 NVL của 1 lệnh, cùng cột với sheet ChiTiet khi Xuất Excel.</li>
   <li><b>Nhập – Xuất – Tồn</b>: đơn giá bình quân = (giá trị tồn đầu kỳ + nhập trong kỳ) ÷ (SL tồn đầu kỳ + nhập trong kỳ); BQ/ngày = phát sinh ÷ số ngày (Thứ 2–Thứ 7) từ đầu tháng đến ngày phát sinh cuối. Bấm vào <b>mã (chữ xanh)</b> để xem thẻ kho: tồn đầu → từng chứng từ nhập / xuất (kèm tên khách hàng) → tồn cuối; xuất kho theo giá vốn BQ tháng xuất, nhập kho sản xuất = giá thành lệnh (154), nhập gia công = vải gửi + phí gia công.</li>
   <li><b>Tổng hợp bán hàng</b>: giá vốn = đơn giá bình quân tháng (theo NXT); chi tiết từng hóa đơn ở Mua hàng & Bán hàng → Bán hàng.</li>
   <li><b>Tổng hợp năm</b>: Số lệnh = lệnh xuất NVL trong tháng · SL sản xuất = thành phẩm nhập kho trong tháng · Giá trị SX 154 = giá thành thành phẩm nhập kho · CP phát sinh = 621 + 622 + 627 của các lệnh xuất NVL trong tháng · Dở dang = lệnh đã xuất NVL, nhập kho tháng sau · Biên LN = Tổng lãi gộp ÷ Doanh số · Tồn cuối kho = giá trị tồn cuối tháng.</li>
   <li><b>Chi phí 622 / 627</b>: <b>622/SLNK</b> = Tổng 622 của tháng ÷ SLNK; <b>627/SLNK</b> = Tổng 627 của tháng ÷ SLNK – <b>SLNK</b> = số lượng thành phẩm nhập kho trong tháng, quy đổi bộ chuẩn (quần bơi 0,5; bộ / đầm / váy 1); Tổng 627 gồm cả Xuất dùng chung loại 627. 641 = Xuất dùng chung loại Bán hàng, không vào giá thành. Chưa phân bổ = chi phí tháng không có lệnh sản xuất nhận.</li></ul></details>
  <details><summary><b>Nút trên các bảng nhập liệu</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Thêm</b> dòng mới · <b>Xuất Excel</b> các dòng đang hiện · <b>Nhập Excel</b> (dán / chọn file) · biểu tượng <b>hai mũi tên xoay vòng</b> = Làm mới dữ liệu: tải lại dữ liệu đã lưu (khi không còn thay đổi chờ lưu) và tính lại toàn bộ số liệu.</li>
   <li>Biểu tượng <b>thanh trượt</b> = Thiết lập bảng: bỏ tích để ẩn cột ít dùng (cột bị ẩn vẫn giữ nguyên số liệu; khi Thêm dòng mới, cột bắt buộc nhập đang ẩn tạm hiện ra để nhập đủ), dùng mũi tên lên / xuống để đổi thứ tự cột, <i>Trả về mặc định</i> để về như ban đầu, rồi bấm <b>Lưu</b>. Thiết lập được nhớ riêng cho từng bảng. Cố định cột: bấm nút ▼ ở tiêu đề cột.</li>
   <li><b>Luồng xử lý</b>: sơ đồ 5 bước làm việc (dữ liệu nền → phát sinh hằng ngày → kế hoạch & sản xuất → Tính giá thành → báo cáo) theo kỳ đang chọn. Ô xanh lá là dữ liệu người dùng nhập, ô tím là phần mềm tự tính / lập. Ô <b style="color:#b91c1c">chữ đỏ</b> là chưa đạt, ô <b style="color:#c2410c">chữ cam</b> là cần xem; số nhỏ ở góc là số lỗi. Bấm ô đỏ / cam để xem chi tiết từng lỗi và cách xử lý, rồi bấm <i>Mở màn hình</i> để sửa; bấm ô đạt thì mở thẳng màn hình đó.</li>
   <li><b>Kiểm tra mã</b> (Danh mục hàng): chọn một file Excel bất kỳ có cột <i>Mã hàng</i> (bảng kê mua, bán, tồn kho…) – phần mềm báo file có bao nhiêu mã, bao nhiêu mã đã có, bao nhiêu mã <b>chưa có</b> trong danh mục, và các mã chỉ khác chữ hoa/thường (nên sửa lại mã trong file). Nếu file có cột Tên hàng, ĐVT, Nhóm hàng, Kho thì tự lấy; dòng thiếu thông tin tô đỏ – nhập đủ (có ô chọn nhóm cho nhiều dòng một lần) rồi bấm <b>Nạp … mã vào danh mục</b>. Có nút xuất Excel danh sách mã chưa có. Nếu phần mềm chọn sai cột mã thì đổi ở ô <i>Cột mã hàng</i>.</li>
   <li><b>Kho</b> là cột bắt buộc ở Danh mục hàng, Số dư đầu kỳ, Mua hàng, Bán hàng, Xuất dùng chung: chọn mã hàng là Kho tự điền theo Danh mục hàng (Danh mục hàng tự điền theo nhóm: vải / phụ liệu / nhãn → 152, thành phẩm → 155, hàng hóa → 156), sửa lại được. Báo cáo <b>Nhập – Xuất – Tồn</b>: ô <b>Nhóm</b> và ô <b>Kho</b> để tích xem 1 hoặc nhiều nhóm / kho (vd kho 152 + 156), dòng tổng và file Excel theo đúng các kho đã chọn.</li>
   <li><b>Thêm</b> mở hộp nhập riêng cho từng bảng (Mua hàng, Bán hàng, Lệnh SX, Định mức…): ô có <span style="color:#dc2626">*</span> bắt buộc nhập; ô mã hàng gõ để tìm; ô nền xám là phần mềm tự điền (tên hàng, ĐVT, thành tiền…). Enter sang ô kế tiếp, Esc = Hủy, bấm <b>Lưu</b> để ghi. Nút + NVL (Định mức) và Tách dòng (Mua hàng) cũng mở hộp này.</li>
   <li>Trên mỗi dòng: biểu tượng <b>bút</b> = Sửa, <b>thùng rác đỏ</b> = Xóa; khi đang sửa: <b>đĩa mềm xanh</b> = Lưu, <b>✕</b> = Hủy (phím Esc). Rê chuột lên biểu tượng để xem tên nút.</li></ul></details>
  <details><summary><b>Cảnh báo & kiểm tra</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Sai sót do thao tác</b> (tab <b>Kiểm tra số liệu</b>): gom mọi lỗi do nhập liệu / thao tác sai quy trình – chỉ hiện mục có lỗi, ghi <b>Nên xem</b> (vàng) hoặc <b>Cần xử lý</b> (đỏ), có chi tiết, cách xử lý và nút đi tới màn hình cần sửa. Đáng chú ý: <b>Sửa số liệu sau khi đã Tính giá thành</b> – phần mềm ghi lại Bán hàng, số công nhân, nhóm/lô cắt thành phẩm và tham số đề xuất lúc đề xuất từng tháng; sửa các số này sau đó thì lệnh SX của tháng đó không còn khớp → ▶ Tính giá thành → tick "Đề xuất lại từ đầu" từ tháng sớm nhất bị sửa. <b>Bán thành phẩm khi tồn chưa đủ</b> kiểm tra tồn theo từng ngày (hàng may xong cuối ngày nhập kho trước, bán sau). Toàn bộ chi tiết có trong sheet <i>SaiThaoTac</i> khi Xuất Excel.</li>
   <li><b>Chỉ tiêu theo tháng</b>: ô vàng = vượt ngưỡng cảnh báo, ô đỏ = vượt ngưỡng rủi ro cao (chiều ≥: càng lớn càng xấu; chiều ≤: càng nhỏ càng xấu). Tỷ lệ nhập dạng thập phân (0,6 = 60%).</li>
   <li><b>Rủi ro tồn kho</b>: mã âm kho xếp lên đầu. Ngưỡng theo <b>số ngày còn dùng</b> = tồn cuối ÷ bình quân/ngày: trên mốc Rủi ro → Rủi ro cao; trên một nửa mốc → Cảnh báo; dưới Tồn tối thiểu → Tồn thấp - cần mua. Âm kho và NVL còn tồn nhưng không dùng ở đâu luôn là Rủi ro cao; hàng DDH còn tồn luôn bị cảnh báo. Dòng ngưỡng theo mã ưu tiên hơn theo nhóm.</li>
   <li><b>NVL thiếu</b>: cân đối NVL tự động (mặc định chỉ cho vải & vải in) – mỗi dòng xuất vải chỉ xuất tối đa bằng tồn tại ngày xuất nên vải không âm; phần thiếu ghi ở đây. Phụ liệu được âm – xử lý sau bằng đề xuất cân đối. Nguyên nhân thường gặp: HĐ mua về sau, thiếu chứng từ mua, định mức cao hơn thực tế.</li></ul></details>
  <details><summary><b>Thiết lập & sao lưu</b></summary><ul style="margin:4px 0 8px 18px">
   <li><b>Sao lưu</b>: toàn bộ dữ liệu (nhiều năm) ra một file .json – nên sao lưu cuối mỗi tháng; <b>Phục hồi</b> sẽ thay toàn bộ dữ liệu hiện tại.</li>
   <li><b>Sang năm mới</b>: không cần thao tác – tồn cuối tháng 12 tự thành tồn đầu tháng 1 năm sau. <b>Mở sổ lại sau kiểm kê</b>: đổi Kỳ bắt đầu rồi nhập lại Tồn đầu kỳ; dữ liệu các kỳ trước vẫn giữ nhưng không còn ảnh hưởng số dư.</li>
   <li><b>Nạp dữ liệu năm 2026</b>: thay dữ liệu hiện có bằng dữ liệu chuyển từ file GT 12 - 26 DV. <b>Xóa dữ liệu</b>: xóa toàn bộ (nên sao lưu trước).</li>
   <li><b>Phân bổ 622 / 627</b>: chi phí của tháng chia cho 3 công đoạn Cắt – May – Đóng gói theo tỷ lệ; trong mỗi công đoạn chia cho các lệnh xuất NVL trong tháng theo tiêu thức đã chọn, rồi xuống từng dòng NVL theo tỷ trọng 621. Tỷ lệ nhập thập phân (0,75 = 75%); tổng tỷ lệ 622 và 627 mỗi loại phải = 100%.</li>
   <li><b>Tiêu thức chia trong công đoạn</b>:<ul style="margin:2px 0 0 18px"><li><b>SL quy đổi (bộ chuẩn)</b> = SL thực hiện × hệ số quy đổi – sát với thời gian công nhân (năng suất 40 bộ chuẩn / người / ngày). Phù hợp công đoạn <b>Cắt</b>, <b>May</b>.</li><li><b>Số sản phẩm</b> = SL thực hiện – mỗi sản phẩm như nhau. Phù hợp công đoạn <b>Đóng gói</b> (gấp, gắn thẻ, cho vào túi zip).</li><li><b>Chi phí NVL (621)</b> = theo giá trị NVL của lệnh (cách của file giá thành cũ: 622 / 621).</li><li>Tháng có chi phí nhưng không có lệnh xuất NVL → phần chi phí đó <b>chưa phân bổ</b> (cảnh báo ở Chi phí 622/627 và Cảnh báo & kiểm tra) – nhập số công nhân để phần mềm đề xuất <b>may tồn kho theo năng lực</b> cho tháng thấp điểm.</li></ul></li></ul></details>
  </div></div>
  <div class="box"><h3>Sơ đồ sản xuất & tính giá thành (theo file GT 12 - 26 DV)</h3><div class="small" style="line-height:1.7">
  <b>Gia công ngoài</b>: vải thô (VAI_DKCG_1) <b>gửi đi in</b> → nhận về <b>vải in</b> (VAI_IN, nhóm Bán thành phẩm). Giá trị vải in nhập kho = vải thô gửi (giá BQ tháng gửi) + phí dịch vụ in (V_IGC, giá BQ tháng nhận). Lô đã gửi chưa nhận = hàng đang gia công.<br>
  <b>May (1 cấp)</b>: vải / vải in + vải lót, thun, dây kéo, tem, túi zip → <b>Cắt</b> (mỗi lần cắt ${fmtN(num(prm.loMax))} bộ) → <b>May</b> (${fmtN(num(prm.nangSuat))} bộ chuẩn / người / ngày) → <b>Đóng gói</b> → thành phẩm nhập kho 155.<br>
  <b>2 dòng sản phẩm</b>: <b>DDH – may theo đơn</b> (AV.., QV.., chỉ bán cho AMIGO theo đơn – không để tồn) và <b>SX – may sẵn để bán</b> (có tồn kho, bán cho các đại lý).<br>
  <b>Bộ chuẩn</b>: quy đổi sản lượng theo công may – bộ / đầm / váy = 1, quần bơi = 0,5 (cột Hệ số quy đổi ở Danh mục).</div></div>
  <div class="box"><h3>Công thức áp dụng (khớp file Excel)</h3><ul class="tight small">
  <li><b>Ngày</b>: lệnh có <b>ngày xuất NVL</b> (bắt đầu may) và <b>ngày nhập kho TP</b> (hoàn thành). Chi phí 621 / 622 / 627 tính theo <b>tháng xuất NVL</b>; thành phẩm nhập kho theo <b>tháng nhập kho</b>. Lệnh xuất NVL tháng này, nhập kho tháng sau = <b>dở dang 154</b>; DDĐK + CP phát sinh − DDCK = giá thành nhập kho.</li>
  <li><b>SL theo định mức</b> = ROUND(SL × (1 + hao hụt) × định mức / 1 SP, 2). <b>Cân đối NVL tự động</b> (${num(prm.canDoi)===2?'đang áp dụng cho VẢI':num(prm.canDoi)===1?'đang BẬT cho mọi NVL':'đang TẮT'}): mặc định chỉ áp dụng cho <b>vải và vải in</b> – phụ liệu, nhãn mác… được âm để xử lý sau bằng đề xuất cân đối; mỗi dòng vải chỉ xuất tối đa bằng tồn tại ngày xuất (tồn đầu + mua + vải in nhận − vải gửi in − dịch vụ dùng − đã xuất trước) → không âm kho NVL; phần thiếu ghi ở cột Cân đối và thống kê ở Cảnh báo.</li>
  <li><b>Đơn giá NVL xuất</b> = giá bình quân gia quyền của tháng xuất = (tồn đầu + mua + nhận gia công) ÷ SL tương ứng.</li>
  <li><b>621</b> = Tổng SL xuất × Đơn giá. <b>622</b> = các cột nhóm 622 (lương + BH CN trực tiếp). <b>627</b> = các cột nhóm 627 + Xuất dùng chung loại 627.</li>
  <li><b>Phân bổ 622 / 627</b>: toàn bộ chi phí 622 và 627 của tháng chia cho các lệnh sản xuất xuất NVL trong tháng theo <b>${esc((TIEU_THUC[(A.cds[0]||{}).ts||'QD']||'').toLowerCase())}</b> (Thiết lập & sao lưu → Phân bổ 622/627). Ba công đoạn Cắt – May – Đóng gói không tách riêng vì cùng một xưởng, cùng công nhân. Xuống từng dòng NVL theo tỷ trọng 621.</li>
  <li><b>154</b> = 621 + 622 + 627; giá thành / đv lệnh = 154 ÷ SL thực hiện.</li>
  <li><b>Giá vốn BQ tháng</b> (NXT) = (tồn đầu tiền + nhập tiền) ÷ (tồn đầu SL + nhập SL); giá vốn hàng bán theo giá vốn BQ tháng bán.</li>
  <li>Đối chiếu với file Excel GT 12 - 26 DV (tháng 1–9/2026): ${'265'} lệnh, 1.789 dòng xuất NVL, NXT 12 tháng × 105 mã – xem báo cáo đối chiếu kèm theo.</li></ul></div>
  <div class="box"><h3>Đề xuất sản xuất – theo năng lực công nhân</h3><ul class="tight small">
  <li><b>Năng lực tháng</b> (bộ chuẩn) = số CN trực tiếp × ngày làm việc × ${fmtN(num(prm.nangSuat))} × hiệu suất ${fmtP(num(prm.hieuSuat))}. Ngày làm việc: Thứ 2 – Thứ 7, trừ ngày ở Lịch nghỉ; Chủ nhật tăng ca được tính.</li>
  <li><b>1-DDH – may theo đơn</b>: mỗi dòng HĐ bán = 1 lệnh, SL = SL bán − tồn sẵn có; nhập kho hằng ngày, đủ hàng trước ngày giao; ngày cắt lùi đủ số ngày may theo năng lực (SL quy đổi ÷ năng lực ngày, + 1 ngày cắt) – đơn nhiều bộ thì may nhiều ngày hơn, miễn xong trước ngày giao; không để tồn.</li>
  <li><b>Giới hạn ngày cắt</b>: ngày cắt (xuất NVL) sớm nhất là 1 tháng (31 ngày) trước ngày cần hàng. Nếu số công nhân không đủ để may kịp trong khoảng đó, lệnh vẫn được tạo nhưng nhập kho xong sau ngày giao – báo ở Cảnh báo & kiểm tra → Sai sót do thao tác → "Lệnh sản xuất may xong sau ngày cần hàng" (thường do nhập thiếu số công nhân ở Chi phí 622/627).</li>
  <li><b>2-SX – bù tồn hàng may sẵn</b>: xét từng dòng bán theo ngày; bán lấy hàng trong kho; nếu tồn không đủ cho dòng bán (cộng tồn an toàn) → cắt thêm theo <b>lô cắt</b> (mỗi mã 1 lần cắt ${num(prm.loMax)} SP; thiếu nhiều thì 200, 300…), cần có hàng trước ngày bán 1 ngày làm việc; ngày cắt lùi đủ số ngày may theo năng lực – hàng may theo đơn (DDH) làm đúng số lượng đơn.</li>
  <li><b>3-MT – may tồn kho theo năng lực</b> = MAX(0; năng lực − SL bán quy đổi hàng DDH − phần hàng SX còn phải bù) → chia cho hàng may sẵn theo tỷ trọng bán, làm tròn theo <b>lô cắt</b> (bội số ${fmtN(num(prm.loMax))} – cắt ra là phải may; mã có phần chia dưới nửa lô thì tháng đó không may tồn), rải các ngày làm việc trong tháng. Mục đích: sản lượng khớp với tiền lương đã trả, tháng thấp điểm vẫn có sản lượng; hàng may tồn được bán dần ở tháng sau nên lệnh bù giảm. Chưa nhập số CN → không phát sinh.</li>
  <li><b>4-Tay</b>: lệnh nhập tay ở Lệnh sản xuất (may hàng mẫu, may dự trữ…) – tính vào tồn trước khi phần mềm bù tồn.</li>
  <li><b>Tải theo ngày</b> (tab 1 – chi tiết): mỗi lệnh rải SL quy đổi đều trên các ngày làm việc từ ngày xuất NVL đến ngày nhập kho; vượt năng lực theo số CN → cảnh báo VƯỢT NĂNG LỰC.</li></ul></div>

  <div class="box"><h3>Thiết lập – ở đâu?</h3><ul class="tight small">
  <li>Thông số đề xuất và số công nhân từng tháng khi đã lưu hiện chữ đen (khóa) – bấm <b>Sửa</b> để chỉnh, xong bấm <b>Lưu</b> (Hủy = bỏ thay đổi; chuyển màn hình khi chưa Lưu phần mềm sẽ hỏi).</li>

// Tháng đã chạy đề xuất: lần Tính giá thành sau giữ nguyên Lệnh SX hiện có (kể cả phần sửa tay). Kỳ đề xuất = tháng của dòng bán / tháng may tồn kho (kyDX)

// Số liệu đầu vào của đề xuất lệnh SX một tháng: bán hàng, số công nhân, danh mục thành phẩm (nhóm, lô), tham số đề xuất

const DXSIG_T = {ban:'Bán hàng', cn:'Số công nhân', dm:'Danh mục thành phẩm (nhóm / lô cắt)', prm:'Tham số đề xuất'};
// Đề xuất lại từ đầu: xóa TOÀN BỘ lệnh sản xuất (đề xuất, sửa tay, nhập tay, nhập Excel) và cân đối NVL từ tháng đó trở về sau, rồi đề xuất lại
const resetHit = (o, ky) => kyDXof(o)>=ky || kyOf(o.ngaySX)>=ky;
function resetMonths(ky){ const s=new Set([ky]); state.orders.forEach(o=>{ if (resetHit(o,ky)) { s.add(kyDXof(o)); } }); state.adjustments.forEach(a=>{ const k=kyOf(a.ngaySX); if (k>ky) s.add(k); }); state.sales.forEach(r=>{ const k=kyOf(r.ngay); if (k>ky) s.add(k); }); proposedList().forEach(k=>{ if (k>ky) s.add(k); }); Object.keys(state.costs||{}).forEach(k=>{ if (k>ky && num((state.costs[k]||{}).soCN)>0) s.add(k); }); return [...s].filter(k=>k && k>=ky).sort(); }
function resetInfo(ky){ const ms=resetMonths(ky); const dels=state.orders.filter(o=>resetHit(o,ky)); const lk=new Set(ms.filter(k=>isLocked(k))); dels.forEach(o=>{ [kyOf(o.ngayXuatNVL), kyOf(o.ngaySX)].forEach(k=>{ if (k && isLocked(k)) lk.add(k); }); }); return {months:ms, ords:dels.length, adj:state.adjustments.filter(a=>kyOf(a.ngaySX)>=ky).length, locked:[...lk].sort()}; }
function resetProposal(ky){ const o0=state.orders.length, a0=state.adjustments.length; state.orders=state.orders.filter(o=>!resetHit(o,ky)); state.adjustments=state.adjustments.filter(a=>!(kyOf(a.ngaySX)>=ky)); state.settings.daDeXuat=proposedList().filter(k=>k<ky); calcCache=null; return {ords:o0-state.orders.length, adj:a0-state.adjustments.length}; }
// Chuyển một lần sang quy tắc lô cắt mới (DDH đúng SL đơn; SX theo nhu cầu bán, mỗi mã 1 lần cắt 100): đề xuất lại các tháng đã đề xuất từ đầu năm.
// Chỉ chạy khi mọi lệnh của năm đều do phần mềm đề xuất (chưa sửa / nhập tay) và chưa khóa kỳ nào – nếu không thì để người dùng tự làm bằng ▶ Tính giá thành → Đề xuất lại từ đầu.
function migrateLoCat(){ if (state.settings.loCat===2 || state.settings.loCat==='manual') return null; /* 2 = quy tắc 11/2026: SX cắt theo nhu cầu bán, DDH lùi ngày cắt theo năng lực */ const y=workYear(); const ms=proposedList().filter(k=>k.startsWith(y)); const ords=state.orders.filter(o=>kyDXof(o).startsWith(y) || kyOf(o.ngaySX).startsWith(y));
  state.settings.loCat=2; if (!ms.length || !ords.length) return null;

  if (!safe) { state.settings.loCat='manual'; return {skip:true}; }
  const n0=ords.length; resetProposal(ms[0]); calcCache=null; calc(); const pl=buildPlan(y); const r=applyPlanCore(pl, ms); calcCache=null; calcDirty=true; return {xoa:n0, moi:r.nNew, thang:ms}; }
/* ===== 📅 Chuyển ngày nhập kho: NVL thiếu / âm trong tháng mà phiếu nhập ghi ngày sau → đưa ngày nhập kho về ngày cần ===== */
const kyXong = k => k < todayKy(); // tháng đã kết thúc
const addMonthsD = (d,n) => { const [y,m,dd]=d.split('-').map(Number); const t=new Date(Date.UTC(y,m-1+n,1)); const last=new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate(); return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(dd,last)).padStart(2,'0')}`; };
// Chuyển ngày nhập kho – nguyên tắc: chỉ NVL có tồn cuối tháng âm (tính như xuất đủ định mức); chỉ chuyển vừa đủ phần âm,
// lấy phiếu mua của các tháng sau (sớm trước); ngày nhập mới = ngày xuất NVL bị thiếu sớm nhất mà ngày HĐ cách không quá 1 tháng;
// phiếu lớn hơn phần thiếu thì tách (giá trị chia theo tỷ lệ số lượng, làm tròn đồng)
function buildMoveProposal(k){
  const c=calc(); const p=c.periods[k]; if (!p) return {k, rows:[]};
  const items=itemMap(); const kEnd=addMonthsD(k+'-01',1); const rows=[];
  p.nxt.forEach(x=>{ const it=items[x.ma]; if (!it || isFinal(it) || isProd(it) || isHH(it) || isDV(it)) return;
    const ls=p.lines.filter(l=>l.maVT===x.ma);
    const thieu=sum(ls, l=>num(l.thieuSL)); const tonCuoi=round(num(x.closeSL)-thieu, 6); if (tonCuoi>-1e-9) return;
    let need=-tonCuoi;
    const dates=[...new Set(ls.filter(l=>l.thieuSL>1e-9 || l.tonSau<-1e-9).map(l=>l.ngayXuatNVL))].sort(); if (!dates.length) ls.forEach(l=>dates.push(l.ngayXuatNVL)); dates.sort();
    const cand=state.purchases.filter(r=>r.ma===x.ma && r.ngayNhap>=kEnd && num(r.sl)>0 && !isLocked(kyOf(r.ngayNhap))).sort((a,b)=>a.ngayNhap.localeCompare(b.ngayNhap)||num(b.sl)-num(a.sl));
    for (const r of cand) { if (need<=1e-9) break; const hd=r.ngayMua||r.ngayNhap;
      const d=dates.find(t=>t>=addMonthsD(hd,-1) && t<=addMonthsD(hd,1)); if (!d) continue; // ngày HĐ cách ngày nhập kho mới không quá 1 tháng
      const sl=num(r.sl); const q=round(Math.min(need, sl),6); if (q<=1e-9) continue; need=round(need-q,6);
      const ln=ls.find(l=>l.ngayXuatNVL===d);
      rows.push({ma:x.ma, ten:it.ten||'', dvt:it.dvt||'', d, maLenh:ln?ln.maLenh:'', thieu:q, r, q, sl, full:Math.abs(q-sl)<1e-9, hd, lech:dayDiff(d, hd), tonCuoi}); }
  });
  rows.sort((a,b)=>a.d.localeCompare(b.d)||a.ma.localeCompare(b.ma));
  return {k, rows};
}
function moveMonths(){ const y=workYear(); const c=calc(); return c.list.filter(k=>k.startsWith(y) && kyXong(k) && !isLocked(k)).filter(k=>{ try { return buildMoveProposal(k).rows.length>0; } catch(e){ return false; } }); }
function dcMonths(){ const y=workYear(); const c=calc(); return c.list.filter(k=>k.startsWith(y) && kyXong(k) && !isLocked(k)).filter(k=>{ try { return buildAdjProposal(c.periods[k]).rows.length>0; } catch(e){ return false; } }); }
function applyMoveCore(rows){ let mv=0, tach=0;
  rows.forEach(x=>{ const r=x.r; const cur=num(r.sl); if (!state.purchases.includes(r) || cur<=0) return; const old=r.ngayNhap; const q=Math.min(x.q, cur);
    if (q>=cur-1e-9) { if (!r.ngayGoc) r.ngayGoc=old; r.ngayNhap=x.d; mv++; }
    else { const ratio=q/cur; const nw={...r, _id:uid(), sl:round(q,6), tt:round(num(r.tt)*ratio,0), ngayNhap:x.d, ngayGoc:r.ngayGoc||old, tachTu:'1'};
      if (r.thueGTGT!=='' && r.thueGTGT!=null) { nw.thueGTGT=round(num(r.thueGTGT)*ratio,0); r.thueGTGT=num(r.thueGTGT)-nw.thueGTGT; }
      r.tt=num(r.tt)-nw.tt; r.sl=round(cur-q,6); state.purchases.splice(state.purchases.indexOf(r)+1, 0, nw); tach++; }
  });
  calcCache=null; return {mv, tach}; }
// ↩ Bỏ chuyển kho: trả phiếu mua đã chuyển ngày về ngày nhập kho gốc; phần đã tách thì gộp lại vào phiếu gốc
const movedRows = () => state.purchases.filter(r=>r.ngayGoc && r.ngayGoc!==r.ngayNhap && selHas(r.ngayNhap) && !isLocked(kyOf(r.ngayNhap)) && !isLocked(kyOf(r.ngayGoc)));
function undoMoveCore(rows){ let tra=0, gop=0; const key=r=>[r.ma,r.hoaDon,r.ncc,r.ngayMua,num(r.donGia)].join('|');
  rows.filter(r=>r.tachTu).forEach(c=>{ const par=state.purchases.find(p=>p!==c && !p.tachTu && key(p)===key(c) && (p.ngayGoc||p.ngayNhap)===c.ngayGoc);
    if (par) { par.sl=round(num(par.sl)+num(c.sl),6); par.tt=num(par.tt)+num(c.tt); if (c.thueGTGT!=='' && c.thueGTGT!=null) par.thueGTGT=num(par.thueGTGT)+num(c.thueGTGT); state.purchases.splice(state.purchases.indexOf(c),1); gop++; }
    else { c.ngayNhap=c.ngayGoc; c.ngayGoc=''; c.tachTu=''; tra++; } });
  rows.filter(r=>!r.tachTu && state.purchases.includes(r)).forEach(r=>{ r.ngayNhap=r.ngayGoc; r.ngayGoc=''; tra++; });
  calcCache=null; return {tra, gop}; }

      ${(()=>{  return d.rows.map((x,i)=>{ const gt=x.full?num(x.r.tt):Math.round(num(x.r.tt)*x.q/num(x.r.sl)); const gc=x.lech===0?'Trùng ngày hóa đơn':`HĐ ${x.lech>0?'sau':'trước'} ngày nhập kho mới ${Math.abs(x.lech)} ngày`;
